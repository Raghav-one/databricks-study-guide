  <div class="diagram-caption">Roll-up moves up the hierarchy to coarser aggregates; drill-down moves down toward the underlying detail rows.</div>
</div>

<ul>
  <li><strong>Drill-down and roll-up.</strong> Roll-up moves from detailed rows to a coarser aggregate (daily
  sales rolled up to monthly sales); drill-down does the reverse, moving from an aggregate back to the detail rows
  that produced it (clicking a monthly total to see the individual daily figures behind it). Dashboards and pivot
  tables commonly support both directions interactively, and <code>ROLLUP</code>/<code>CUBE</code> (section 8.2)
  are the SQL-level mechanism that produces the multiple aggregation levels a drill-down UI displays.</li>
</ul>

<h2>10.4 Governance and PII awareness for analysts</h2>
<p>An analyst writing an ordinary <code>SELECT *</code> against a customer table might expect to see every column
and every row that physically exists — but in a governed workspace, the query can return fewer columns or fewer
rows than the table actually contains, with no error, because Unity Catalog is enforcing security rules the
analyst didn't write and often can't see the definition of. A <strong>column mask</strong> can redact or hash a
sensitive column (like email or SSN) differently depending on who's asking, and a <strong>row filter</strong> can
silently exclude rows a given user isn't entitled to see (like restricting a regional manager to only their own
region's rows) — both are defined once by a governance/admin team and apply automatically to every query against
that table, including ones written by the Assistant or answered through Genie.</p>
<pre><code>-- The analyst runs an ordinary query with no awareness of masking...
SELECT customer_id, email, region, order_total
FROM main.sales.customers_orders;
-- ...but if a column mask is applied to 'email' and a row filter to 'region',
-- the result set returned can have a redacted email column and fewer rows
-- than the underlying table physically contains, with no error or warning.</code></pre>
<ul>
  <li><strong>Why this matters to an analyst.</strong> A query that returns fewer rows or oddly redacted values
  than expected is not necessarily a data quality bug — it may be governance working as designed. Recognizing that
  possibility (rather than assuming the data pipeline is broken) is a practical skill distinct from writing correct SQL.</li>
  <li><strong>Row-level security.</strong> Restricts which rows a given user or group can see in a table, applied
  transparently underneath any query against it — same table, same query text, different results per user.</li>
  <li><strong>Column-level security / masking.</strong> Restricts or transforms specific column values (full
  redaction, partial masking, hashing) based on the querying user's group membership, so sensitive fields like PII
  can live in a shared table without every consumer seeing raw values.</li>
  <li><strong>Analyst responsibility.</strong> Even without administrative access to define these policies, an
  analyst is expected to recognize when output looks masked or incomplete and to understand that requesting
  broader access is a governance request, not a query-syntax problem.</li>
  <li><strong>Data lineage as a diagnostic tool.</strong> Unity Catalog's lineage graph shows which tables, columns,
  notebooks, and dashboards a given table feeds into or was derived from. When a dashboard number looks wrong, an
  analyst can use lineage to trace it back to the source tables and upstream transformations rather than guessing
  where in the pipeline a problem might have been introduced — a practical habit distinct from, but complementary
  to, recognizing governance-driven redaction.</li>
</ul>

<h2>10.5 Communicating analytical results responsibly</h2>
<p>A technically correct query can still produce a misleading takeaway if the result is presented without the
context needed to interpret it correctly — this is a data-literacy skill distinct from SQL syntax, and it shows up
on the exam as scenario questions about what an analyst should do with a number, not how to compute it.</p>
<ul>
  <li><strong>Correlation vs. causation.</strong> Two metrics moving together (ice cream sales and drowning
  incidents both rising in summer) does not mean one causes the other — both may be driven by a third factor (warm
  weather) neither variable captures directly. An analyst reporting "X is correlated with Y" should not imply "X
  causes Y" without a mechanism or a controlled comparison to support it, and stakeholders often need this
  distinction stated explicitly rather than assumed obvious.</li>
  <li><strong>Sample size and small-N noise.</strong> A conversion rate computed from 12 visitors looks exactly as
  precise as one computed from 12,000 in a query result — both are just a decimal number — but the 12-visitor
  figure can swing wildly from one additional data point and shouldn't be presented with the same confidence.
  Reporting a rate without also surfacing the underlying count it was computed from hides this risk from the
  audience.</li>
  <li><strong>Survivorship and selection bias in a filtered query.</strong> A <code>WHERE</code> clause that
  filters to "customers still active today" before computing an average satisfaction score silently excludes
  everyone who churned — which can flatter the average by construction, since the very people most likely to have
  been dissatisfied are the ones the filter removed. Recognizing when a filter's criteria correlate with the
  outcome being measured is what separates a technically valid query from a misleading one.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam scenarios often describe an analyst who runs a correct, ordinary query and gets back a suspiciously
  redacted or incomplete result, then ask "what is happening" or "what should the analyst do." The correct
  reasoning is Unity Catalog row/column-level security silently filtering or masking the output for that user's
  identity — not a bug in the query, not corrupted data, and not something fixable by rewriting the SQL. The
  answer is to recognize governance is applying and, if broader access is genuinely needed, request it through
  the appropriate access-control process rather than trying to "work around" the masking in the query itself. A
  second, subtler trap pairs Genie or Assistant output with this same scenario: an AI-generated query returning
  incomplete results is still most likely explained by the same governance filtering applied to the user's
  identity, not by the AI tool having generated a wrong query — evaluate the permissions angle before assuming the
  generated SQL itself is at fault.
</div>

<h1>11. ELT with Spark SQL & Python</h1>

<h2>11.1 CTAS: rebuilding a table from a query</h2>
<p>Suppose a source system exports a full snapshot of its product catalog every night, and the downstream table
just needs to reflect whatever that snapshot says — no history, no merging, just "replace what's there with what's
new." The simplest way to build that table is to point a <code>SELECT</code> at the raw files and let the table
definition itself be the query result: run the query once, and whatever rows come back become the table. This
pattern — defining and populating a table in a single statement from a query — is called <strong>CTAS</strong>
(<strong>CREATE TABLE ... AS SELECT</strong>). It infers the schema from the query's output columns, so there is no
separate <code>CREATE TABLE (col1 INT, col2 STRING, ...)</code> step to keep in sync.</p>
<pre><code>CREATE OR REPLACE TABLE products AS
SELECT
  id,
  name,
  category,
  price,
  current_timestamp() AS ingested_at
FROM parquet.\`/mnt/raw/products/\`;</code></pre>
<ul>
  <li><strong>Full-refresh loads.</strong> CTAS is the natural fit whenever the correct output is "replace
  everything with the latest full extract" rather than "incrementally apply changes" — nightly dimension snapshots,
  small reference/lookup tables, or any rebuild-from-scratch scenario. <code>CREATE OR REPLACE TABLE ... AS SELECT</code>
  atomically swaps the table's contents; readers never see a half-rebuilt table because the swap happens via a new
  Delta transaction, not row-by-row deletion.</li>
  <li><strong>Schema inference and column control.</strong> CTAS pulls column names and types straight from the
  <code>SELECT</code> list, which is convenient but means a source schema change silently reshapes the target table.
  Casting or aliasing columns in the <code>SELECT</code> (e.g., <code>CAST(price AS DECIMAL(10,2)) AS price</code>)
  is the way to pin down types explicitly rather than trusting inference.</li>
  <li><strong>Not for incremental data.</strong> CTAS always evaluates its query against the full source and
  replaces the full target — it has no notion of "only the new rows since last time." For sources that arrive
  incrementally (new files landing continuously, upstream tables that grow), CTAS alone means reprocessing
  everything on every run, which gets expensive as data volume grows. That's the gap <code>MERGE INTO</code> and
  incremental ingestion patterns fill.</li>
</ul>

<h2>11.2 MERGE INTO: upserting changes</h2>
<p>Now suppose the source instead sends a daily batch of only the customers who changed — some are brand-new
signups, some are existing customers with an updated address or email. Reloading the whole customer table with CTAS
would work, but it throws away efficiency (rewriting millions of unchanged rows to update a few thousand) and loses
any target-only columns not in the source feed (like a "loyalty tier" computed downstream). What's needed instead is
a statement that looks at each incoming row, checks whether a matching row already exists by some key, and either
updates the existing row or inserts a new one. This conditional insert-or-update in a single atomic operation is
called an <strong>upsert</strong>, and in Spark SQL it's expressed with <strong>MERGE INTO</strong>.</p>
<pre><code>MERGE INTO customers AS target
USING customer_updates AS source
ON target.customer_id = source.customer_id
WHEN MATCHED THEN
  UPDATE SET
    target.email = source.email,
    target.address = source.address,
    target.updated_at = current_timestamp()
WHEN NOT MATCHED THEN
  INSERT (customer_id, email, address, updated_at)
  VALUES (source.customer_id, source.email, source.address, current_timestamp());</code></pre>

<div class="diagram">
  <svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="58" width="140" height="34" rx="5"></rect>
    <text x="90" y="79" text-anchor="middle" font-size="11" font-weight="600">source row</text>

    <path class="connector" d="M160 68 L248 30" marker-end="url(#arrowM1)"></path>
    <path class="connector" d="M160 82 L248 110" marker-end="url(#arrowM1)"></path>

    <rect x="250" y="10" width="150" height="34" rx="5"></rect>
    <text x="325" y="31" text-anchor="middle" font-size="10" font-weight="600">key matches target</text>
    <text x="470" y="31" text-anchor="middle" font-size="9" class="dim">→ UPDATE SET ...</text>

    <rect x="250" y="94" width="150" height="34" rx="5"></rect>
    <text x="325" y="115" text-anchor="middle" font-size="10" font-weight="600">key not in target</text>
    <text x="470" y="115" text-anchor="middle" font-size="9" class="dim">→ INSERT (...)</text>

    <defs>
      <marker id="arrowM1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">MERGE INTO evaluates the ON condition per row and branches to exactly one clause.</div>
</div>

<ul>
  <li><strong>Match condition.</strong> The <code>ON</code> clause defines the key used to line up source and
  target rows — typically a primary/business key like <code>customer_id</code>. Getting this wrong (e.g., matching
  on a non-unique column) causes a runtime error if a single target row would match multiple source rows, since
  Delta Lake can't determine which update to apply.</li>
  <li><strong>WHEN MATCHED / WHEN NOT MATCHED.</strong> <code>WHEN MATCHED</code> fires when a source row's key
  already exists in the target — typically paired with <code>UPDATE SET</code>. <code>WHEN NOT MATCHED</code>
  fires when the source row's key is new to the target — typically paired with <code>INSERT</code>. Both clauses
  can carry additional boolean conditions (e.g., <code>WHEN MATCHED AND source.is_deleted = true THEN DELETE</code>)
  to handle deletes or conditional logic within the same statement.</li>
  <li><strong>Idempotency.</strong> Running the same <code>MERGE</code> twice with the same source batch produces
  the same end state both times — matched rows just get updated to the same values again, and no duplicate inserts
  occur, because the second run still finds those keys already present. This makes <code>MERGE</code> safe to retry
  after a failure, which matters for pipeline reliability.</li>
</ul>

<h2>11.3 Incremental loading: COPY INTO vs Auto Loader</h2>
<p>Both CTAS and MERGE assume the incoming batch of new/changed data has already been identified somehow. The
remaining question is how files land in cloud storage get picked up for ingestion in the first place, without
reprocessing files already loaded on a previous run. Databricks offers two mechanisms for this, aimed at different
scales and operating modes.</p>
<table>
  <tr><th></th><th>COPY INTO</th><th>Auto Loader (<code>cloudFiles</code>)</th></tr>
  <tr><td><strong>Style</strong></td><td>Idempotent SQL command, run on a schedule</td><td>Structured Streaming
  source, runs continuously or in triggered micro-batches</td></tr>
  <tr><td><strong>File tracking</strong></td><td>Lists the source directory each run and compares against files
  already loaded</td><td>Uses a scalable file-notification or directory-listing mechanism with checkpointed state;
  designed for large, constantly-growing directories</td></tr>
  <tr><td><strong>Best fit</strong></td><td>Simpler, smaller-scale batch loads — thousands of files, periodic
  runs</td><td>Continuously arriving files at scale — millions of files, near-real-time ingestion</td></tr>
  <tr><td><strong>Schema handling</strong></td><td>Fixed schema, or manually specified</td><td>Schema inference and
  schema evolution built in — new columns in later files can be detected and added automatically</td></tr>
</table>
<pre><code>-- COPY INTO: simple, idempotent batch load
COPY INTO sales_bronze
FROM '/mnt/raw/sales/'
FILEFORMAT = JSON
COPY_OPTIONS ('mergeSchema' = 'true');</code></pre>
<pre><code># Auto Loader: streaming ingestion with schema inference/evolution
df = (spark.readStream
      .format("cloudFiles")
      .option("cloudFiles.format", "json")
      .option("cloudFiles.schemaLocation", "/mnt/checkpoints/sales/schema")
      .load("/mnt/raw/sales/"))

(df.writeStream
   .option("checkpointLocation", "/mnt/checkpoints/sales/write")
   .trigger(availableNow=True)
   .toTable("sales_bronze"))</code></pre>
<ul>
  <li><strong>When to reach for COPY INTO.</strong> A daily batch drop of a few thousand files into a known
  directory, where a straightforward "load what's new" run on a schedule is enough — COPY INTO tracks already-loaded
  files internally so re-running it doesn't duplicate data, without the overhead of a streaming checkpoint.</li>
  <li><strong>When to reach for Auto Loader.</strong> Files arriving continuously and at high volume — IoT event
  streams, clickstream logs, or any source where the file count grows into the millions — where COPY INTO's
  directory-listing approach becomes slow, and where schema evolution needs to be handled automatically rather than
  breaking the pipeline when a new column shows up.</li>
  <li><strong><code>trigger(availableNow=True)</code>.</strong> Auto Loader is a streaming source, but it doesn't
  have to run forever — <code>availableNow=True</code> processes all currently available new files and then stops,
  giving batch-like scheduling semantics (run it via a Job on a schedule) while keeping Auto Loader's scalable file
  discovery and schema evolution.</li>
</ul>

<h2>11.4 PySpark DataFrame basics, mirrored against SQL</h2>
<p>An analyst comfortable writing <code>SELECT ... WHERE ... GROUP BY</code> can transfer that knowledge almost
directly into PySpark: every core SQL clause has a corresponding DataFrame method, and the two can even be mixed in
the same notebook, because a DataFrame can be queried as SQL via <code>createOrReplaceTempView</code> and a SQL
result can be pulled back into a DataFrame via <code>spark.sql(...)</code>. The table below lines up the equivalent
forms.</p>
<table>
  <tr><th>SQL</th><th>PySpark DataFrame</th></tr>
  <tr><td><code>SELECT name, price FROM products</code></td>
      <td><code>df.select("name", "price")</code></td></tr>
  <tr><td><code>SELECT * FROM products WHERE price > 100</code></td>
      <td><code>df.filter(df.price > 100)</code></td></tr>
  <tr><td><code>SELECT category, COUNT(*) FROM products GROUP BY category</code></td>
      <td><code>df.groupBy("category").count()</code></td></tr>
  <tr><td><code>SELECT o.id, c.name FROM orders o JOIN customers c ON o.customer_id = c.id</code></td>
      <td><code>orders.join(customers, orders.customer_id == customers.id).select("id", "name")</code></td></tr>
</table>
<pre><code># PySpark
from pyspark.sql.functions import col, count

result = (spark.table("products")
          .filter(col("price") > 100)
          .groupBy("category")
          .agg(count("*").alias("num_products")))

result.display()</code></pre>
<pre><code>-- Equivalent SQL
SELECT category, COUNT(*) AS num_products
FROM products
WHERE price > 100
GROUP BY category;</code></pre>
<ul>
  <li><strong>Lazy evaluation.</strong> Chaining <code>.select()</code>, <code>.filter()</code>, and
  <code>.groupBy()</code> calls builds up a query plan but runs nothing until an action — <code>.display()</code>,
  <code>.collect()</code>, <code>.count()</code>, or a write — is called. This mirrors how a SQL query isn't
  executed until it's run; the DataFrame API is just a programmatic way to build the same query plan.</li>
  <li><strong>Column references.</strong> <code>df.price</code>, <code>df["price"]</code>, and
  <code>col("price")</code> are three equivalent ways to reference a column in PySpark; <code>col()</code> is the
  safest choice inside chained expressions because it doesn't require the DataFrame variable to be in scope at that
  point.</li>
  <li><strong>Mixing SQL and DataFrames.</strong> <code>spark.sql("SELECT * FROM products")</code> returns a
  DataFrame, and any DataFrame can be registered as a temporary view with
  <code>df.createOrReplaceTempView("my_view")</code> to query it with SQL — the two APIs operate on the same
  underlying execution engine and can be freely interleaved in one notebook.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam questions frequently describe a scenario where files arrive continuously at high volume and ask which
  ingestion tool to use — the trap is picking <code>COPY INTO</code> because it's "simpler" when the described
  volume/frequency (constant, large-scale) points to Auto Loader, or vice versa: picking Auto Loader for a small,
  periodic batch job where COPY INTO is the lighter-weight fit. Also watch for <code>MERGE INTO</code> questions
  that omit or misuse the match condition — a match on a non-unique key causes a runtime failure, and that failure
  mode ("MERGE cannot resolve...multiple source rows matched") is a common distractor-answer trigger.
</div>

<h1>12. Multi-Hop / Medallion Pipelines in Practice</h1>

<h2>12.1 From concept to code</h2>
<p>Section 2 introduced the medallion architecture as a conceptual staging pattern — raw data lands in bronze,
gets cleaned into silver, and gets aggregated into gold, each hop its own Delta table. Knowing the picture isn't
the same as being able to write it: someone still has to write the actual PySpark or SQL that reads bronze, applies
the cleaning rules, and writes silver, and then write the code that reads silver and writes gold. This section is
about that implementation — the concrete statements that move data across hops, not the conceptual layering itself.
A minimal bronze table is often close to a raw copy of the source, ingested with Auto Loader or <code>COPY INTO</code>
(covered in section 11) and largely untransformed:</p>
<pre><code># Bronze: raw ingestion, minimal transformation
bronze_df = (spark.readStream
             .format("cloudFiles")
             .option("cloudFiles.format", "json")
             .option("cloudFiles.schemaLocation", "/mnt/checkpoints/orders/schema")
             .load("/mnt/raw/orders/")
             .withColumn("_ingested_at", current_timestamp())
             .withColumn("_source_file", col("_metadata.file_path")))

(bronze_df.writeStream
   .option("checkpointLocation", "/mnt/checkpoints/orders/bronze")
   .trigger(availableNow=True)
   .toTable("orders_bronze"))</code></pre>
<p>The silver hop is where real cleaning happens: casting types, dropping or fixing malformed rows, deduplicating,
and joining in reference data. Each of those is an ordinary DataFrame transformation — what makes it a "hop" is
simply that its output is written to its own table rather than passed along in memory.</p>
<pre><code># Silver: cast types, deduplicate, enrich with reference data, drop bad rows
from pyspark.sql.functions import col, to_timestamp, current_timestamp

bronze = spark.readStream.table("orders_bronze")
customers = spark.table("customers_silver")

silver_df = (bronze
    # 1. Cast loose bronze types into real types
    .withColumn("order_total", col("order_total").cast("decimal(10,2)"))
    .withColumn("order_ts", to_timestamp(col("order_timestamp")))
    # 2. Drop structurally invalid rows
    .filter(col("customer_id").isNotNull())
    .filter(col("order_total") > 0)
    # 3. Deduplicate on the business key, keeping one row per order
    .dropDuplicates(["order_id"])
    # 4. Enrich by joining reference/dimension data
    .join(customers.select("customer_id", "region", "segment"), "customer_id", "left")
    .withColumn("_processed_at", current_timestamp()))

(silver_df.writeStream
   .option("checkpointLocation", "/mnt/checkpoints/orders/silver")
   .trigger(availableNow=True)
   .toTable("orders_silver"))</code></pre>
<p>The gold hop is built the same way, reading silver and aggregating it into the shape a dashboard or report
actually queries — the transformation vocabulary is section 11's aggregation patterns
(<code>GROUP BY</code>, window functions), applied at this final hop.</p>
<pre><code># Gold: business-level aggregate, rebuilt from silver
from pyspark.sql.functions import sum as _sum, countDistinct, date_trunc

gold_df = (spark.table("orders_silver")
    .withColumn("order_month", date_trunc("month", col("order_ts")))
    .groupBy("order_month", "region")
    .agg(_sum("order_total").alias("total_revenue"),
         countDistinct("customer_id").alias("unique_customers"),
         countDistinct("order_id").alias("num_orders")))

(gold_df.write
    .mode("overwrite")
    .saveAsTable("orders_monthly_by_region_gold"))</code></pre>
<pre><code>-- The same gold hop expressed in SQL
CREATE OR REPLACE TABLE orders_monthly_by_region_gold AS
SELECT
  date_trunc('month', order_ts)      AS order_month,
  region,
  SUM(order_total)                   AS total_revenue,
  COUNT(DISTINCT customer_id)        AS unique_customers,
  COUNT(DISTINCT order_id)           AS num_orders
FROM orders_silver
GROUP BY date_trunc('month', order_ts), region;</code></pre>
<p>Note the write modes differ by hop for a reason: bronze and silver append (or stream) because they accumulate
history, while this gold aggregate uses <code>overwrite</code> because it's a derived summary that should always
reflect the current state of silver rather than accumulating stale rows. The interesting new material at the silver
hop is data quality enforcement, covered next.</p>

<h2>12.2 Enforcing data quality with table constraints</h2>
<p>A silver table is supposed to be the trustworthy version of the data — the one downstream jobs and gold tables
build on without re-checking it. But nothing stops a bad write from slipping in a null customer ID or a negative
order total unless something actively rejects it. Delta Lake lets a table declare rules about its own data that
every future write must satisfy, enforced by the engine itself rather than by hoping every writer remembers to
filter correctly. These declared rules are <strong>table constraints</strong>, and a write that violates one fails
outright rather than silently corrupting the table.</p>
<pre><code>-- NOT NULL: column must always have a value
ALTER TABLE orders_silver ALTER COLUMN customer_id SET NOT NULL;

-- CHECK: arbitrary boolean condition every row must satisfy
ALTER TABLE orders_silver
  ADD CONSTRAINT positive_total CHECK (order_total > 0);

-- Attempting to violate either constraint raises an error and the write fails
INSERT INTO orders_silver VALUES (NULL, -5.00, current_timestamp());
-- Error: NOT NULL constraint violated / CHECK constraint 'positive_total' violated</code></pre>
<ul>
  <li><strong>NOT NULL constraints.</strong> Declared with <code>ALTER TABLE ... ALTER COLUMN col SET NOT NULL</code>,
  this rejects any write that would insert a null into that column. It's the simplest and cheapest constraint to
  enforce and typically applies to key columns that every downstream join or lookup depends on.</li>
  <li><strong>CHECK constraints.</strong> Declared with <code>ALTER TABLE ... ADD CONSTRAINT name CHECK (condition)</code>,
  this rejects any write where the boolean expression evaluates to false for a row — enforcing business rules like
  "order total must be positive" or "status must be one of a known set" directly at the table level, rather than
  relying on every upstream job to apply the same filter correctly.</li>
  <li><strong>Constraints reject, they don't clean.</strong> A constraint violation fails the entire write (or the
  offending rows, depending on how the write is structured) rather than fixing the data — a constraint is a
  guardrail that stops bad data from entering the table, not a transformation step that repairs it. This is why
  constraints are typically added to silver/gold tables after the cleaning logic already runs, as a backstop, not
  as a substitute for that logic.</li>
</ul>

<h2>12.3 Quarantining bad records instead of dropping them silently</h2>
<p>A constraint stops bad data from landing in the trusted table, but simply discarding rows that fail validation
means losing visibility into what's going wrong upstream — nobody notices a source system started sending null
customer IDs until someone asks why order counts look low. The better pattern is to split incoming data into two
streams during the bronze-to-silver transformation: rows that pass validation go to the silver table as normal, and
rows that fail go to a separate <strong>quarantine table</strong> where they can be inspected, alerted on, and
potentially reprocessed once the upstream issue is fixed.</p>
<pre><code>from pyspark.sql.functions import col

bronze = spark.table("orders_bronze")

is_valid = (col("customer_id").isNotNull()) & (col("order_total") > 0)

valid_orders = bronze.filter(is_valid)
invalid_orders = bronze.filter(~is_valid)

(valid_orders.write
    .mode("append")
    .saveAsTable("orders_silver"))

(invalid_orders.write
    .mode("append")
    .saveAsTable("orders_quarantine"))</code></pre>

<div class="diagram">
  <svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="58" width="120" height="34" rx="5"></rect>
    <text x="70" y="79" text-anchor="middle" font-size="11" font-weight="600">orders_bronze</text>

    <path class="connector" d="M130 68 L228 30" marker-end="url(#arrow3)"></path>
    <path class="connector" d="M130 82 L228 110" marker-end="url(#arrow3)"></path>

    <rect x="230" y="10" width="150" height="34" rx="5"></rect>
    <text x="305" y="31" text-anchor="middle" font-size="11" font-weight="600">orders_silver</text>
    <text x="440" y="31" text-anchor="middle" font-size="9" class="dim">is_valid rows</text>

    <rect x="230" y="94" width="150" height="34" rx="5"></rect>
    <text x="305" y="115" text-anchor="middle" font-size="11" font-weight="600">orders_quarantine</text>
    <text x="440" y="115" text-anchor="middle" font-size="9" class="dim">~is_valid rows</text>

    <defs>
      <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">Every bronze row lands in exactly one table — none are silently dropped.</div>
</div>

<ul>
  <li><strong>Splitting valid vs. invalid.</strong> The same boolean condition that would otherwise be a
  <code>WHERE</code> filter is used twice — once to keep only passing rows for the trusted table, and once negated
  (<code>~is_valid</code>) to capture exactly the rows that failed, so every input row lands in exactly one of the
  two output tables and nothing is silently dropped.</li>
  <li><strong>Why quarantine instead of drop.</strong> A quarantine table preserves the failing records for
  debugging (what exactly was wrong, how many rows, which source file), for alerting (a spike in quarantined rows
  signals an upstream problem worth paging someone about), and for potential recovery (once the root cause is
  fixed, the quarantined rows can be corrected and re-inserted into silver rather than being gone forever).</li>
  <li><strong>Quarantine tables and constraints together.</strong> A common combined pattern is: filter into
  valid/invalid before the write (application-level quarantine as shown above), and also add a <code>CHECK</code>
  constraint on the silver table itself as a second line of defense, so even if the filtering logic has a bug, the
  constraint still prevents bad rows from reaching silver — it just fails the write instead of routing it
  automatically, which is why filtering is usually the primary mechanism and constraints are the backstop.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  A scenario describing rows that fail validation and asks "what happens to them" is testing whether the reader
  conflates <code>CHECK</code> constraints with data cleaning: a constraint on the target table causes the write to
  fail (or reject the violating rows, depending on write mode) — it does not automatically route bad rows anywhere.
  Building an actual quarantine table requires application-level filtering logic (as in 11.3), not just declaring a
  constraint and expecting failed rows to land somewhere useful. Conversely, don't assume constraints "clean" data —
  they only ever accept or reject, never transform.
</div>

<h1>13. Databricks Workflows & Orchestration</h1>

<h2>13.1 Jobs and tasks</h2>
<p>A single notebook that ingests bronze data is only one piece of a real pipeline — after it runs, something needs
to trigger the silver transformation notebook, then the gold aggregation, then maybe refresh a dashboard, and if any
step fails, someone or something needs to know. Running each notebook by hand in order, every day, doesn't scale
and doesn't recover from failures on its own. Databricks' answer is a scheduling and orchestration layer that wires
individual units of work together into a pipeline, runs them in the right order automatically, and handles retries
and alerting. In Databricks terminology, this unit of orchestration is called a <strong>Job</strong>, and a Job is
made up of one or more <strong>Tasks</strong> — the simplest Job is a single task (e.g., "run this notebook"), while
a real pipeline is usually a Job with multiple tasks chained together.</p>
<p><strong>Naming note.</strong> This orchestration product has been called <strong>Databricks Workflows</strong>
and is now branded <strong>Lakeflow Jobs</strong> as part of the broader Lakeflow family (which also covers
declarative pipelines, section 14). Exam material and documentation use both names during the transition — they
refer to the same Jobs/Tasks/triggers model described here, so treat "Workflows," "Lakeflow Jobs," and "Jobs" as
interchangeable when they appear in a question.</p>
<table>
  <tr><th>Task type</th><th>What it runs</th></tr>
  <tr><td><strong>Notebook</strong></td><td>A Databricks notebook, optionally parameterized with widget values
  passed in at run time</td></tr>
  <tr><td><strong>Python script</strong></td><td>A <code>.py</code> file, run as a script rather than a
  notebook</td></tr>
  <tr><td><strong>SQL</strong></td><td>A SQL query, file, or dashboard refresh executed against a SQL
  warehouse</td></tr>
  <tr><td><strong>dbt</strong></td><td>A dbt project's models, run via the dbt task type with Databricks as the
  target warehouse</td></tr>
  <tr><td><strong>Pipeline (DLT)</strong></td><td>Triggers a Delta Live Tables pipeline (section 14) as one step
  in a larger Job</td></tr>
</table>

<h2>13.2 Task dependencies and the DAG</h2>
<p>Once a Job has more than one task, the order they run in matters — the silver task must not start before bronze
finishes, and gold must wait on silver. Each task can declare which other tasks it <strong>depends on</strong>; the
Jobs UI then draws these dependencies as a graph, and at run time Databricks only starts a task once all of its
declared dependencies have completed successfully. Because dependencies only ever point forward (a task can't
depend on something that depends on it), the resulting structure is a <strong>DAG</strong> — a directed acyclic
graph — and the Jobs UI's task graph view is literally that DAG rendered visually, with tasks that have no
dependency on each other shown able to run in parallel.</p>
<pre><code>{
  "tasks": [
    { "task_key": "bronze_ingest", "notebook_task": { "notebook_path": "/pipelines/bronze" } },
    {
      "task_key": "silver_clean",
      "depends_on": [{ "task_key": "bronze_ingest" }],
      "notebook_task": { "notebook_path": "/pipelines/silver" }
    },
    {
      "task_key": "gold_aggregate",
      "depends_on": [{ "task_key": "silver_clean" }],
      "notebook_task": { "notebook_path": "/pipelines/gold" }
    }
  ]
}</code></pre>

<div class="diagram">
  <svg viewBox="0 0 560 150" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="58" width="130" height="34" rx="5"></rect>
    <text x="75" y="79" text-anchor="middle" font-size="11" font-weight="600">bronze_ingest</text>

    <path class="connector" d="M140 68 L228 30" marker-end="url(#arrow4)"></path>
    <path class="connector" d="M140 82 L228 110" marker-end="url(#arrow4)"></path>

    <rect x="230" y="10" width="130" height="34" rx="5"></rect>
    <text x="295" y="31" text-anchor="middle" font-size="11" font-weight="600">silver_clean_a</text>
    <rect x="230" y="94" width="130" height="34" rx="5"></rect>
    <text x="295" y="115" text-anchor="middle" font-size="11" font-weight="600">silver_clean_b</text>

    <path class="connector" d="M360 30 L448 68" marker-end="url(#arrow4)"></path>
    <path class="connector" d="M360 110 L448 82" marker-end="url(#arrow4)"></path>

    <rect x="450" y="58" width="110" height="34" rx="5"></rect>
    <text x="505" y="79" text-anchor="middle" font-size="11" font-weight="600">gold_aggregate</text>

    <defs>
      <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">Fan-out from bronze_ingest, fan-in to gold_aggregate — gold waits on both silver tasks.</div>
</div>

<ul>
  <li><strong>Fan-out and fan-in.</strong> Multiple tasks can depend on the same upstream task (fan-out, e.g. two
  independent silver tables both built from the same bronze table) and a single task can depend on multiple
  upstream tasks (fan-in, e.g. a gold task that joins two silver tables and only starts once both are done) — the
  DAG shape isn't restricted to a straight line.</li>
  <li><strong>Failure short-circuits downstream tasks.</strong> If a task fails and exhausts its retries, tasks that
  depend on it are skipped rather than run against incomplete upstream data — the DAG structure is what makes this
  automatic, since a task only becomes eligible to run once its dependencies report success.</li>
</ul>

<h2>13.3 Triggers</h2>
<p>A Job doesn't run itself — something has to decide when it starts. Databricks supports several ways to kick off
a run, chosen based on how the data arrives and how fresh the output needs to be.</p>
<table>
  <tr><th>Trigger type</th><th>When it fires</th></tr>
  <tr><td><strong>Manual</strong></td><td>An operator clicks "Run now" in the UI or calls the Jobs API directly —
  no automatic schedule</td></tr>
  <tr><td><strong>Scheduled (cron)</strong></td><td>Runs on a cron expression (e.g., daily at 2 AM) — the common
  choice for regular batch pipelines</td></tr>
  <tr><td><strong>File arrival</strong></td><td>Runs when new files are detected landing in a specified cloud
  storage location — useful when upstream delivery timing is irregular</td></tr>
  <tr><td><strong>Continuous</strong></td><td>The Job restarts immediately upon completion (or failure) of the
  previous run, effectively running as close to continuously as the workload allows</td></tr>
</table>

<h2>13.4 Retries and alerting</h2>
<p>Transient failures happen — a cluster takes a moment too long to start, a network blip drops a connection to a
source API — and treating every such failure as a hard pipeline failure requiring human intervention wastes
everyone's time. Jobs let each task declare a <strong>retry policy</strong>: how many times to automatically retry
before giving up, and optionally to retry specifically on a timeout rather than any failure. Separately, because
nobody wants to babysit a Jobs UI waiting for a run to finish, Jobs support <strong>notifications</strong> that fire
on specific run events, sent via email or a webhook to external systems (Slack, PagerDuty, a custom endpoint).</p>
<pre><code>{
  "task_key": "silver_clean",
  "notebook_task": { "notebook_path": "/pipelines/silver" },
  "max_retries": 2,
  "min_retry_interval_millis": 30000,
  "retry_on_timeout": true,
  "timeout_seconds": 3600,
  "email_notifications": {
    "on_failure": ["data-team@example.com"],
    "on_success": []
  }
}</code></pre>
<ul>
  <li><strong>max_retries.</strong> The number of times a failed task is automatically re-run before the Job gives
  up and marks the run as failed; each retry is a fresh attempt, not a resume from where the failure occurred.</li>
  <li><strong>retry_on_timeout.</strong> Controls whether a task that exceeded its configured timeout is treated
  as retryable — separating "the task ran too long" from other failure causes lets a Job retry timeouts (which may
  just need more time or a warmer cluster) while still failing fast on, say, a permission error that a retry can't
  fix.</li>
  <li><strong>Notifications on start/success/failure.</strong> Alerts can be configured per event — on start (rare,
  mostly for long-running critical jobs), on success (confirms a pipeline completed, useful for downstream
  consumers waiting on it), and on failure (the most commonly configured, so a broken pipeline gets noticed quickly
  rather than silently sitting broken until someone checks the UI).</li>
</ul>

<h2>13.5 Jobs UI and jobs-as-code</h2>
<p>Everything above — tasks, dependencies, triggers, retries, notifications — can be configured by clicking through
the Jobs UI, which renders the task graph visually and is the natural way to build and inspect a Job interactively.
For production pipelines managed through CI/CD, the same configuration can instead be expressed as JSON (as shown
in the examples above) and deployed via the Jobs API, Databricks Asset Bundles, or Terraform, so a Job's definition
lives in version control alongside the code it runs rather than only existing as UI clicks nobody can diff or
review.</p>

<h2>13.6 CI/CD and Databricks Asset Bundles</h2>
<p>A pipeline that works in a development workspace still has to get promoted to staging and then production —
with the same code, but pointing at different catalogs, different cluster sizes, and different schedules. Doing that
by manually recreating Jobs in each workspace is error-prone and unreviewable; the alternative is to define the Job,
its tasks, and its environment-specific settings as files in a Git repo, and deploy them with a command.
<strong>Databricks Asset Bundles (DABs)</strong> are the native mechanism for this: a YAML definition of a
project's jobs, pipelines, and their configuration, with per-environment overrides ("targets") so one definition
deploys correctly to dev, staging, and prod.</p>
<pre><code># databricks.yml — a minimal Asset Bundle definition
bundle:
  name: orders_pipeline

resources:
  jobs:
    orders_etl:
      name: orders_etl
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./notebooks/bronze.py
        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ./notebooks/silver.py

targets:
  dev:
    default: true
    workspace:
      host: https://dev.cloud.databricks.com
  prod:
    workspace:
      host: https://prod.cloud.databricks.com
    resources:
      jobs:
        orders_etl:
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: "UTC"</code></pre>
<pre><code># Validate, deploy, and run a bundle from the Databricks CLI
databricks bundle validate
databricks bundle deploy -t dev
databricks bundle run orders_etl -t dev

# Promote the identical definition to production
databricks bundle deploy -t prod</code></pre>
<ul>
  <li><strong>Environment promotion without code edits.</strong> The same task definitions deploy to every target;
  only the <code>targets</code> block differs (workspace host, schedule, cluster sizing, catalog names). This is
  what makes "it worked in dev" a meaningful statement — prod runs the identical pipeline definition, not a
  hand-recreated approximation of it.</li>
  <li><strong>Git as the source of truth.</strong> Because the bundle lives in a repo, a change to a Job's schedule
  or task graph goes through the same pull-request review as a change to the notebook code itself, and the deployed
  state can always be traced back to a specific commit — versus UI-configured Jobs, where nobody can diff what
  changed or who changed it.</li>
  <li><strong>Where Repos fit.</strong> Databricks Repos (section 3.4) handles Git integration for the notebook
  source; Asset Bundles handle the surrounding job/pipeline definitions and deployment. A production Job typically
  references code at a specific Git branch/tag while its own configuration is deployed by a bundle.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  A common exam trap is conflating a "Job" with a "Task" — a Job is the overall scheduled/triggered unit that can
  contain many tasks; asking "how many jobs are needed to run three dependent notebooks in order" has the answer
  "one Job with three tasks and dependencies," not three separate Jobs. Also watch for retry vs. trigger confusion:
  retries re-run a failed task within the same job run, while a "continuous" trigger starts an entirely new run
  after the previous one ends — they solve different problems (transient task failure vs. wanting the pipeline to
  keep running) and aren't interchangeable.
</div>

<h1>14. Delta Live Tables Fundamentals</h1>

<h2>14.1 Declarative pipelines vs. imperative notebooks</h2>
<p>The bronze-to-silver-to-gold pipelines built in section 12 were written imperatively: a notebook reads bronze,
transforms it, writes silver; a second notebook reads silver, transforms it, writes gold; a Job (section 13) wires
the two together with an explicit dependency so silver runs before gold. Every mechanical detail — which table to
read first, when to trigger the next step, what to do if a step fails partway, how big a cluster to use — is
something the engineer decided and wired up by hand. An alternative approach is to instead just describe what each
table should contain — "silver is bronze filtered to valid rows," "gold is silver aggregated by day" — and let the
platform figure out the run order, retries, and cluster sizing on its own, inferring the bronze-before-silver-before-gold
order automatically from the fact that silver's definition reads from bronze. This is the idea behind
<strong>Delta Live Tables (DLT)</strong>: pipelines are defined <strong>declaratively</strong> (describing the
desired end state of each table) rather than <strong>imperatively</strong> (scripting the exact steps to get
there), and DLT's runtime handles execution order, retries, and compute management on the engineer's behalf.</p>
<table>
  <tr><th></th><th>Imperative (sections 10-11 style)</th><th>Declarative (DLT)</th></tr>
  <tr><td><strong>What you write</strong></td><td>Explicit read/transform/write steps, in order</td><td>A table
  definition (a query), for each table</td></tr>
  <tr><td><strong>Execution order</strong></td><td>Determined by the engineer, wired via Job task
  dependencies</td><td>Inferred automatically from which tables reference which other tables</td></tr>
  <tr><td><strong>Retries / clusters</strong></td><td>Configured manually per Job/task</td><td>Managed by the DLT
  runtime</td></tr>
  <tr><td><strong>Data quality</strong></td><td>Hand-written filtering/quarantine logic (section 12.3)</td><td>Built-in
  declarative expectations (14.3)</td></tr>
</table>

<h2>14.2 Defining live tables</h2>
<p>In DLT, each table in the pipeline is defined once, as a query, decorated to tell DLT "this is a table this
pipeline owns." In Python, this is the <code>@dlt.table</code> decorator on a function that returns a DataFrame; in
SQL, it's a <code>CREATE OR REFRESH</code> statement naming the table. The exact SQL keywords have evolved over
DLT's releases (older material may show <code>LIVE TABLE</code>; newer material distinguishes
<code>STREAMING TABLE</code> from a materialized view) — at associate depth, the important thing is recognizing the
pattern (a decorated function or a <code>CREATE OR REFRESH</code> statement defines a table DLT manages) rather than
memorizing one exact syntax revision.</p>
<pre><code># Python: bronze table, reading raw files with Auto Loader semantics
import dlt
from pyspark.sql.functions import col, current_timestamp

@dlt.table(
    comment="Raw orders, ingested as-is from landing storage"
)
def orders_bronze():
    return (
        spark.readStream.format("cloudFiles")
        .option("cloudFiles.format", "json")
        .load("/mnt/raw/orders/")
        .withColumn("_ingested_at", current_timestamp())
    )

# Python: silver table, defined in terms of the bronze table above
@dlt.table(
    comment="Cleaned orders with valid customer_id and positive totals"
)
def orders_silver():
    return (
        dlt.read_stream("orders_bronze")
        .filter(col("customer_id").isNotNull())
        .filter(col("order_total") > 0)
    )</code></pre>
<pre><code>-- SQL: the same bronze/silver pair
CREATE OR REFRESH STREAMING TABLE orders_bronze
COMMENT "Raw orders, ingested as-is from landing storage"
AS SELECT *, current_timestamp() AS _ingested_at
FROM cloud_files("/mnt/raw/orders/", "json");

CREATE OR REFRESH STREAMING TABLE orders_silver
COMMENT "Cleaned orders with valid customer_id and positive totals"
AS SELECT * FROM STREAM(LIVE.orders_bronze)
WHERE customer_id IS NOT NULL AND order_total > 0;</code></pre>

<div class="diagram">
  <svg viewBox="0 0 560 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="30" width="150" height="34" rx="5"></rect>
    <text x="85" y="51" text-anchor="middle" font-size="11" font-weight="600">orders_bronze</text>

    <path class="connector" d="M160 47 L228 47" marker-end="url(#arrowD1)"></path>
    <text x="194" y="35" text-anchor="middle" font-size="8" class="dim">reads</text>

    <rect x="230" y="30" width="150" height="34" rx="5"></rect>
    <text x="305" y="51" text-anchor="middle" font-size="11" font-weight="600">orders_silver</text>

    <text x="470" y="51" text-anchor="middle" font-size="9" class="dim">DAG inferred —</text>
    <text x="470" y="64" text-anchor="middle" font-size="9" class="dim">no manual depends_on</text>

    <defs>
      <marker id="arrowD1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">silver's query references bronze by name — DLT derives run order from that reference alone.</div>
</div>

<ul>
  <li><strong>DLT infers the DAG.</strong> Because <code>orders_silver</code>'s query reads <code>orders_bronze</code>
  (via <code>dlt.read_stream("orders_bronze")</code> in Python, or <code>LIVE.orders_bronze</code> in SQL), DLT
  knows silver depends on bronze without anyone declaring a task dependency by hand — this is the direct payoff of
  the declarative style described in 13.1.</li>
  <li><strong>The pipeline, not the notebook, is the unit of deployment.</strong> A DLT pipeline is configured
  separately from a Job — it references one or more notebooks/files containing <code>@dlt.table</code> definitions,
  and the DLT runtime (not the notebook's own execution) decides when and how each table gets (re)computed. A DLT
  pipeline can itself be run as one task inside a Job (section 13.1's "Pipeline" task type) for scheduling.</li>
  <li><strong>comment and other metadata.</strong> Table-level metadata like <code>comment</code> documents intent
  directly alongside the table definition, which shows up in the DLT pipeline's UI graph — useful for the same
  reason documenting any production table is useful, but especially so in DLT since the graph view is how most
  troubleshooting starts.</li>
</ul>

<h2>14.3 Expectations: declarative data quality</h2>
<p>Section 12.3 built a quarantine pattern by hand: filter valid rows into silver, negate the filter to route
invalid rows into a separate quarantine table. DLT provides the same idea as a first-class, declarative feature —
attach a named quality rule to a table definition, and choose what happens when a row fails it, without writing the
filtering and routing logic manually. These rules are called <strong>expectations</strong>.</p>
<pre><code>import dlt
from pyspark.sql.functions import col

@dlt.table
@dlt.expect("valid_total", "order_total > 0")
@dlt.expect_or_drop("valid_customer", "customer_id IS NOT NULL")
@dlt.expect_or_fail("valid_currency", "currency IN ('USD', 'EUR', 'GBP')")
def orders_silver():
    return dlt.read_stream("orders_bronze")</code></pre>
<table>
  <tr><th>Decorator</th><th>Behavior on a failing row</th></tr>
  <tr><td><code>@dlt.expect</code></td><td>Row is kept in the output table; the violation is recorded in pipeline
  metrics for monitoring — the softest enforcement level</td></tr>
  <tr><td><code>@dlt.expect_or_drop</code></td><td>Row is dropped from the output table (not written), but the
  pipeline keeps running — equivalent in effect to the quarantine filter's "invalid" branch, minus the manual
  routing code</td></tr>
  <tr><td><code>@dlt.expect_or_fail</code></td><td>The entire pipeline update fails as soon as a violating row is
  encountered — the strictest level, for rules so critical that any violation means something is fundamentally
  broken upstream and processing should stop</td></tr>
</table>
<ul>
  <li><strong>Choosing severity per rule.</strong> A single table can carry multiple expectations at different
  severities, as in the example above — a soft <code>currency</code> sanity check might warrant only monitoring
  (<code>expect</code>), a missing customer ID might warrant silently dropping the row
  (<code>expect_or_drop</code>), and a structurally invalid record might warrant halting the whole pipeline
  (<code>expect_or_fail</code>) because continuing would build on badly broken data.</li>
  <li><strong>Expectations vs. table constraints.</strong> Section 12.2's <code>CHECK</code>/<code>NOT NULL</code>
  constraints live on the table itself and reject any write that violates them, regardless of what produced the
  write. DLT expectations live on the pipeline definition and offer graduated responses (keep-and-log, drop, or
  fail) rather than a single reject-the-write behavior — they're DLT's more expressive, pipeline-native answer to
  the same underlying problem of enforcing data quality.</li>
</ul>

<h2>14.4 Streaming tables vs. materialized views</h2>
<p>Not every table in a DLT pipeline needs to be recomputed the same way. A bronze table ingesting an
ever-growing stream of files only ever needs to process the new files since last time — reprocessing the entire
history on every update would be wasteful. A gold aggregate like "total sales per region," on the other hand, can
change because of edits or deletes anywhere in the underlying data, not just new rows, so it may need to be
recomputed from its query rather than just appended to. DLT exposes both processing models as table types.</p>
<ul>
  <li><strong>Streaming table.</strong> Processes each input row incrementally, exactly once, as it arrives —
  suited to append-only sources like raw event ingestion, where new data is strictly additive and old rows never
  change. This is the natural choice for bronze layers and is what <code>dlt.read_stream</code> /
  <code>STREAM(LIVE....)</code> connect to.</li>
  <li><strong>Materialized view.</strong> Recomputed (fully or incrementally, at DLT's discretion) from its
  defining query whenever a refresh runs, always reflecting the current correct result of that query — suited to
  aggregates and joins where the correct output can change due to updates or deletes in the underlying data, not
  just new arrivals. This is the natural choice for gold-layer aggregates.</li>
  <li><strong>Picking between them.</strong> The deciding question is whether the underlying data is strictly
  append-only from this table's point of view. If yes, a streaming table avoids reprocessing everything on every
  run. If the result could change because of modifications to existing rows (a corrected order, a deleted
  customer), a materialized view is the type that guarantees the output stays correct.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam questions often present a DLT expectation and ask what happens to a failing row without naming the decorator
  explicitly, or vice versa — memorize the three severities precisely: <code>expect</code> keeps the row (log only),
  <code>expect_or_drop</code> drops the row but the pipeline continues, <code>expect_or_fail</code> stops the whole
  pipeline update. A frequent wrong-answer trap is assuming any expectation failure halts the pipeline, or that
  <code>expect_or_drop</code> routes dropped rows to a quarantine table automatically — it does not; dropped rows
  are simply excluded from the output DLT does not auto-create a quarantine destination for you.
</div>

<h1>15. Production Considerations</h1>

<h2>15.1 Permissions on jobs and pipelines</h2>
<p>Imagine a data engineering team where anyone who can view a Job's results could also edit its schedule, change
what code it runs, or delete it outright — a single careless click from an analyst who only needed to check
whether last night's run succeeded could break a production pipeline. Real teams need different levels of access:
someone who just needs to confirm a pipeline ran, someone who needs to kick off a manual re-run without touching
its configuration, and someone who owns and can reconfigure the Job entirely. Databricks Jobs (and DLT pipelines,
which follow the same model) expose exactly this gradation through a permission system layered on top of Unity
Catalog's broader access control, with each Job or pipeline able to grant different permission levels to different
users or groups.</p>
<table>
  <tr><th>Permission</th><th>Grants</th><th>Typical holder</th></tr>
  <tr><td><strong>CAN_VIEW</strong></td><td>See the Job's configuration, run history, and logs — read-only</td>
  <td>Analysts or stakeholders who need to confirm a pipeline ran and check its output, not modify it</td></tr>
  <tr><td><strong>CAN_MANAGE_RUN</strong></td><td>Trigger new runs and cancel in-progress runs, without being able
  to edit the Job's definition</td><td>Operators who need to re-run a failed pipeline on demand but shouldn't
  change its schedule, tasks, or cluster config</td></tr>
  <tr><td><strong>CAN_MANAGE</strong></td><td>Full control — edit tasks, schedule, permissions, and delete the
  Job</td><td>The engineer(s) who own and maintain the pipeline</td></tr>
</table>

<div class="diagram">
  <svg viewBox="0 0 560 130" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="80" width="140" height="34" rx="5"></rect>
    <text x="90" y="101" text-anchor="middle" font-size="10" font-weight="600">CAN_VIEW</text>

    <rect x="210" y="55" width="150" height="34" rx="5"></rect>
    <text x="285" y="76" text-anchor="middle" font-size="10" font-weight="600">CAN_MANAGE_RUN</text>

    <rect x="410" y="30" width="140" height="34" rx="5"></rect>
    <text x="480" y="51" text-anchor="middle" font-size="10" font-weight="600">CAN_MANAGE</text>

    <path class="connector" d="M160 97 L210 80" marker-end="url(#arrowP1)"></path>
    <path class="connector" d="M360 72 L410 55" marker-end="url(#arrowP1)"></path>

    <text x="90" y="118" text-anchor="middle" font-size="8" class="dim">read-only</text>
    <text x="285" y="102" text-anchor="middle" font-size="8" class="dim">+ trigger/cancel runs</text>
    <text x="480" y="77" text-anchor="middle" font-size="8" class="dim">+ edit, delete, permissions</text>

    <defs>
      <marker id="arrowP1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">Each level is a strict superset of the one before it — CAN_MANAGE includes everything CAN_MANAGE_RUN and CAN_VIEW allow.</div>
</div>

<ul>
  <li><strong>Least privilege as the default posture.</strong> Granting <code>CAN_MANAGE</code> broadly because
  it's the permission that "just works" for everyone is the wrong default — someone who only ever needs to check
  run status should hold <code>CAN_VIEW</code>, and someone who needs to trigger reruns during an incident should
  hold <code>CAN_MANAGE_RUN</code>, reserving <code>CAN_MANAGE</code> for the people actually responsible for the
  pipeline's code and configuration.</li>
  <li><strong>Underlying data access is separate.</strong> Job permissions control who can operate the Job itself;
  they don't substitute for Unity Catalog permissions on the tables the Job reads and writes. A user with
  <code>CAN_MANAGE</code> on a Job still needs the underlying <code>SELECT</code>/<code>MODIFY</code> grants on the
  tables involved (or the Job must run as a service principal that holds them) for the Job's queries to actually
  succeed — Job-level and data-level permissions are two independent layers.</li>
  <li><strong>Run-as identity.</strong> A Job runs with the permissions of a configured owner or service principal,
  not necessarily the permissions of whoever clicked "Run now" — this matters for troubleshooting permission
  errors, since the relevant identity to check grants for is the Job's run-as identity, not the triggering user's.</li>
</ul>

<h2>15.2 Troubleshooting a failed run</h2>
<p>A red "Failed" status on a Job run doesn't say much on its own — the useful information is buried in the run's
detail view, which shows which task failed, the cluster it ran on, and the actual error output from the
notebook/script. Learning to read that error output quickly, and recognizing the handful of causes that account for
most production failures, turns a failed run from a mystery into a two-minute diagnosis.</p>
<table>
  <tr><th>Symptom</th><th>Likely cause</th></tr>
  <tr><td>Error mentions a column/type mismatch, or <code>AnalysisException</code> about a missing column</td>
  <td><strong>Schema mismatch</strong> — an upstream source changed its schema (renamed/dropped/added a column,
  or a type changed) and the pipeline's assumptions no longer hold</td></tr>
  <tr><td><code>PERMISSION_DENIED</code> or "does not have <code>SELECT</code>/<code>MODIFY</code> privilege"</td>
  <td><strong>Permission denied</strong> — the Job's run-as identity lacks a Unity Catalog grant on a table/volume
  it needs, often after a table is recreated and grants aren't automatically reapplied</td></tr>
  <tr><td>Run stays in "Pending"/"Starting" far longer than usual, then fails before any task logic runs</td>
  <td><strong>Cluster startup failure</strong> — an invalid cluster policy, unavailable instance type in the cloud
  region, init script failure, or cloud provider capacity limits</td></tr>
  <tr><td><code>OutOfMemoryError</code>, executor lost, or the run slows drastically before failing</td>
  <td><strong>Out-of-memory</strong> — a task (often a join or a wide aggregation) exceeds the memory available on
  the cluster's worker nodes, frequently from a skewed join key or an unintentional cross join</td></tr>
</table>
<ul>
  <li><strong>Read the task's stderr/log output first, not just the top-level run status.</strong> The Jobs UI run
  detail page lets you drill into the specific failed task and view its driver logs — the actual exception and
  stack trace live there, and the top-level "Failed" banner alone rarely says more than that something went wrong.</li>
  <li><strong>Schema mismatch is often the first thing to check for ELT pipelines</strong>, since sections 11-12's
  pipelines assume a stable source schema — an <code>AnalysisException</code> referencing a column name is a strong
  signal to check whether the source recently changed shape, especially for pipelines without Auto Loader's schema
  evolution handling.</li>
  <li><strong>Cluster startup failures often aren't about the pipeline code at all</strong> — before debugging
  notebook logic, check whether the run ever got past cluster creation; a failure at that stage points to
  infrastructure (policy, region capacity, init scripts) rather than anything in the task's own code.</li>
</ul>

<h2>15.3 Sizing clusters and jobs</h2>
<p>A cluster that's too small makes a job crawl or run out of memory; a cluster that's too large wastes money
running mostly-idle compute. Getting this right isn't a one-time decision but an ongoing balance between
performance and cost, and Databricks gives a few levers to manage that balance without requiring precise upfront
capacity planning for every job.</p>
<ul>
  <li><strong>Autoscaling.</strong> Rather than fixing a cluster at a single worker count, a cluster can be
  configured with a minimum and maximum number of workers, and Databricks adds or removes workers within that range
  based on actual load during the run — this absorbs variability in data volume (a heavier daily batch gets more
  workers automatically) without requiring the cluster to be sized for worst-case load at all times.</li>
  <li><strong>Job clusters vs. all-purpose clusters.</strong> An <strong>all-purpose cluster</strong> stays up for
  interactive use (notebooks being actively developed, multiple users sharing it) and is billed as long as it runs,
  idle or not. A <strong>job cluster</strong> is created fresh when a Job run starts and terminated automatically
  when it finishes, so it's only billed for the run's actual duration — production Jobs should run on job clusters
  specifically because they cost meaningfully less than pinning the same workload to an always-on all-purpose
  cluster.</li>
  <li><strong>Cluster policies.</strong> A <strong>cluster policy</strong> constrains what configurations users are
  allowed to create — capping the maximum worker count, restricting instance types to approved (often cheaper or
  pre-vetted) options, or enforcing tags for cost attribution. Policies exist so that individual users don't need to
  be trusted to self-regulate cluster size and cost; the constraint is enforced at creation time regardless of what
  the user requests.</li>
  <li><strong>Right-sizing is workload-dependent.</strong> A memory-heavy join-and-aggregate workload benefits from
  fewer, larger-memory workers; a highly parallel, embarrassingly-parallel workload (like processing many
  independent files) benefits from more, smaller workers. There's no single "correct" cluster size — the guidance
  at associate level is to match the shape of the cluster to the shape of the workload rather than defaulting to
  the largest available option.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  A frequently tested distinction is job clusters vs. all-purpose clusters on cost grounds: the exam expects
  "use a job cluster for scheduled production Jobs" as the cost-efficient answer, since an all-purpose cluster left
  attached to a Job keeps billing between runs (or requires manual start/stop) whereas a job cluster spins up and
  tears down automatically per run. Don't confuse this with autoscaling, which is an orthogonal setting (how many
  workers within a run) that applies to either cluster type — a scenario can require both a job cluster AND
  autoscaling min/max workers at once, they aren't alternatives to each other.
</div>

<h1>16. AI/BI Genie Spaces</h1>
<p>Section 10 introduced the Databricks Assistant and gave Genie a brief first pass as "natural-language Q&amp;A over
curated tables." This section is the full treatment, because on the current Data Analyst Associate blueprint
<strong>developing AI/BI Genie spaces is roughly 12% of the exam</strong> — the single largest AI-related topic on
it. What follows covers what a Genie space physically is, how to create and scope one, the specific curation
mechanisms that determine whether its answers are trustworthy, how to evaluate and iterate on it, and where it
predictably fails.</p>

<h2>16.1 The problem Genie solves</h2>
<p>Consider a regional sales director who needs one number: how much revenue the Northeast region booked last
quarter compared with the same quarter a year earlier. That number lives in the warehouse, and getting it requires
joining an orders fact table to a customer dimension to resolve region, filtering on two date ranges, excluding
cancelled and test orders the way finance defines them, and summing the right revenue column — of which there are
three similarly named candidates. The director cannot write that SQL. So the request goes to an analyst, sits in a
queue for two days, comes back as a screenshot, and then generates three follow-up questions that each restart the
same loop. Meanwhile the analyst — the scarcest resource on the team — spends the week answering variations of
questions that were already answered last month.</p>
<p>The obvious-looking fix is to let a large language model translate the director's English into SQL and run it.
The obvious-looking fix is also dangerous on its own: an ungrounded model pointed at a thousand-table metastore
will confidently pick the wrong revenue column, invent a join path that double-counts rows, ignore the business's
definition of a cancelled order, and hand back a number that looks authoritative and is simply wrong — and it will
do it against data the asker may not even be entitled to see. A number that is wrong but plausible is worse than no
number at all, because nobody catches it before it reaches a slide.</p>
<p>A <strong>Genie space</strong> is Databricks' answer to both halves of that problem at once. It is a curated,
governed, natural-language question-and-answer interface scoped to a specific, deliberately chosen set of tables.
A data team picks the tables, writes down the business context and definitions that a newcomer would need, supplies
worked example queries that demonstrate the correct join paths, and publishes the space to business users. Those
users then ask plain-English questions in a chat-like surface and get back an answer, a chart, and — if they want
it — the exact SQL that produced it. Every query executes through Unity Catalog under the asking user's own
identity, so the space can never become a side door around permissions. Genie is packaged under the broader
<strong>AI/BI</strong> product umbrella alongside AI/BI Dashboards (section 9), and the two are designed to sit next
to each other: a dashboard answers the questions someone anticipated in advance, and a Genie space answers the ones
they did not.</p>

<h2>16.2 Genie vs. the Databricks Assistant</h2>
<p>Both features translate English into SQL with a language model, which is exactly why exam questions pit them
against each other: the distinction is never "which one uses AI" but <em>who the user is</em> and <em>what
surrounds the tables</em>. Section 10.1 covered the Assistant in its own right; the table below is the direct
contrast to memorize.</p>
<table>
  <tr><th>Dimension</th><th>Databricks Assistant</th><th>AI/BI Genie</th></tr>
  <tr><td><strong>Intended user</strong></td><td>Someone who writes SQL or Python — analysts, engineers, data
  scientists</td><td>Someone who does not write SQL — finance, marketing, ops, executives</td></tr>
  <tr><td><strong>Where it lives</strong></td><td>Embedded in the notebook editor and SQL editor, beside the code
  the user is already writing</td><td>A standalone conversational space, opened from the workspace or embedded in a
  dashboard</td></tr>
  <tr><td><strong>Primary job</strong></td><td>Author, explain, fix, optimize, and autocomplete code the human will
  review and run</td><td>Answer a business question end to end, returning a result and a visualization</td></tr>
  <tr><td><strong>Scope of data</strong></td><td>Any object the user has access to across the metastore</td>
  <td>Only the specific tables the space's owner added to it</td></tr>
  <tr><td><strong>Curation layer</strong></td><td>None beyond schema and comments — no per-surface instruction set
  </td><td>Central to the product: instructions, example queries, trusted assets, synonyms</td></tr>
  <tr><td><strong>Output the user acts on</strong></td><td>Code, pasted into the editor and executed
  deliberately</td><td>An answer, with the SQL shown underneath as evidence rather than as the deliverable</td></tr>
  <tr><td><strong>Configuration effort</strong></td><td>Effectively zero — it is on and available</td><td>A real
  build-and-maintain task owned by a data team</td></tr>
  <tr><td><strong>Permissions model</strong></td><td>Runs as the signed-in user; sees only their accessible schemas
  </td><td>Runs as the signed-in user; a space grant never widens underlying data access</td></tr>
</table>
