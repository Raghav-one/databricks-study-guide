<ul>
  <li><strong>The distinction that actually gets tested.</strong> When a scenario describes a stakeholder who
  "does not know SQL" and wants to "ask questions about the data themselves," the answer is a Genie space. When it
  describes an analyst who "wants help writing or debugging a query" inside the editor, the answer is the
  Assistant. A distractor option will often be "build them a dashboard" — correct when the questions are known and
  repeating, wrong when the scenario emphasizes open-ended or unanticipated follow-up questions, which is precisely
  the gap Genie fills.</li>
  <li><strong>They coexist rather than compete.</strong> An analyst typically uses the Assistant to build and
  validate the gold tables and the example queries, and then packages that validated logic into a Genie space for
  the business. The Assistant is a tool of production; Genie is a tool of consumption.</li>
</ul>

<h2>16.3 Creating and configuring a Genie space</h2>
<p>Creating a space is a short workflow with one consequential decision in it — which tables to include. From the
workspace sidebar under Genie, a new space asks for a title and description, a set of tables, and a SQL warehouse,
after which it is immediately usable and immediately mediocre; everything in section 16.4 is what turns it into
something trustworthy.</p>
<table>
  <tr><th>Setting</th><th>What it controls</th></tr>
  <tr><td><strong>Title and description</strong></td><td>How users find the space and understand its intended
  domain. A description like "Retail sales and returns, fiscal 2024 onward" prevents someone asking supply-chain
  questions of a sales space and getting a confidently wrong answer from an unrelated table.</td></tr>
  <tr><td><strong>Tables / data sets</strong></td><td>The exact tables the space may query. Chosen individually
  from Unity Catalog. This is the single biggest lever on answer quality — see section 16.6.</td></tr>
  <tr><td><strong>SQL warehouse</strong></td><td>The compute that executes every generated query. Should be a
  serverless or pro warehouse so cold-start latency does not make a conversational tool feel broken.</td></tr>
  <tr><td><strong>Instructions</strong></td><td>Free-text business context plus, in newer layouts, a dedicated
  place for SQL example queries and joins. Covered in detail in 16.4.</td></tr>
  <tr><td><strong>Sample questions</strong></td><td>Starter prompts shown on the empty space, teaching users what
  kinds of questions this space is designed to answer.</td></tr>
  <tr><td><strong>Permissions on the space</strong></td><td>CAN VIEW / CAN RUN / CAN EDIT / CAN MANAGE on the space
  object itself, granted to users or groups. Entirely separate from data permissions.</td></tr>
</table>
<ul>
  <li><strong>The SQL warehouse is not a detail.</strong> Every Genie answer is a real query against a real
  warehouse, billed like any other query and subject to the same queueing, caching, and cluster-size behavior from
  section 6. A serverless warehouse is strongly preferred because it starts in seconds; a classic warehouse that
  has auto-stopped will leave a business user staring at a spinner for minutes and conclude the tool does not work.
  The warehouse also determines cost attribution — a heavily used space against wide, unoptimized tables generates
  real spend, which is one more reason to point spaces at compact gold tables rather than raw ones.</li>
  <li><strong>Two independent permission layers, and only one of them is about data.</strong> Granting someone
  CAN RUN on a Genie space lets them open it and ask questions. It grants them exactly zero additional access to
  the underlying tables. When their question is translated into SQL, that SQL executes as <em>them</em> against
  Unity Catalog, so <code>SELECT</code> grants, row filters, and column masks (sections 5 and 10.4) all apply
  unchanged. Two users can ask the identical question in the same space and correctly receive different numbers,
  because a row filter restricts one of them to their own region. This inheritance is the central governance
  property of Genie and the most reliably tested fact about it.</li>
  <li><strong>The corollary: a space cannot leak what a user could not already query.</strong> If a user lacks
  <code>SELECT</code> on a table in the space, questions that depend on it fail or return nothing rather than
  quietly revealing values. Genie is not a privileged service account reading on the user's behalf — a common wrong
  assumption, and the source of a whole family of exam distractors claiming Genie "bypasses" or "elevates"
  permissions.</li>
  <li><strong>Ownership is a real job.</strong> A space has an owner and editors who maintain its instructions as
  the schema and the business change. An abandoned space slowly degrades: tables get deprecated, a metric
  definition changes, an example query starts referencing a dropped column, and answers get subtly wrong while
  still looking fine.</li>
</ul>
<pre><code>-- Verify what a specific user can actually reach before adding a table to a space.
-- If they lack SELECT here, Genie will not grant it to them.
SHOW GRANTS \`maria@example.com\` ON TABLE main.sales.fct_orders;

-- The grants a typical Genie audience needs on the space's underlying data
GRANT USE CATALOG ON CATALOG main TO \`sales-stakeholders\`;
GRANT USE SCHEMA ON SCHEMA main.sales TO \`sales-stakeholders\`;
GRANT SELECT ON TABLE main.sales.fct_orders TO \`sales-stakeholders\`;
GRANT SELECT ON TABLE main.sales.dim_customer TO \`sales-stakeholders\`;</code></pre>

<h2>16.4 Curation: the mechanisms that make answers correct</h2>
<p>A brand-new space knows only what the schema tells it: table names, column names, and data types. That is
enough to answer "how many rows are in orders" and nowhere near enough to answer "what was net revenue for active
enterprise accounts last quarter," because <em>net</em>, <em>active</em>, and <em>enterprise</em> are business
definitions that exist in people's heads and in the finance team's documentation, not in a column type. Curation is
the process of moving those definitions into the space so the model stops guessing. Each mechanism below closes a
different category of guess.</p>
<ul>
  <li><strong>General instructions: the plain-language rulebook.</strong> A free-text block where the space owner
  writes the context a new analyst would be told on their first day — what the dataset covers and what it excludes,
  how the business defines its core metrics, which filters should almost always apply, and what the default time
  window means. Writing "net revenue means gross_amount minus discount_amount minus refund_amount; always exclude
  rows where is_test_order = true; 'last quarter' means the fiscal quarter, and the fiscal year starts in February"
  removes exactly the ambiguities that otherwise produce a plausible wrong number. This is the highest-leverage
  curation surface because it is cheap to edit and applies to every question. Keep instructions declarative and
  specific; vague encouragement like "be accurate" does nothing, while "revenue is always taken from the
  fct_orders table, never from stg_orders" measurably changes generated SQL.</li>
  <li><strong>Example SQL queries: teaching by demonstration.</strong> The owner supplies question-and-SQL pairs —
  a natural-language question alongside the correct, hand-verified query that answers it. These matter more than
  their simplicity suggests, because they encode the things prose struggles to convey: the correct join path
  between fact and dimension, the exact grain to aggregate at, which of three revenue columns is the real one, and
  the standard set of filters. When a new question resembles an example, the model has a proven template to
  generalize from instead of inventing a join. A small set of well-chosen examples covering the common join paths
  typically improves accuracy more than a long instruction essay.</li>
  <li><strong>Trusted assets: certified, parameterized answers.</strong> Some questions are important enough that
  a generated approximation is not acceptable — a revenue figure that appears in a board deck, a regulated
  headcount metric. A trusted asset is a certified query or SQL function registered with the space so that when a
  matching question is asked, Genie runs the vetted logic rather than composing its own. Parameterized versions
  (typically a Unity Catalog SQL function taking arguments like a date range or a region) let one certified asset
  serve a family of questions while guaranteeing the metric definition inside it never drifts. Answers produced
  this way are surfaced as trusted/certified in the response, so the reader knows they are looking at governed
  logic rather than a fresh generation.</li>
  <li><strong>Table and column comments: metadata the model reads.</strong> Genie reads Unity Catalog comments as
  part of its context, which makes <code>COMMENT ON</code> one of the cheapest accuracy improvements available. A
  column named <code>amt_net_usd</code> is a coin flip; the same column commented "Net order amount in USD after
  discounts and refunds; use this for all revenue reporting" is unambiguous. Comments also disambiguate near-
  duplicates — two date columns where one is the order date and one is the ship date will be confused forever
  otherwise. This work has a second payoff: the same comments improve Catalog Explorer browsing and Assistant
  suggestions for analysts, so it is not Genie-specific effort.</li>
  <li><strong>Synonyms and terminology hints: bridging vocabulary gaps.</strong> Business users do not use column
  names. They say "churn" when the column is <code>is_active = false</code>, "bookings" when the column is
  <code>order_total</code>, "reps" when the table says <code>account_executive</code>, and "the East" when the
  value is <code>'NORTHEAST'</code>. Recording these mappings — as explicit synonym annotations where the space
  supports them, or as a glossary inside the general instructions — closes the gap between how questions are asked
  and how data is stored. This is disproportionately valuable in domains with heavy internal jargon or acronyms,
  where the model has no external knowledge to fall back on.</li>
  <li><strong>Sample questions: shaping what gets asked.</strong> Starter prompts on the empty space are curation
  aimed at the human rather than the model. They advertise the space's scope, demonstrate the phrasing that works,
  and steer users away from questions the underlying data genuinely cannot answer — which prevents a large share
  of "Genie got it wrong" reports that were really "the data does not contain that."</li>
</ul>
<pre><code>-- Comments are read by Genie as context. Ambiguity removed here is
-- ambiguity the model never has to guess about.
COMMENT ON TABLE main.sales.fct_orders IS
  'One row per order line. Grain: order_id + line_number. Excludes test orders
   only when is_test_order = false is applied by the query. Fiscal year starts February 1.';

ALTER TABLE main.sales.fct_orders ALTER COLUMN net_amount_usd
  COMMENT 'Net revenue in USD after discounts and refunds. Use this for all revenue reporting, never gross_amount_usd.';

ALTER TABLE main.sales.fct_orders ALTER COLUMN order_date
  COMMENT 'Date the order was placed, not shipped. Use ship_date for fulfilment questions.';

ALTER TABLE main.sales.dim_customer ALTER COLUMN segment
  COMMENT 'Customer segment. Allowed values: ENTERPRISE, MIDMARKET, SMB. Business users may say "enterprise accounts" for ENTERPRISE.';</code></pre>
<pre><code>-- An example query added as a curation asset. It teaches the correct join path,
-- the standard exclusions, and which revenue column is authoritative.
-- Paired question: "What was net revenue by segment last quarter?"
SELECT
  c.segment,
  SUM(o.net_amount_usd) AS net_revenue
FROM main.sales.fct_orders o
JOIN main.sales.dim_customer c
  ON o.customer_key = c.customer_key
 AND c.is_current = true            -- dimension is SCD Type 2; take the current row
WHERE o.is_test_order = false
  AND o.order_status <> 'CANCELLED'
  AND o.order_date >= DATE_TRUNC('QUARTER', ADD_MONTHS(CURRENT_DATE(), -3))
  AND o.order_date <  DATE_TRUNC('QUARTER', CURRENT_DATE())
GROUP BY c.segment
ORDER BY net_revenue DESC;</code></pre>
<pre><code>-- A trusted asset as a parameterized Unity Catalog SQL function. Registering this
-- with the space guarantees the metric definition cannot drift between answers.
CREATE OR REPLACE FUNCTION main.sales.net_revenue_by_segment(
  start_date DATE,
  end_date   DATE
)
RETURNS TABLE (segment STRING, net_revenue DECIMAL(18,2))
COMMENT 'Certified net revenue by customer segment for a date range. Excludes test and cancelled orders.'
RETURN
  SELECT c.segment, SUM(o.net_amount_usd)
  FROM main.sales.fct_orders o
  JOIN main.sales.dim_customer c
    ON o.customer_key = c.customer_key AND c.is_current = true
  WHERE o.is_test_order = false
    AND o.order_status <> 'CANCELLED'
    AND o.order_date BETWEEN start_date AND end_date
  GROUP BY c.segment;

-- Callable directly, and usable by Genie as certified logic
SELECT * FROM main.sales.net_revenue_by_segment(DATE'2026-04-01', DATE'2026-06-30');</code></pre>

<h2>16.5 Iterating and evaluating a space</h2>
<p>No space is correct on its first day, and treating deployment as the finish line is the most common way one
fails in practice. The realistic model is a feedback loop: publish to a small pilot group, watch what they actually
ask, find the answers that are wrong, add the curation that fixes each one, and repeat until the wrong-answer rate
is low enough for a wider audience. What makes this tractable is that Genie shows its work — the generated SQL is
visible for every answer, so a reviewer can diagnose exactly which assumption went wrong instead of guessing.</p>
<ul>
  <li><strong>Question history is the requirements document you did not have to write.</strong> A space records
  the questions asked, the SQL generated, and the results returned. Reviewing this is how an owner discovers the
  vocabulary real users employ, the questions the data cannot yet answer (a gap to fix upstream, not in curation),
  and the recurring questions worth promoting into trusted assets or a dashboard. It is also the audit trail when
  someone reports a number that looks wrong.</li>
  <li><strong>User feedback on individual answers.</strong> Users can mark answers as good or bad directly in the
  conversation. A thumbs-down is a lead, not a diagnosis — the owner opens the generated SQL and identifies the
  actual cause, which is nearly always one of a small set: the wrong column was chosen, a required filter was
  omitted, the join path was wrong, or the business term was interpreted differently than intended. Each cause maps
  to a specific curation fix rather than to a vague "the AI is bad."</li>
  <li><strong>Benchmarks: regression testing for a space.</strong> A benchmark is a set of representative questions
  paired with their known-correct expected answers, run against the space to measure how many it currently gets
  right. This converts "the space feels better now" into a number, and — more usefully — catches regressions, where
  adding an instruction to fix one question quietly breaks three others. Building a benchmark from the real
  questions found in history, rather than from questions the owner imagined, is what makes the score meaningful.</li>
  <li><strong>The repair loop, concretely.</strong> A wrong answer is triaged by reading the SQL. Wrong column
  chosen means adding or sharpening a column comment. Missing standard filter means stating it in general
  instructions. Wrong join path means adding an example query that demonstrates the right one. Unfamiliar business
  term means recording a synonym or definition. Question is business-critical and must never vary means promoting
  it to a trusted asset. The instinct to fix a bad answer by rewriting the user's question is backwards — the user
  will ask it their way again tomorrow.</li>
  <li><strong>Instructions can conflict, and more is not automatically better.</strong> A space accumulating
  dozens of overlapping instructions written by different people over a year starts producing worse answers than a
  tightly written short set, because contradictory guidance forces the model to pick. Periodically pruning and
  consolidating instructions is part of maintenance, and a benchmark is what makes it safe to do.</li>
</ul>

<h2>16.6 Preparing the underlying data</h2>
<p>The strongest predictor of whether a Genie space works is not how well its instructions are written but what it
was pointed at. A space over five clean, well-named, well-commented gold tables with an obvious join structure will
outperform a space over two hundred raw ingestion tables no matter how much curation is layered on the second one,
because the second one asks the model to make a large number of independent correct choices per question and it
only takes one wrong choice to produce a wrong number.</p>
<ul>
  <li><strong>Point spaces at gold-layer tables.</strong> The medallion architecture (sections 2 and 12) exists to
  produce exactly what Genie needs at its top layer: cleaned, conformed, business-meaningful tables with
  deduplication and quality rules already applied and business logic already resolved. Bronze tables carry raw
  source quirks, nulls, and duplicates that a generated query will not know to handle; silver is cleaned but still
  normalized and often requires several hops to answer a business question. Section 17's star-schema modeling is
  the natural shape for a Genie-facing gold layer — a fact table with a handful of dimensions gives short,
  predictable join paths.</li>
  <li><strong>Fewer tables, chosen deliberately.</strong> Every additional table is another opportunity to pick
  the wrong one. Resist the impulse to add "everything the team might ever need"; build one space per business
  domain with the minimum table set that answers that domain's questions, and create a separate space for a
  separate domain rather than one giant space covering all of them. A focused space is also easier to describe,
  easier to benchmark, and easier to hand to the right audience.</li>
  <li><strong>Names should read like the business speaks.</strong> A column named <code>net_revenue_usd</code>
  needs no explanation; <code>amt3</code> needs a comment and will still be guessed at. Where renaming upstream is
  impractical, a curated view over the raw table that aliases columns into business language — and which the space
  points at instead of the raw table — is a legitimate and common pattern.</li>
  <li><strong>Comment everything the space touches.</strong> Table-level comments should state the grain
  explicitly ("one row per order line"), because grain confusion is a leading cause of double-counted totals.
  Column-level comments should state units, currency, timezone, allowed values for low-cardinality codes, and any
  column that must not be used for a given purpose.</li>
  <li><strong>Encode relationships where the platform lets you.</strong> Declaring primary and foreign key
  constraints on Unity Catalog tables — informational rather than enforced — documents the intended join paths in
  metadata that Genie and the query planner can both read, reducing the chance of an invented join. Combined with a
  clean star schema, this makes the correct join the obvious one.</li>
  <li><strong>Keep the tables performant.</strong> Genie is conversational, so latency is a product feature.
  Applying section 4's Delta maintenance — <code>OPTIMIZE</code>, liquid clustering or Z-ordering on common filter
  columns, and reasonable file sizes — keeps answers arriving in seconds. A correct answer that takes ninety
  seconds trains users to stop asking.</li>
</ul>
<pre><code>-- A curated, Genie-facing view: business-language column names over a
-- raw table nobody is going to rename.
CREATE OR REPLACE VIEW main.sales.genie_orders
COMMENT 'Curated order view for the Sales Genie space. One row per order line.'
AS SELECT
  ord_id        AS order_id,
  cust_k        AS customer_key,
  amt3          AS net_revenue_usd,
  dt_ord        AS order_date,
  st            AS order_status
FROM main.raw.orders_ext
WHERE tst_flg = 0;

-- Informational keys document the intended join path in metadata
ALTER TABLE main.sales.dim_customer
  ADD CONSTRAINT dim_customer_pk PRIMARY KEY (customer_key);

ALTER TABLE main.sales.fct_orders
  ADD CONSTRAINT fct_orders_customer_fk
  FOREIGN KEY (customer_key) REFERENCES main.sales.dim_customer;</code></pre>

<h2>16.7 Limitations: where Genie predictably struggles</h2>
<p>Knowing the failure modes is both an exam topic and the difference between a space that gets trusted and one
that gets quietly abandoned after producing one embarrassing number. Every limitation below is a property of the
approach, not a bug that a future release removes.</p>
<ul>
  <li><strong>Ambiguous business terms with no single definition.</strong> When "active customer" means one thing
  to marketing and another to finance, no amount of model quality resolves it — the organization has not decided.
  Genie will pick one interpretation and present it without hedging. The fix is organizational: agree on a
  definition, write it into the instructions, and ideally encode it as a trusted asset so the agreed version is the
  one that runs.</li>
  <li><strong>Complex multi-hop joins.</strong> Questions requiring four or five tables chained through
  intermediate bridge tables, or self-joins, or many-to-many relationships resolved through a junction table, are
  where generated SQL most often silently fans out rows and inflates a sum. The result looks plausible because it
  is a number of the right magnitude. Mitigation is structural — pre-join the path into a gold table or a
  materialized view so the question needs one join instead of five — not prompt-level.</li>
  <li><strong>Questions needing context the data does not contain.</strong> "Why did revenue drop in March"
  requires causal knowledge — a competitor's launch, an outage, a pricing change — that lives nowhere in the
  tables. Genie can describe <em>that</em> revenue dropped and break it down by any dimension present, but it
  cannot supply a reason that was never recorded. Similarly, questions about periods outside the data's retention
  window, or about entities that were never captured, have no correct answer to generate.</li>
  <li><strong>Highly ambiguous or underspecified phrasing.</strong> "Show me the best products" leaves best
  undefined — by units sold, by revenue, by margin, by growth? Genie will choose. Good spaces mitigate this by
  defining defaults in instructions ("'best' means by net revenue unless otherwise stated") and by having the
  answer state its assumptions.</li>
  <li><strong>Advanced statistical and predictive questions.</strong> Genie generates SQL against existing data.
  Requests for forecasts, significance tests, cohort survival modeling, or attribution analysis are outside what a
  SQL generation surface delivers reliably, and belong in notebooks or purpose-built models.</li>
  <li><strong>It reflects data quality rather than repairing it.</strong> If the gold table has duplicate rows, a
  broken late-arriving-data backfill, or a stale refresh, Genie reports those numbers faithfully. It is a query
  interface, not a validation layer — which is exactly why pointing it at quality-controlled gold tables matters
  so much.</li>
  <li><strong>Answers still warrant verification for consequential decisions.</strong> The generated SQL being
  visible is the mitigation: an analyst can read it in seconds and confirm the join and filters are right before a
  number goes into a board deck. Treating a Genie answer as automatically authoritative — rather than as a fast,
  inspectable first draft — is the human failure mode the product's transparency is designed to prevent.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  The single most reliably tested Genie fact is that it <strong>inherits, never widens, Unity Catalog
  permissions</strong> — generated queries run under the asking user's identity, so grants, row filters, and column
  masks all still apply, and giving someone access to a Genie space grants them exactly no additional access to the
  underlying data. Expect distractors claiming a space "gives business users access to tables they could not
  otherwise query," or that two users asking the identical question must receive identical results (they will not,
  if a row filter applies to one of them). A second, subtler trap: when a scenario says Genie returned a wrong or
  incomplete answer, the intended fix is almost always a <em>curation</em> change on the space — add an
  instruction, an example query, a column comment, or a trusted asset — not "grant broader permissions," not
  "switch to a larger SQL warehouse," and not "tell the user to rephrase the question." And do not confuse the two
  AI surfaces: the Assistant helps someone who writes SQL write it better, while Genie answers questions for
  someone who never writes SQL at all.
</div>

<h1>17. Data Modeling with Databricks SQL</h1>
<p>Every previous SQL section assumed the tables being queried were already shaped sensibly. This section is about
producing that shape: how tables should be organized so analytical queries stay fast, correct, and
understandable — a topic worth roughly 5% of the Data Analyst Associate exam and, in practice, the difference
between a warehouse people trust and one where every number needs a caveat.</p>

<h2>17.1 Why the shape of the tables matters</h2>
<p>Picture the database behind a retail checkout system. Its job is to record an order the instant a customer
clicks buy, without ever losing or duplicating anything. To do that safely it stores each fact exactly once: a
customer's address lives in one <code>customers</code> row, a product's name in one <code>products</code> row, and
an order references them by ID. If a customer moves house, one row changes and every past and future order
automatically reflects it. There is no duplication to keep in sync, writes touch as few rows as possible, and
integrity is easy to guarantee. This design is excellent at what it was built for.</p>
<p>Now ask that same database an analytical question: total revenue by product category, by customer region, by
month, for the last three years. Answering it requires joining orders to order_lines to products to categories to
customers to regions to a calendar — seven tables, some of them enormous, joined on every one of hundreds of
millions of rows, for a query that a business user wants to run interactively and slice differently every time
they look at it. The design that made writes safe has made reads expensive, and it has also made the data hard to
navigate: nobody outside the engineering team knows that category name lives three joins away from a sale.</p>
<p>These two goals pull in opposite directions, and the industry names them accordingly. A schema built for
transaction processing — many narrow tables, each fact stored once, minimal duplication — is called
<strong>normalized</strong>, and systems built around it are <strong>OLTP</strong> (online transaction processing).
A schema built for analysis deliberately gives up some of that purity: it uses fewer, wider tables, accepts
duplicating descriptive values across many rows, and optimizes for reading and aggregating large volumes rather
than for writing single rows. That is <strong>denormalization</strong>, and systems built around it are
<strong>OLAP</strong> (online analytical processing). Duplication is not sloppiness here — it is a deliberate
trade of cheap storage for expensive query time and human comprehension.</p>
<table>
  <tr><th>Dimension</th><th>Normalized / OLTP</th><th>Analytics-optimized / OLAP</th></tr>
  <tr><td><strong>Optimized for</strong></td><td>Fast, safe writes of single rows</td><td>Fast reads and aggregation over many rows</td></tr>
  <tr><td><strong>Table count and width</strong></td><td>Many narrow tables</td><td>Fewer, wider tables</td></tr>
  <tr><td><strong>Duplication</strong></td><td>Minimized — each fact stored once</td><td>Accepted deliberately in dimensions</td></tr>
  <tr><td><strong>Typical query</strong></td><td>Fetch or update one order by ID</td><td>Aggregate millions of rows across several attributes</td></tr>
  <tr><td><strong>Joins per query</strong></td><td>Few, on indexed keys</td><td>Few by design — fact to dimensions, one hop each</td></tr>
  <tr><td><strong>Change frequency</strong></td><td>Constant small writes</td><td>Periodic batch or streaming loads</td></tr>
  <tr><td><strong>Who reads it</strong></td><td>The application</td><td>Analysts, dashboards, Genie spaces</td></tr>
</table>

<h2>17.2 The star schema</h2>
<p>The analytical model that emerged from this trade-off separates two fundamentally different kinds of
information. On one side are the things that <em>happened</em> and can be counted or summed — a sale of 3 units for
$59.97 at 14:22 on March 4th. On the other side is the descriptive context that explains <em>who, what, where, and
when</em> — that the buyer is Maria in the Northeast enterprise segment, that the product is a Blue Widget in the
Hardware category, that March 4th was a Tuesday in fiscal Q1. The measurements go into one central table, one row
per event; the context goes into small surrounding tables, one row per customer, per product, per date. The
central table is a <strong>fact table</strong>, the surrounding ones are <strong>dimension tables</strong>, and
because the diagram of a fact table with dimensions radiating out looks like a star, the arrangement is called a
<strong>star schema</strong>.</p>

<div class="diagram">
  <svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg">
    <rect x="240" y="130" width="180" height="86" rx="6"></rect>
    <text x="330" y="152" text-anchor="middle" font-size="11" font-weight="600">fct_sales</text>
    <text x="330" y="168" text-anchor="middle" font-size="9" class="dim">date_key, customer_key</text>
    <text x="330" y="182" text-anchor="middle" font-size="9" class="dim">product_key, store_key</text>
    <text x="330" y="198" text-anchor="middle" font-size="9">quantity, net_revenue_usd</text>
    <text x="330" y="211" text-anchor="middle" font-size="8" class="dim">grain: one row per order line</text>

    <rect x="40" y="30" width="150" height="56" rx="6"></rect>
    <text x="115" y="50" text-anchor="middle" font-size="10" font-weight="600">dim_date</text>
    <text x="115" y="65" text-anchor="middle" font-size="8" class="dim">date_key (PK)</text>
    <text x="115" y="78" text-anchor="middle" font-size="8" class="dim">day, month, quarter, fiscal_year</text>

    <rect x="470" y="30" width="150" height="56" rx="6"></rect>

    <text x="545" y="65" text-anchor="middle" font-size="8" class="dim">customer_key (PK)</text>

    <rect x="40" y="256" width="150" height="56" rx="6"></rect>

    <text x="115" y="304" text-anchor="middle" font-size="8" class="dim">name, category, brand</text>

    <rect x="470" y="256" width="150" height="56" rx="6"></rect>
    <text x="545" y="276" text-anchor="middle" font-size="10" font-weight="600">dim_store</text>
    <text x="545" y="291" text-anchor="middle" font-size="8" class="dim">store_key (PK)</text>
    <text x="545" y="304" text-anchor="middle" font-size="8" class="dim">store_name, city, country</text>

    <line x1="190" y1="72" x2="248" y2="136"></line>
    <line x1="470" y1="72" x2="412" y2="136"></line>
    <line x1="190" y1="268" x2="248" y2="210"></line>
    <line x1="470" y1="268" x2="412" y2="210"></line>

    <text x="330" y="248" text-anchor="middle" font-size="9" class="dim">every dimension is exactly one join from the fact</text>

    <defs>
      <marker id="arrowM1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">A star schema: one central fact table of measurements, surrounded by denormalized dimension tables of descriptive context, each one join away.</div>
</div>
<ul>
  <li><strong>Fact tables hold measurements and keys, nothing else.</strong> A fact table is long and narrow: it
  grows to hundreds of millions or billions of rows, and each row holds a set of foreign keys pointing at the
  dimensions plus a small number of numeric <strong>measures</strong> — quantity, revenue, cost, duration. Facts
  carry almost no descriptive text, because text belongs in dimensions where it is stored once per entity rather
  than repeated per event. Most useful measures are <em>additive</em>, meaning they can be summed across any
  dimension (revenue by any combination of month, region, and product is meaningful). Some are
  <em>semi-additive</em> — an account balance sums across accounts but not across time — and some, like a ratio or
  a percentage, are <em>non-additive</em> and must be recomputed from their numerator and denominator rather than
  averaged.</li>
  <li><strong>Dimension tables hold context and are deliberately wide.</strong> A dimension is short and wide:
  perhaps tens of thousands of rows, but with many descriptive columns, and flattened on purpose. Product category
  and brand live directly on <code>dim_product</code> rather than in separate category and brand tables, so
  grouping sales by category needs one join instead of three. Dimensions supply the <code>GROUP BY</code> and
  <code>WHERE</code> vocabulary of the warehouse — nearly every analytical question is "some measure from the fact,
  sliced by some attributes from the dimensions."</li>
  <li><strong>Why analysts and BI tools both prefer it.</strong> Every query has the same predictable shape: start
  at the fact, join outward one hop per dimension needed, filter and group on dimension attributes, aggregate the
  measures. That predictability is what lets a dashboard tool generate correct SQL automatically, what lets a Genie
  space (section 16) find the right join path without inventing one, and what lets a new analyst understand the
  warehouse in an afternoon.</li>
  <li><strong>Fact table flavors.</strong> A <em>transaction</em> fact records one row per event and is the
  default. A <em>periodic snapshot</em> records the state of something at regular intervals — an inventory level at
  the end of every day — and is how you answer "what did it look like then" for measures that are not events. An
  <em>accumulating snapshot</em> has one row per long-running process (an order moving through fulfilment) whose
  date columns get updated as milestones are reached. Recognizing which one a scenario describes is usually enough
  for exam purposes.</li>
</ul>
<pre><code>-- A dimension: short, wide, denormalized on purpose
CREATE OR REPLACE TABLE main.gold.dim_product (
  product_key    BIGINT   COMMENT 'Surrogate key, warehouse-generated',
  product_id     STRING   COMMENT 'Natural key from the source system (SKU)',
  product_name   STRING,
  category       STRING   COMMENT 'Flattened onto the dimension, not a separate table',
  subcategory    STRING,
  brand          STRING,
  unit_cost_usd  DECIMAL(10,2)
)
COMMENT 'Product dimension. One row per product version.';

-- A fact: long, narrow, foreign keys plus numeric measures
CREATE OR REPLACE TABLE main.gold.fct_sales (
  sale_id         BIGINT,
  date_key        INT     COMMENT 'FK to dim_date',
  customer_key    BIGINT  COMMENT 'FK to dim_customer',
  product_key     BIGINT  COMMENT 'FK to dim_product',
  store_key       BIGINT  COMMENT 'FK to dim_store',
  quantity        INT     COMMENT 'Additive measure',
  net_revenue_usd DECIMAL(18,2) COMMENT 'Additive measure, net of discounts and refunds'
)
COMMENT 'Sales fact. Grain: one row per order line.';

-- Informational constraints document the intended joins for the planner,
-- for Genie, and for anyone reading the schema
ALTER TABLE main.gold.dim_product ADD CONSTRAINT dim_product_pk PRIMARY KEY (product_key);
ALTER TABLE main.gold.fct_sales
  ADD CONSTRAINT fct_sales_product_fk FOREIGN KEY (product_key) REFERENCES main.gold.dim_product;</code></pre>
<pre><code>-- The characteristic analytical query shape: measures from the fact,
-- slicing attributes from the dimensions, one join per dimension
SELECT
  d.fiscal_year,
  d.fiscal_quarter,
  p.category,
  c.region,
  SUM(f.net_revenue_usd) AS net_revenue,
  SUM(f.quantity)        AS units_sold,
  COUNT(*)               AS order_lines
FROM main.gold.fct_sales f
JOIN main.gold.dim_date     d ON f.date_key     = d.date_key
JOIN main.gold.dim_product  p ON f.product_key  = p.product_key
JOIN main.gold.dim_customer c ON f.customer_key = c.customer_key
WHERE d.fiscal_year = 2026
  AND c.segment = 'ENTERPRISE'
GROUP BY d.fiscal_year, d.fiscal_quarter, p.category, c.region
ORDER BY net_revenue DESC;</code></pre>

<h2>17.3 Snowflake schema, and why star usually wins</h2>
<p>Take <code>dim_product</code> from the diagram above and apply normalization to it: pull <code>category</code>
out into its own <code>dim_category</code> table, pull <code>brand</code> into <code>dim_brand</code>, and leave
<code>dim_product</code> holding only foreign keys pointing at them. Do that to several dimensions and the tidy
star acquires branches radiating outward from each point — which is where the name <strong>snowflake schema</strong>
comes from. Structurally, it is a star schema whose dimensions have been normalized into multiple related tables
rather than flattened into one.</p>
<table>
  <tr><th></th><th>Star schema</th><th>Snowflake schema</th></tr>
  <tr><td><strong>Dimensions</strong></td><td>Denormalized — one flat table per dimension</td><td>Normalized — dimension split across several related tables</td></tr>
  <tr><td><strong>Joins to group by category</strong></td><td>One (fact to dim_product)</td><td>Two or more (fact to dim_product to dim_category)</td></tr>
  <tr><td><strong>Storage</strong></td><td>Slightly higher — descriptive values repeat</td><td>Slightly lower — each value stored once</td></tr>
  <tr><td><strong>Query performance</strong></td><td>Generally better — fewer joins</td><td>Generally worse — more joins per question</td></tr>
  <tr><td><strong>Comprehensibility</strong></td><td>High — attributes are where you expect them</td><td>Lower — analysts must know the dimension's internal structure</td></tr>
  <tr><td><strong>Best fit</strong></td><td>Lakehouse and cloud warehouses; BI and self-service tools</td><td>Very large dimensions, or where a hierarchy must be strictly enforced</td></tr>
</table>
<ul>
  <li><strong>The storage argument stopped mattering.</strong> Snowflaking exists to remove duplicated descriptive
  strings, which was a real concern when storage was expensive and dimensions were kept on costly disk. In a
  lakehouse, dimension tables are trivially small next to the fact table, stored as compressed columnar Parquet
  where a repeated category string compresses to almost nothing. Saving a few megabytes on a dimension while adding
  a join to every query in the warehouse is a bad trade.</li>
  <li><strong>Extra joins cost more than the space they save.</strong> Each additional hop is another shuffle
  candidate and another chance for a query planner — or a person, or a generated query — to get it wrong. Star
  schemas keep every attribute exactly one join from the fact, which is also what makes a Genie space or a
  dashboard's automatic query generation reliable.</li>
  <li><strong>Where snowflaking still earns its place.</strong> Genuinely enormous dimensions (tens of millions of
  rows) where a rarely used attribute group would bloat every scan, or regulated hierarchies where the
  relationship itself must be enforced in one place, can justify splitting. Treat it as a deliberate exception with
  a stated reason, not as a default.</li>
  <li><strong>The third option: one big flat table.</strong> Fully denormalizing the fact and all its dimensions
  into a single wide table removes joins entirely and can be attractive for a specific, heavily used dashboard.
  The cost is that every dimension attribute is repeated on every fact row, history becomes hard to manage, and
  any change to a dimension value requires rewriting the entire table — which is why it is a targeted
  optimization on top of a star schema, not a replacement for one.</li>
</ul>

<h2>17.4 Grain: deciding what one row means</h2>
<p>Before choosing a single column, a model needs an answer to one question: what does one row of the fact table
represent? "One row per order" and "one row per line item on an order" sound almost the same and produce entirely
different tables. If the grain is one row per order, an order containing three products cannot record which
products those were without either losing information or repeating the whole order. If the grain is one row per
line item, the order-level shipping charge appears on three rows, and summing it triples the shipping cost of every
order in the company. This declared meaning of a single row is the <strong>grain</strong>, and it is the first
decision in modeling because everything else follows from it: the grain determines which dimensions can attach to
the fact, which measures are valid, and what an aggregate actually means.</p>
<ul>
  <li><strong>Declare the grain in words before writing DDL.</strong> A sentence like "one row per order line per
  order" is the specification. If that sentence cannot be stated cleanly, the model is not ready. Write it into the
  table's <code>COMMENT</code> so it survives contact with every future reader — and so tools that read metadata,
  Genie included, know it too.</li>
  <li><strong>Mixed grain is the most damaging modeling error.</strong> A fact table where some rows are per-order
  and others per-line-item cannot be aggregated correctly by anyone, and the resulting numbers are wrong in a way
  that varies by query, making the bug nearly impossible to spot from a dashboard. Every row in a fact table must
  mean the same thing.</li>
  <li><strong>Finer grain is the safer default.</strong> Detail can always be rolled up later; it can never be
  recovered once discarded. Modeling at the lowest practical grain — the atomic event — keeps future questions
  answerable, whereas pre-aggregating to "daily totals by region" permanently forecloses any question needing an
  individual transaction.</li>
  <li><strong>Watch measures that do not belong to the grain.</strong> An order-level discount stored on a
  line-level fact will be double- or triple-counted by any straightforward <code>SUM</code>. The correct handling
  is either to allocate it proportionally down to line grain, or to keep it in a separate order-grain fact table.
  This is a classic source of totals that are subtly, consistently too high.</li>
  <li><strong>A quick grain test.</strong> If a set of columns is supposed to uniquely identify a row, verify it
  does — a count of rows against a count of distinct key combinations should match exactly.</li>
</ul>
<pre><code>-- Verify the declared grain actually holds. These two numbers must be equal.
SELECT
  COUNT(*)                                        AS total_rows,
  COUNT(DISTINCT order_id || '-' || line_number)  AS distinct_grain_keys
FROM main.gold.fct_sales;

-- Find duplicate grain keys if they do not match
SELECT order_id, line_number, COUNT(*) AS dupes
FROM main.gold.fct_sales
GROUP BY order_id, line_number
HAVING COUNT(*) > 1;</code></pre>

<h2>17.5 Surrogate keys vs. natural keys</h2>
<p>A product already has an identifier in the source system — its SKU, say <code>WID-BLUE-001</code>. Using that
directly as the dimension's primary key is the <strong>natural key</strong> approach, and it works until the source
system renames its SKUs, until a second acquired system supplies its own overlapping SKUs, or until the same
product needs two rows because its category changed and history must be preserved. A <strong>surrogate key</strong>
sidesteps all of that: a meaningless warehouse-generated integer, unique per dimension row, used as the primary key
and as the foreign key on the fact, with the natural key kept alongside as an ordinary column for traceability back
to the source.</p>
<ul>
  <li><strong>Surrogate keys are what make history possible.</strong> Section 17.6's Type 2 dimensions store
  multiple rows for the same real-world entity — one per version. A natural key cannot be the primary key when
  three rows share it; a surrogate key gives each version its own identity, so a fact row points at the specific
  version that was current when the event happened.</li>
  <li><strong>They insulate the warehouse from source churn.</strong> When a source system changes its ID scheme
  or two systems are merged, the surrogate key and every fact row referencing it stay untouched; only the natural
  key column changes. Integer keys are also compact and cheap to join compared with long composite strings.</li>
  <li><strong>Always keep the natural key.</strong> Dropping it makes reconciliation against the source system
  impossible and turns incremental loads into guesswork — the natural key is how a load knows which dimension row
  an incoming record corresponds to.</li>
  <li><strong>Generating them on Databricks.</strong> An identity column on the dimension is the straightforward
  option; a deterministic hash of the natural key plus effective date is the alternative when loads must be
  idempotent and re-runnable without producing new keys.</li>
</ul>
<pre><code>CREATE OR REPLACE TABLE main.gold.dim_customer (
  customer_key  BIGINT GENERATED ALWAYS AS IDENTITY COMMENT 'Surrogate key',
  customer_id   STRING NOT NULL COMMENT 'Natural key from CRM — kept for reconciliation',
  customer_name STRING,
  segment       STRING,
  region        STRING,
  effective_from DATE,
  effective_to   DATE,
  is_current     BOOLEAN
)
COMMENT 'Customer dimension, SCD Type 2. One row per customer version.';</code></pre>

<h2>17.6 Slowly changing dimensions</h2>
<p>A customer in the SMB segment places orders for two years, then grows and is reclassified as Enterprise. The
next load brings the new segment value — and now there is a decision with real consequences. Overwrite the segment
and every historical order that customer ever placed retroactively becomes an Enterprise order, so last year's
segment report changes every time this year's data loads. Or keep both versions, so orders placed before the
reclassification stay attributed to SMB and the historical report reproduces exactly. Dimension attributes that
change occasionally rather than constantly are called <strong>slowly changing dimensions</strong>, and the two
strategies above are the two types that matter for the exam.</p>
<ul>
  <li><strong>Type 1: overwrite in place.</strong> The attribute is updated and the previous value is gone. There
  is one row per entity, ever. This is correct when the old value has no analytical meaning — a corrected
  misspelling, a fixed data-entry error, a current phone number — and it is simple and cheap. Its cost is that all
  historical reporting silently restates itself: a report of last quarter's revenue by segment, re-run today,
  returns different numbers than it did last quarter, with nothing to indicate why.</li>
  <li><strong>Type 2: add a new row and preserve history.</strong> The existing row is closed off by setting an
  end date and clearing its current flag, and a new row is inserted with the new attribute values, a new surrogate
  key, an open end date, and the current flag set. Facts loaded from that point forward point at the new surrogate
  key, so each fact permanently references the attribute values that were true at the time it occurred. This is
  the default choice for attributes with analytical meaning — segment, region, sales territory, price tier — and
  the cost is a wider dimension, more rows, and more complex loading logic.</li>
  <li><strong>The two supporting columns every Type 2 dimension needs.</strong> A validity range
  (<code>effective_from</code> / <code>effective_to</code>) supports point-in-time queries: which version was
  current on a given date. A boolean <code>is_current</code> flag makes the overwhelmingly common "just give me
  today's version" query a simple filter rather than a date comparison. Both are worth carrying even though one is
  derivable from the other.</li>
  <li><strong>Querying a Type 2 dimension correctly.</strong> Joining a fact to a Type 2 dimension on the natural
  key rather than the surrogate key multiplies every fact row by the number of versions that customer has — a
  silent, severe over-count. Joining on the surrogate key gives exactly one match. And when the question is about
  the present ("how many customers are in each segment today"), filter <code>is_current = true</code>, or the same
  customer is counted once per historical version.</li>
  <li><strong>Type 3 and the other variants, briefly.</strong> Type 3 keeps a single "previous value" column
  alongside the current one — useful for a one-off reorganization where before-and-after comparison matters and
  full history does not. Type 0 never changes an attribute at all (an original signup date). Both appear
  occasionally as distractors; Types 1 and 2 are what actually get tested.</li>
</ul>
<p>The same customer reclassification, under each type:</p>
<table>
  <tr><th colspan="6">Type 1 — after the update, the SMB history is gone</th></tr>
  <tr><th>customer_key</th><th>customer_id</th><th>name</th><th>segment</th><th>effective_from</th><th>is_current</th></tr>
  <tr><td>4471</td><td>C-1093</td><td>Aurora Ltd</td><td>ENTERPRISE</td><td>—</td><td>—</td></tr>
</table>
<table>
  <tr><th colspan="7">Type 2 — the old version is closed off, a new row is added</th></tr>
  <tr><th>customer_key</th><th>customer_id</th><th>name</th><th>segment</th><th>effective_from</th><th>effective_to</th><th>is_current</th></tr>
  <tr><td>4471</td><td>C-1093</td><td>Aurora Ltd</td><td>SMB</td><td>2024-02-11</td><td>2026-03-31</td><td>false</td></tr>
  <tr><td>9902</td><td>C-1093</td><td>Aurora Ltd</td><td>ENTERPRISE</td><td>2026-04-01</td><td>9999-12-31</td><td>true</td></tr>
</table>
<pre><code>-- Type 1: overwrite, no history retained
MERGE INTO main.gold.dim_customer AS tgt
USING main.silver.customer_updates AS src
  ON tgt.customer_id = src.customer_id
WHEN MATCHED THEN UPDATE SET
  tgt.customer_name = src.customer_name,
  tgt.segment       = src.segment,
  tgt.region        = src.region
WHEN NOT MATCHED THEN INSERT (customer_id, customer_name, segment, region)
  VALUES (src.customer_id, src.customer_name, src.segment, src.region);</code></pre>
<pre><code>-- Type 2, step 1: close out the current row for any customer whose
-- tracked attributes changed. The union trick makes MERGE both close the old
-- row and insert the new one in a single pass: rows with a NULL merge key
-- can never match, so they fall through to the INSERT branch.
MERGE INTO main.gold.dim_customer AS tgt
USING (
  -- row that will MATCH and close the existing version
  SELECT u.customer_id AS merge_key, u.*
  FROM main.silver.customer_updates u
  UNION ALL
  -- row that can never MATCH, so it becomes the new version
  SELECT NULL AS merge_key, u.*
  FROM main.silver.customer_updates u
  JOIN main.gold.dim_customer d
    ON u.customer_id = d.customer_id
   AND d.is_current = true
  WHERE u.segment <> d.segment OR u.region <> d.region
) AS src
  ON tgt.customer_id = src.merge_key
 AND tgt.is_current  = true

WHEN MATCHED AND (tgt.segment <> src.segment OR tgt.region <> src.region) THEN
  UPDATE SET
    tgt.is_current     = false,
    tgt.effective_to   = CURRENT_DATE() - INTERVAL 1 DAY

WHEN NOT MATCHED THEN
  INSERT (customer_id, customer_name, segment, region,
          effective_from, effective_to, is_current)
  VALUES (src.customer_id, src.customer_name, src.segment, src.region,
          CURRENT_DATE(), DATE'9999-12-31', true);</code></pre>
<pre><code>-- Current state only: one row per customer
SELECT segment, COUNT(*) AS customers
FROM main.gold.dim_customer
WHERE is_current = true
GROUP BY segment;

-- Point-in-time: which version was current on a given date
SELECT customer_id, customer_name, segment
FROM main.gold.dim_customer
WHERE DATE'2025-06-30' BETWEEN effective_from AND effective_to;

-- Correct fact join: surrogate key, so each fact matches exactly one version
SELECT c.segment, SUM(f.net_revenue_usd) AS net_revenue
FROM main.gold.fct_sales f
JOIN main.gold.dim_customer c ON f.customer_key = c.customer_key
GROUP BY c.segment;</code></pre>

<h2>17.7 Where modeling lands in the medallion architecture</h2>
<p>Star schemas do not appear at ingestion. They are the product of the medallion pipeline introduced in section 2
and built out in section 12, and they belong at its top layer — the gold layer is where raw source structure has
finally been resolved into the business's own vocabulary.</p>
<ul>
  <li><strong>Bronze keeps the source's shape.</strong> Raw ingested data lands as-is, in whatever normalized
  OLTP structure the source system happened to use, duplicates and all. Modeling it here would mean modeling before
  the data has been cleaned, and would have to be redone on every source change.</li>
  <li><strong>Silver cleans and conforms.</strong> Deduplication, type casting, null handling, quality
  expectations, and joining related source tables into coherent entities happen here. Silver is trustworthy but
  still shaped roughly like the source — normalized, and requiring several hops to answer a business question.</li>
  <li><strong>Gold is where the star schema lives.</strong> Fact and dimension tables are built from silver:
  surrogate keys assigned, dimensions denormalized and flattened, SCD Type 2 history maintained, grain declared
  explicitly, measures pre-computed where useful. This is the layer dashboards query, the layer a Genie space
  (section 16) should be pointed at, and the layer where business definitions are finally settled.</li>
  <li><strong>Modeling and Delta maintenance reinforce each other.</strong> A gold star schema is a natural target
  for the optimization work in section 4 — <code>OPTIMIZE</code> with liquid clustering or Z-ordering on the fact's
  common filter columns (date key, customer key) so dashboard and Genie queries stay fast. Dimensions are small
  enough that a broadcast join is typically automatic, which is a large part of why the star shape performs well.</li>
</ul>
<pre><code>-- Building a gold dimension from silver: this is where flattening happens
CREATE OR REPLACE TABLE main.gold.dim_product AS
SELECT
  p.product_id,
  p.product_name,
  c.category_name    AS category,     -- normalized in silver, flattened here
  s.subcategory_name AS subcategory,
  b.brand_name       AS brand,
  p.unit_cost_usd
FROM main.silver.products      p
JOIN main.silver.categories    c ON p.category_id    = c.category_id
JOIN main.silver.subcategories s ON p.subcategory_id = s.subcategory_id
JOIN main.silver.brands        b ON p.brand_id       = b.brand_id;

-- Keep the fact fast for the filters dashboards actually use
OPTIMIZE main.gold.fct_sales ZORDER BY (date_key, customer_key);</code></pre>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  The trap that catches people on SCD Type 2 is joining a fact table to the dimension on the <em>natural</em> key
  (<code>customer_id</code>) instead of the <em>surrogate</em> key (<code>customer_key</code>): because a Type 2
  dimension holds one row per historical version, that join multiplies every fact row by the number of versions
  that entity has, and <code>SUM(revenue)</code> comes back inflated with no error and no obvious symptom.
  Joining on the surrogate key matches exactly one version — the one that was current when the fact occurred — and
  <code>WHERE is_current = true</code> is what you add when the question is about today rather than about history.
  Two related traps to expect: Type 1 is the type that <em>loses</em> history (Type 2 preserves it, and answer
  options routinely swap them), and pointing a fact at "the current version" of a dimension is not the same as
  Type 2 modeling at all — it is Type 1 behavior wearing Type 2 columns.
</div>

<div class="cheat-section">
<h2>1. Spark Foundations</h2>
<ul class="cheat-list">
  <li>Spark: 2009 UC Berkeley AMPLab, open-sourced 2010, top-level Apache 2014. Built to fix MapReduce's disk round-trip per stage — keeps data in distributed memory.</li>
  <li>Driver plans + schedules (exactly 1 per app). Executors run tasks + hold cache. Cluster manager allocates machines.</li>
  <li>Partition = unit of parallelism. Skew (one oversized partition) is the classic slow-job cause. Shuffle = moving data across executors; <code>groupBy</code>/<code>join</code>/<code>orderBy</code>/<code>repartition</code> trigger it.</li>
  <li><code>repartition(n)</code> = up or down, full shuffle. <code>coalesce(n)</code> = down only, avoids full shuffle.</li>
  <li>RDD = low-level, no schema, no optimization. DataFrame (Spark 1.3) = named typed columns → Catalyst can optimize. Tungsten = binary memory format + codegen.</li>
  <li>Transformations (<code>select</code>/<code>filter</code>/<code>groupBy</code>/<code>join</code>/<code>withColumn</code>) are lazy. Actions (<code>count</code>/<code>collect</code>/<code>show</code>/<code>write</code>) trigger execution.</li>
  <li>1 action = 1 <strong>job</strong>. Job splits into <strong>stages</strong> at shuffle boundaries. Stage splits into 1 <strong>task</strong> per partition.</li>
  <li><code>.cache()</code> is lazy — populated by the first action. <code>.unpersist()</code> releases it. Only worth it if reused by multiple actions.</li>
</ul>
</div>

<div class="cheat-section">
<h2>2. Lakehouse & Medallion</h2>
<ul class="cheat-list">
  <li>Lakehouse = ACID + schema enforcement + fast SQL, built directly on cheap object storage (open formats).</li>
  <li>Bronze = raw/as-is, append-only, schema-permissive on purpose, ingestion must be idempotent. Silver = cleaned/deduped/conformed, enforces an explicit schema contract. Gold = aggregated/query-shaped for readers.</li>
  <li>Sub-stages inside a layer (cleaned vs enriched silver) do NOT make a new layer — still 3 conceptually.</li>
  <li>Variants exist: landing zone before bronze, "platinum" beyond gold, fan-out DAG rather than a straight line.</li>
  <li>"Medallion" and "multi-hop" are the same pattern. Delta Lake is the tech that enables it, not the pattern itself.</li>
</ul>
</div>

<div class="cheat-section">
<h2>3. Platform Structure</h2>
<ul class="cheat-list">
  <li>UC hierarchy: <code>metastore → catalog → schema → table/view/volume/function</code>. Reference as <code>catalog.schema.table</code>.</li>
  <li>All-purpose cluster = interactive/dev, stays up, costs more. Job cluster = spun up per job run, terminates after, cheaper.</li>
  <li>Cluster policy = admin guardrail on allowed cluster configs. Photon = native vectorized engine, no code change needed.</li>
  <li><code>%run</code> shares variables with the calling notebook; <code>%sql</code>/<code>%python</code>/<code>%md</code> set cell language.</li>
</ul>
</div>

<div class="cheat-section">
<h2>4. Delta Lake</h2>
<ul class="cheat-list">
  <li><code>_delta_log</code>: ordered JSON commits + periodic Parquet checkpoints (every 10 commits) = the source of truth for table state.</li>
  <li>Schema enforcement = default, rejects mismatched writes. Evolution requires explicit <code>mergeSchema</code> (add cols) or <code>overwriteSchema</code> (replace).</li>
  <li>Time travel: <code>SELECT * FROM t VERSION AS OF 4</code> / <code>TIMESTAMP AS OF '2026-01-01'</code>. <code>DESCRIBE HISTORY t</code> lists versions. <code>RESTORE TABLE t TO VERSION AS OF 4</code>.</li>
  <li><code>OPTIMIZE t ZORDER BY (col)</code> = compact small files + co-locate by column for data skipping.</li>
  <li><code>VACUUM t</code> = hard-deletes files past retention (default 7 days). Running with a short retention breaks time travel / concurrent long-running reads. OPTIMIZE/ZORDER never delete — only VACUUM does.</li>
</ul>
</div>

<div class="cheat-section">
<h2>5. Governance & Security</h2>
<ul class="cheat-list">
  <li>Unity Catalog replaces legacy Hive metastore/table-ACLs — centralized across all workspaces in a region.</li>
  <li><code>GRANT SELECT ON TABLE cat.sch.tbl TO \`group\`</code> / <code>REVOKE ...</code>. Privileges inherit downward from catalog → schema → table.</li>
  <li>Principals: users, groups, service principals. <code>USE CATALOG</code>/<code>USE SCHEMA</code> are prerequisites for object privileges to take effect.</li>
  <li>Row/column security via dynamic views using <code>CURRENT_USER()</code> or <code>is_account_group_member()</code>. Grant on the VIEW, never the base table — a direct base-table grant bypasses it entirely.</li>
  <li>Lineage is automatic in UC — table and column level.</li>
</ul>
</div>

<div class="cheat-section">
<h2>11. ELT with Spark SQL & Python</h2>
<ul class="cheat-list">
  <li><code>MERGE INTO target USING source ON cond WHEN MATCHED THEN UPDATE ... WHEN NOT MATCHED THEN INSERT ...</code> = atomic upsert; idempotent on re-run.</li>
  <li>Match on a non-unique key → runtime failure ("multiple source rows matched").</li>
  <li>Auto Loader (<code>cloudFiles</code>) for high-volume continuous arrival + schema evolution; <code>COPY INTO</code> for simpler idempotent batch. <code>trigger(availableNow=True)</code> gives batch semantics with Auto Loader's file discovery.</li>
  <li>PySpark ≈ SQL: <code>.select()</code>≈SELECT, <code>.filter()</code>≈WHERE, <code>.groupBy().agg()</code>≈GROUP BY, <code>.join()</code>≈JOIN.</li>

<h2>12. Multi-Hop Pipelines</h2>
<ul class="cheat-list">
  <li><code>ALTER TABLE t ADD CONSTRAINT name CHECK (col > 0)</code> and <code>NOT NULL</code> enforce quality at write time.</li>
  <li>Constraints only accept or reject — they never clean or route. A quarantine table needs explicit filtering logic (<code>is_valid</code> / <code>~is_valid</code>).</li>
  <li>Bronze/silver append (accumulate history); gold aggregates typically <code>overwrite</code> (derived summary).</li>
</ul>
</div>

<div class="cheat-section">
<h2>13. Workflows / Lakeflow Jobs</h2>
<ul class="cheat-list">
  <li>A Job = one or more Tasks (notebook/script/SQL/dbt/pipeline) with <code>depends_on</code> forming a DAG. "Workflows" and "Lakeflow Jobs" = same thing.</li>
  <li>Triggers: manual, scheduled/cron, file-arrival, continuous. Retries: <code>max_retries</code>, <code>retry_on_timeout</code>.</li>
  <li>Retry ≠ continuous trigger: retry re-runs a failed task in the same run; continuous starts a whole new run.</li>
  <li>CI/CD via Databricks Asset Bundles (<code>databricks.yml</code> + <code>targets</code> per env), deployed with <code>databricks bundle deploy -t prod</code>.</li>
</ul>
</div>

<div class="cheat-section">
<h2>14. Delta Live Tables</h2>
<ul class="cheat-list">
  <li>DLT is declarative: define target tables, DLT infers the DAG from table references and handles order/retries/compute.</li>
  <li>Expectations: <code>@dlt.expect</code> (warn, keep row), <code>@dlt.expect_or_drop</code> (drop row), <code>@dlt.expect_or_fail</code> (halt pipeline). Dropped rows are NOT auto-quarantined.</li>
  <li>Streaming table = incremental/append-only. Materialized view = recomputed from its query on refresh.</li>
</ul>
</div>

<div class="cheat-section">
<h2>15. Production Considerations</h2>
<ul class="cheat-list">
  <li>Jobs permissions: <code>CAN_VIEW</code> &lt; <code>CAN_MANAGE_RUN</code> &lt; <code>CAN_MANAGE</code> (each a superset of the last).</li>
  <li>Job permissions ≠ data permissions — the run-as identity still needs UC grants on the tables.</li>
  <li>Common failures: schema mismatch, permission denied, cluster startup failure, out-of-memory (often skew or an accidental cross join).</li>

<div class="cheat-section">

  <li>Point Genie at clean gold-layer tables, not hundreds of raw tables. Good names + comments materially improve accuracy.</li>
  <li>Iterate via question history + marking bad answers, then add instructions/examples that close that gap.</li>
</ul>
</div>

<div class="cheat-section">

  <li>Star schema = central fact table (measures + FK keys) surrounded by denormalized dimension tables. Snowflake = normalized dimensions; star usually wins in a lakehouse (fewer joins, cheap storage).</li>

  <li>Surrogate key = system-generated, stable; natural/business key = source-supplied and can change. SCD2 requires a surrogate key since the natural key repeats across versions.</li>
  <li>Star-schema modeling lands in the gold layer.</li>
</ul>
</div>
