<h1>6. Databricks SQL Environment</h1>

<h2>6.1 The Databricks SQL persona</h2>
<p>Imagine handing a data engineer's full workspace — notebooks, cluster configuration screens, MLflow experiment
tracking, job orchestration graphs — to an analyst who just wants to write a query and see a bar chart. Most of
that screen is noise: the analyst doesn't create clusters, doesn't write Python, and doesn't care about experiment
runs. Databricks solves this by offering different "personas," or workspace views, tailored to different roles.
Switching the persona selector to <strong>SQL</strong> swaps the entire left-hand navigation and home screen into
a purpose-built environment for querying, visualizing, and dashboarding — this is the <strong>Databricks SQL</strong>
workspace, distinct from the <strong>Data Science & Engineering</strong> persona that notebooks and Spark jobs live
in. Both personas point at the same underlying data and Unity Catalog metastore; only the tools presented change.</p>
<ul>
  <li><strong>Data Science & Engineering persona.</strong> Notebooks, repos, cluster management, workflows/jobs,
  and MLflow — the environment for building pipelines, writing PySpark/Scala, and training models. Compute here is
  an all-purpose or job cluster.</li>
  <li><strong>SQL persona.</strong> SQL editor, saved queries, dashboards, alerts, and query history — the
  environment for ad hoc analysis and BI. Compute here is a SQL warehouse, not a general-purpose cluster, and the
  UI hides notebook/cluster concepts entirely.</li>
  <li><strong>Shared governance.</strong> Both personas read and write through the same Unity Catalog objects
  (catalogs, schemas, tables, views), so a table an engineer builds in a notebook is immediately queryable by an
  analyst in the SQL editor with no data movement, no export/import step, and no separate permission system to
  configure — a grant issued once in Unity Catalog governs access from either persona identically.</li>
  <li><strong>Why the split exists at all.</strong> Databricks began as a Spark notebook platform for engineers and
  data scientists; the SQL persona was built specifically to make the same lakehouse data approachable to analysts
  and BI tools without asking them to learn Spark, clusters, or notebooks — the underlying pitch is "one copy of
  data, no separate BI warehouse to sync," which is what section 6.3's SQL warehouses exist to deliver on.</li>
</ul>

<h2>6.2 The SQL editor</h2>
<p>The <strong>SQL editor</strong> is the query-writing surface inside the SQL persona: a text pane for SQL, a
schema browser on the side to explore catalogs/schemas/tables without leaving the page, and a results pane below
that renders output as a table or a chart with one click. Queries can be saved, organized into folders, scheduled
to re-run automatically, and reused as the data source for dashboard visualizations.</p>
<pre><code>-- A typical SQL editor query against a Unity Catalog table
SELECT region, SUM(sales_amount) AS total_sales
FROM main.sales.transactions
WHERE order_date >= DATE'2026-01-01'
GROUP BY region
ORDER BY total_sales DESC;</code></pre>
<ul>
  <li><strong>Schema browser.</strong> A collapsible panel listing catalogs, schemas, tables, and views the current
  user has permission to see, letting an analyst inspect column names, types, and sample values before writing a
  query instead of guessing or switching to a separate catalog-explorer tool. Objects the user lacks SELECT on
  either don't appear or appear without a preview, which is itself a quiet signal about what access exists.</li>
  <li><strong>Saved queries.</strong> Any query can be named and saved for reuse; saved queries become the building
  blocks of dashboards, and their results can be scheduled to refresh independently of any dashboard. A saved query
  also has its own permission model — it can be shared read-only, shared editable, or kept private, separate from
  the underlying table grants.</li>
  <li><strong>Parameters.</strong> A query can define a widget-backed parameter (for example a date range or region
  picker) referenced in the SQL text, letting the same saved query serve multiple filtered views without editing SQL
  (covered in depth for dashboards in section 9.4).</li>
  <li><strong>Multiple tabs and query folders.</strong> The editor supports multiple open query tabs at once, and
  saved queries can be organized into folders with their own sharing permissions — mirroring how notebooks can be
  organized into workspace folders in the engineering persona, so the two personas feel consistent even though the
  underlying artifacts differ.</li>
  <li><strong>Format SQL and keyboard shortcuts.</strong> A built-in formatter reindents and standardizes SQL
  keyword casing with one click or shortcut, which matters more than it sounds in a shared team environment where
  inconsistent formatting makes diffing or reviewing a colleague's saved query harder than it needs to be.</li>
</ul>

<h2>6.3 SQL warehouses and their types</h2>
<p>Running a SQL query still requires compute somewhere — the difference from a notebook cluster is that a SQL
warehouse is pre-tuned for exactly one workload: short, concurrent, interactive SQL queries against Delta tables.
Instead of an analyst configuring instance types and Spark versions, they pick a size and a warehouse type and
Databricks handles the rest. There are three types of SQL warehouse, trading off startup time, cost, and how much
infrastructure Databricks manages on the customer's behalf.</p>
<table>
  <tr><th>Type</th><th>Startup time</th><th>Compute location</th><th>Best for</th></tr>
  <tr><td><strong>Serverless</strong></td><td>Seconds — compute is pre-warmed and pooled by Databricks</td>
  <td>Runs in Databricks' own cloud account</td><td>Interactive BI, ad hoc analyst queries, dashboards needing
  instant response with no cold start</td></tr>
  <tr><td><strong>Pro</strong></td><td>Fast (low minutes), some Photon/optimization features Classic lacks</td>
  <td>Runs in the customer's cloud account</td><td>Teams wanting Serverless-like SQL features (e.g. predictive I/O)
  but needing compute inside their own VPC for network/compliance reasons</td></tr>
  <tr><td><strong>Classic</strong></td><td>Slower (minutes) — provisions a new cluster from cloud provider VMs</td>
  <td>Runs in the customer's cloud account</td><td>Cost-sensitive or simple workloads where startup latency is
  tolerable and no advanced features are needed</td></tr>
</table>
<p>All three bill separately from all-purpose compute clusters and support auto-stop after a configurable idle
period, but only Serverless eliminates cold-start entirely because the underlying capacity is already running in
Databricks' account, ready to be assigned the moment a query arrives. Pro and Classic both provision cloud VMs on
demand inside the customer's own account, which is what produces their multi-minute startup — Pro simply layers
newer query-optimization features (like predictive I/O and faster auto-scaling) on top of that same customer-owned
provisioning model, it does not remove the cold start itself.</p>

<div class="diagram">
  <svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
    <text x="10" y="20" font-size="11" font-weight="600">Serverless</text>
    <rect x="10" y="30" width="40" height="24" rx="4"></rect>
    <text x="60" y="46" font-size="10" class="dim">seconds — pre-warmed pool in Databricks' account</text>

    <text x="10" y="82" font-size="11" font-weight="600">Pro</text>
    <rect x="10" y="92" width="220" height="24" rx="4"></rect>
    <text x="240" y="108" font-size="10" class="dim">low minutes — new VMs in customer account</text>

    <text x="10" y="144" font-size="11" font-weight="600">Classic</text>
    <rect x="10" y="154" width="340" height="24" rx="4"></rect>
    <text x="360" y="170" font-size="10" class="dim">minutes — new VMs, fewer optimizations</text>
  </svg>
  <div class="diagram-caption">Relative startup latency: Serverless (pre-warmed) vs Pro vs Classic (both provision cloud VMs on cold start).</div>
</div>

<h2>6.4 Warehouse sizing and concurrency</h2>
<p>A warehouse's <strong>size</strong> controls how much compute a single cluster in that warehouse has — expressed
as a T-shirt size (2X-Small through 4X-Large) rather than raw instance types, so an analyst never has to reason
about VM SKUs. Size affects how fast one query runs, especially over large scans or heavy aggregations. Size alone,
however, does not solve the problem of many people running queries at the same time; that's what <strong>multi-cluster
warehouses</strong> and <strong>scaling</strong> settings are for — they let a warehouse spin up additional clusters
of the same size to absorb concurrent query load, then scale back down as load drops.</p>
<ul>
  <li><strong>Cluster size (T-shirt size).</strong> 2X-Small, X-Small, Small, Medium, Large, X-Large, 2X-Large,
  3X-Large, 4X-Large — each step roughly doubles compute, improving the speed of any single query (larger scans,
  heavier joins, bigger aggregations finish faster). Sizing up a warehouse that's already fast enough for its
  queries just burns money for no perceptible benefit — size should be driven by observed query duration in query
  history (section 6.5), not guessed upfront.</li>
  <li><strong>Cluster count / auto-scaling.</strong> A warehouse can be configured with a minimum and maximum
  number of clusters (multi-cluster mode); Databricks automatically adds clusters as concurrent queries queue up
  and removes them as demand drops, so 50 analysts hitting the same dashboard don't queue behind one cluster.
  Setting min clusters above 1 keeps that many clusters running at all times, trading idle cost for zero queueing
  even at the very first concurrent spike.</li>
  <li><strong>Auto-stop.</strong> An idle timeout after which the warehouse suspends itself to stop billing;
  balancing a short auto-stop (saves cost) against a longer one (avoids cold-start latency for the next user) is a
  common configuration trade-off. Serverless warehouses make this trade-off nearly moot since their "start" from
  stopped is seconds either way; the trade-off bites hardest on Classic warehouses where a too-short auto-stop
  means the very next analyst eats a multi-minute cold start.</li>
  <li><strong>Scaling vs. sizing, contrasted directly.</strong> A single analyst running one enormous aggregation
  query is a sizing problem — a bigger single cluster finishes that one query faster. Fifty analysts each running
  small, fast queries at the same moment is a scaling problem — no amount of single-cluster size fixes queuing,
  because the queries aren't slow individually, there just aren't enough clusters to run them all in parallel.</li>
</ul>

<h2>6.5 Query history</h2>
<p>Every query run against a SQL warehouse — whether typed into the SQL editor, fired by a dashboard refresh, or
triggered by a BI tool over JDBC/ODBC — is logged in <strong>query history</strong>, giving analysts and admins a
single place to see what ran, who ran it, how long it took, and whether it failed. This is the first place to look
when a dashboard feels slow or a scheduled query silently stopped updating.</p>
<ul>
  <li><strong>Query list and filters.</strong> Query history can be filtered by warehouse, user, status
  (finished/failed/running), and time range, making it possible to isolate, for example, every query that failed
  in the last hour on a specific warehouse.</li>
  <li><strong>Execution details.</strong> Selecting a query shows its full SQL text, start/end time, duration,
  rows returned, and the warehouse it ran on — enough to confirm which exact query produced a given dashboard tile.</li>
  <li><strong>Query profile.</strong> A visual breakdown of a query's execution plan and where time was spent
  (scan, shuffle, join, aggregation stages), used to diagnose *why* a specific query is slow — for example
  revealing a full table scan where a filter should have pruned partitions, or a skewed join spending most of its
  time on one task.</li>
  <li><strong>Distinguishing a queuing problem from a compute problem in query history.</strong> A query that spent
  most of its wall-clock time in a "queued" state before execution even started points at a scaling/concurrency
  shortage (section 6.4) — adding a cluster fixes it. A query that started immediately but ran long inside the
  execution phase itself points at either an undersized warehouse or a genuinely inefficient query plan, which the
  query profile's stage breakdown will usually pinpoint (e.g. a shuffle stage dominating runtime because of a
  skewed join key).</li>
</ul>
<pre><code>-- A query that would show up in query history, and whose slowness
-- would be diagnosed via its query profile if the join skews
SELECT c.customer_id, c.region, SUM(o.order_total) AS lifetime_value
FROM main.sales.orders o
JOIN main.sales.customers c ON o.customer_id = c.customer_id
GROUP BY c.customer_id, c.region;</code></pre>

<h2>6.6 Alerts</h2>
<p>A dashboard only surfaces a problem if someone happens to be looking at it. An <strong>alert</strong> flips that
around: it periodically re-runs a saved query on a schedule, evaluates a condition against the result (for example,
"is the value in this column greater than a threshold"), and proactively pushes a notification when the condition
triggers — so an analyst finds out a KPI breached a limit without having to check a dashboard at all.</p>
<pre><code>-- A saved query an alert can be attached to; the alert watches
-- the single returned value against a threshold, e.g. > 100
SELECT COUNT(*) AS failed_orders
FROM main.sales.orders
WHERE order_status = 'FAILED'
  AND order_date >= current_date() - INTERVAL 1 DAY;</code></pre>
<ul>
  <li><strong>Trigger condition.</strong> An alert is configured against one column of a query's result with an
  operator and threshold (greater than, less than, equal to, etc.); it evaluates on the schedule attached to the
  underlying query, not continuously in real time. If a query returns multiple rows, the alert typically evaluates
  against the first row/value returned, which makes writing a tightly-scoped single-value query (as above) the
  correct pattern rather than relying on the alert to pick the "right" row out of many.</li>
  <li><strong>Notification destinations.</strong> When triggered, an alert can notify via email, or through
  configured destinations such as Slack or a generic webhook, so the right channel or person is reached without
  anyone manually checking results.</li>
  <li><strong>State tracking.</strong> An alert has a status (triggered/ok) and can be configured to re-notify on
  every evaluation or only when it changes state, avoiding repeated pages for a condition that remains triggered
  across many scheduled runs.</li>
  <li><strong>Alert schedule vs. query schedule.</strong> An alert rides on its underlying query's refresh
  schedule — it cannot evaluate more frequently than that query actually re-runs. A query scheduled to refresh
  every 6 hours produces an alert that can only ever notice a breach up to 6 hours after it started, regardless of
  how urgent the condition being watched actually is; matching schedule frequency to how time-sensitive the alert
  needs to be is a deliberate design choice, not a default to leave alone.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  The exam distinguishes SQL warehouse *type* (Serverless vs Pro vs Classic — governs where compute runs and
  startup latency) from warehouse *size* (2X-Small...4X-Large — governs single-query speed) from *cluster count*
  (multi-cluster scaling — governs concurrent-user throughput). A scenario about "many analysts querying
  simultaneously and experiencing queueing" is a cluster-count/scaling problem, not a size problem — bumping size
  speeds up individual queries but does nothing for queueing if only one cluster exists to serve them all. A
  related trap: assuming Pro warehouses start as fast as Serverless because both offer "advanced" features — Pro
  still provisions VMs in the customer's own cloud account on cold start, so only Serverless gets the
  near-instant startup.
</div>

<h1>7. Data Management with SQL</h1>

<h2>7.1 Creating tables</h2>
<p>Suppose a source system drops a folder of Parquet files into cloud storage every night, and an analyst wants
that data queryable as a normal SQL table by morning without writing any Spark code. Databricks lets a table be
defined declaratively in SQL — specifying columns and types up front, or letting the shape of an existing query's
output define the table automatically. The first approach is a plain <strong>CREATE TABLE</strong>, and by default
every table created this way is a Delta table, giving it ACID transactions and time travel with no extra syntax.</p>
<pre><code>CREATE TABLE main.sales.orders (
  order_id     BIGINT,
  customer_id  BIGINT,
  order_date   DATE,
  order_total  DECIMAL(10,2),
  order_status STRING
);</code></pre>
<ul>
  <li><strong>CREATE TABLE.</strong> Declares column names and types explicitly; the table is empty until rows are
  inserted, loaded via <code>COPY INTO</code>, or merged in — the DDL only defines structure.</li>
  <li><strong>CREATE OR REPLACE TABLE.</strong> Drops and recreates a table in one statement, useful when a
  pipeline needs to fully rebuild a table's schema and contents each run rather than incrementally updating it.
  Unlike a manual <code>DROP TABLE</code> followed by <code>CREATE TABLE</code>, this is a single atomic operation
  from the querying side, and on a managed table it still deletes the prior version's data files once the old
  table version is no longer referenced.</li>
  <li><strong>CREATE TABLE IF NOT EXISTS.</strong> A no-op if the table already exists, useful in setup scripts
  that may be re-run without erroring on objects that already exist. It does not update the schema of an existing
  table to match the new DDL — if the table already exists with a different shape, this statement silently leaves
  it as-is rather than reconciling the difference.</li>
  <li><strong>Column defaults, comments, and constraints.</strong> A column can carry a <code>COMMENT</code> for
  documentation surfaced directly in the schema browser and Unity Catalog, and Delta tables support declaring
  <code>NOT NULL</code> and <code>CHECK</code> constraints that reject any write violating them at commit time —
  giving a SQL-only table author the same kind of guardrails an engineer might otherwise enforce in pipeline code.</li>
</ul>
<pre><code>CREATE TABLE main.sales.orders (
  order_id     BIGINT NOT NULL COMMENT 'Primary key, generated upstream',
  customer_id  BIGINT,
  order_date   DATE,
  order_total  DECIMAL(10,2),
  order_status STRING
);

ALTER TABLE main.sales.orders
  ADD CONSTRAINT positive_total CHECK (order_total >= 0);</code></pre>

<h2>7.2 CREATE VIEW and CTAS</h2>
<p>Not every reusable query needs its own stored copy of data. A <strong>view</strong> saves a query definition
under a name so it can be queried like a table, but every time it's queried the underlying SQL re-runs against the
live source tables — no data is duplicated. A <strong>CTAS</strong> (<strong>CREATE TABLE AS SELECT</strong>) goes
the other way: it runs a query once and materializes the result as a brand-new physical table, which is faster to
query afterward but goes stale the moment the source data changes, since it's a snapshot rather than a live
definition.</p>
<pre><code>-- View: always reflects current data in orders/customers, no storage duplicated
CREATE VIEW main.sales.vw_high_value_orders AS
SELECT o.order_id, o.order_total, c.customer_name
FROM main.sales.orders o
JOIN main.sales.customers c ON o.customer_id = c.customer_id
WHERE o.order_total > 1000;

-- CTAS: materializes a physical table from a query's result, schema inferred automatically
CREATE TABLE main.sales.orders_2026 AS
SELECT * FROM main.sales.orders
WHERE order_date >= DATE'2026-01-01';</code></pre>
<ul>
  <li><strong>View.</strong> No storage cost beyond the query text, always current, but re-executes its underlying
  query (and pays that compute cost) on every read; good for reusable filtered/joined logic that must stay fresh.</li>
  <li><strong>CTAS.</strong> Schema is inferred from the SELECT output — no need to declare column types by hand —
  and the result is stored as an independent Delta table; good for snapshots, one-off transformations, or seeding
  a new table from an existing one.</li>
  <li><strong>Materialized view, as the middle ground.</strong> A materialized view (in Databricks, typically
  authored via Delta Live Tables/pipelines rather than plain CREATE VIEW) stores its result like a CTAS but
  automatically and incrementally refreshes as source data changes, avoiding both the "recompute on every query"
  cost of a plain view and the "goes stale silently" problem of a one-shot CTAS. It's the right answer when a
  query is expensive to run but the result still needs to stay reasonably current.</li>
  <li><strong>Choosing between the three.</strong> A cheap query over small data that must always be current: plain
  view. An expensive query whose result is needed once, as a fixed snapshot: CTAS. An expensive query whose result
  needs to stay current without re-paying the full cost on every read: materialized view.</li>
</ul>

<h2>7.3 Managed vs. external tables</h2>
<p>When a table is dropped, what happens to the underlying data files is not always obvious, and it depends
entirely on who "owns" the storage location. Picture two setups: in one, Databricks picks the storage path itself
inside a managed area of the metastore and treats that storage as fully its own — dropping the table deletes both
the metadata *and* the files. In the other, the data already lives in a specific cloud storage path that other
tools or teams also depend on, and Databricks is told to register that existing location as a table without ever
taking ownership of the files themselves — dropping the table removes only the catalog entry, leaving the data
untouched. These are <strong>managed tables</strong> and <strong>external tables</strong> respectively.</p>
<pre><code>-- Managed table: Databricks chooses and owns the storage location
CREATE TABLE main.sales.orders_managed (
  order_id BIGINT,
  order_total DECIMAL(10,2)
);

-- External table: data already exists at this path; Databricks only tracks metadata
CREATE TABLE main.sales.orders_external (
  order_id BIGINT,
  order_total DECIMAL(10,2)
)
LOCATION 's3://company-data-lake/sales/orders_external/';</code></pre>
<table>
  <tr><th></th><th>Managed table</th><th>External table</th></tr>
  <tr><td>Storage location</td><td>Chosen by Databricks, inside the metastore's managed storage</td>
  <td>Specified explicitly via <code>LOCATION</code>, outside metastore-managed storage</td></tr>
  <tr><td>Who owns the data</td><td>Databricks owns both data and metadata</td>
  <td>Databricks owns only metadata; the data is owned externally</td></tr>
  <tr><td>Effect of <code>DROP TABLE</code></td><td>Deletes metadata AND underlying data files</td>

<h2>7.4 Loading files incrementally with COPY INTO</h2>
<p>Reloading an entire folder of source files every time a table needs fresh data wastes compute and risks
duplicate rows if files that were already loaded get processed again. <strong>COPY INTO</strong> solves this by
tracking, per target table, which source files it has already loaded — re-running the exact same <code>COPY
INTO</code> statement against a folder that now has a few new files will load only those new files, skipping
everything already ingested. This makes it <strong>idempotent</strong>: running it repeatedly on a schedule is
safe and produces no duplicates, which is why it's a common pattern for incremental bronze-layer ingestion.</p>
<pre><code>COPY INTO main.sales.orders_bronze
FROM 's3://company-data-lake/raw/orders/'
FILEFORMAT = JSON
FORMAT_OPTIONS ('inferSchema' = 'true')
COPY_OPTIONS ('mergeSchema' = 'true');</code></pre>
<ul>
  <li><strong>File tracking.</strong> Databricks records which source files have already been loaded into the
  target table, so a second run against the same directory only picks up files that weren't there (or weren't
  loaded) before.</li>
  <li><strong>FILEFORMAT and FORMAT_OPTIONS.</strong> Supports CSV, JSON, Parquet, Avro, ORC, and more; format
  options control parsing behavior like header rows, delimiters, or schema inference.</li>
  <li><strong>Schema evolution.</strong> <code>mergeSchema</code> lets new columns appearing in later files be
  added to the target table automatically instead of failing the load.</li>
  <li><strong>COPY INTO vs. Auto Loader.</strong> COPY INTO is a SQL statement run explicitly (or on a query
  schedule) that scans the source location's file listing each run — fine for thousands of files arriving in
  batches. Auto Loader (a Spark Structured Streaming source, covered in the data engineering track) uses file
  notification or optimized directory listing to handle continuously arriving files at much larger scale with
  lower per-run overhead; COPY INTO is the SQL-accessible, simpler tool of the two and is what an analyst without
  Spark/Python access would reach for.</li>
</ul>
<pre><code>-- Re-running the identical statement after 3 new files land is safe:
-- only those 3 are loaded, previously-loaded files are skipped automatically
COPY INTO main.sales.orders_bronze
FROM 's3://company-data-lake/raw/orders/'
FILEFORMAT = JSON
FORMAT_OPTIONS ('inferSchema' = 'true')
COPY_OPTIONS ('mergeSchema' = 'true');</code></pre>

<h2>7.5 Working with semi-structured JSON</h2>
<p>Source systems frequently hand off nested JSON rather than flat rows — an order record with a customer object
and an array of line items embedded inside a single string column. Rather than forcing that structure into rigid
relational columns before it can be queried, Spark SQL can reach directly into a JSON string and pull fields out
on demand, or explode a nested array into one row per element, all using ordinary SQL syntax.</p>
<pre><code>-- Sample: a STRING column holding raw JSON
-- payload = '{"customer": {"name": "Acme Co", "tier": "gold"}, "items": [{"sku":"A1","qty":2},{"sku":"B2","qty":1}]}'

-- The : operator walks a JSON path directly in a string column
SELECT
  payload:customer.name  AS customer_name,
  payload:customer.tier  AS customer_tier
FROM main.sales.raw_orders;

-- from_json parses a JSON string into a typed STRUCT using an explicit schema
SELECT from_json(payload, 'customer STRUCT<name STRING, tier STRING>, items ARRAY<STRUCT<sku STRING, qty INT>>') AS parsed
FROM main.sales.raw_orders;

-- explode turns an array column into one row per element
SELECT order_id, exploded_item.sku, exploded_item.qty
FROM (
  SELECT order_id, from_json(payload, 'items ARRAY<STRUCT<sku STRING, qty INT>>').items AS items
  FROM main.sales.raw_orders
)
LATERAL VIEW explode(items) AS exploded_item;</code></pre>
<ul>
  <li><strong>The <code>:</code> colon operator.</strong> Lets a query reach into a JSON string column using a dot
  path (and bracket indexing for arrays) without any upfront schema declaration — fastest way to pull one or two
  fields out for a quick query. It always returns a STRING, so numeric or boolean fields pulled this way usually
  need an explicit <code>CAST</code> before they can be used in arithmetic or numeric comparisons.</li>
  <li><strong>from_json.</strong> Parses an entire JSON string into a structured, typed value (STRUCT/ARRAY/MAP)
  given an explicit schema, enabling further structured operations like dot-notation access or joins on nested fields.</li>
  <li><strong>explode.</strong> Converts an array (often one produced by <code>from_json</code>) into multiple
  rows, one per array element — essential for turning a nested "line items" array into a proper row-per-item fact table.
  <code>explode_outer</code> is the variant to reach for when an order can legitimately have zero items, since plain
  <code>explode</code> drops the row entirely for an empty or null array rather than keeping it with null item columns.</li>
  <li><strong>The variant type.</strong> A native Spark SQL type for storing semi-structured data (JSON) in a
  column while preserving its original nested shape and types, avoiding the upfront rigidity of fully flattening
  it into columns while still allowing efficient querying — useful when a source's JSON schema varies or evolves
  across records and a single fixed STRUCT schema would break on some rows.</li>
  <li><strong>to_json, the inverse operation.</strong> Serializes a STRUCT/ARRAY/MAP column back into a JSON
  string — used when a downstream system or export format expects a single JSON text field rather than the
  exploded/structured representation used for querying.</li>
</ul>
<pre><code>-- explode_outer keeps orders with an empty items array instead of silently dropping them
SELECT order_id, exploded_item.sku, exploded_item.qty
FROM (
  SELECT order_id, from_json(payload, 'items ARRAY<STRUCT<sku STRING, qty INT>>').items AS items
  FROM main.sales.raw_orders
)
LATERAL VIEW explode_outer(items) AS exploded_item;</code></pre>

<h2>7.6 MERGE INTO for upserts</h2>
<p>A nightly batch of changed-and-new customer records needs to update existing rows that changed and insert rows
that are genuinely new — doing that with separate <code>UPDATE</code> and <code>INSERT</code> statements requires
figuring out, outside the database, which rows fall into which bucket. <strong>MERGE INTO</strong> does both in a
single atomic statement by joining a source dataset against a target table on a key and specifying what to do on a
match versus no match, which is the standard SQL pattern for CDC-style (change data capture) upserts into a Delta
table.</p>
<pre><code>MERGE INTO main.sales.customers AS target
USING staging.customers_changes AS source
ON target.customer_id = source.customer_id
WHEN MATCHED THEN
  UPDATE SET target.email = source.email, target.tier = source.tier
WHEN NOT MATCHED THEN
  INSERT (customer_id, email, tier) VALUES (source.customer_id, source.email, source.tier);</code></pre>
<ul>
  <li><strong>WHEN MATCHED.</strong> Applies to rows present in both target and source on the join key — typically
  an UPDATE, but can also be a DELETE (e.g. to remove target rows flagged as deleted in the source feed).</li>
  <li><strong>WHEN NOT MATCHED.</strong> Applies to source rows with no corresponding target row — an INSERT of the
  new row, which is what makes this an "upsert" rather than a plain update.</li>
  <li><strong>WHEN NOT MATCHED BY SOURCE.</strong> The less-used third clause: applies to target rows that have no
  matching source row at all, useful for handling records that should be deleted or flagged when they disappear
  from an incoming feed entirely.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  The single most common exam trap is predicting the result of <code>DROP TABLE</code> incorrectly: dropping a
  MANAGED table deletes the actual data files, while dropping an EXTERNAL table leaves them untouched in cloud
  storage — the presence of a <code>LOCATION</code> clause in the original <code>CREATE TABLE</code> is the tell
  for "external." A second, related trap: creating a table with <code>LOCATION</code> pointing at a path that
  already has data in it makes those existing files immediately part of the table — no load step needed — which
  surprises people expecting an empty table. A third trap specific to <code>MERGE INTO</code>: if the join
  condition on the key isn't actually unique on the source side (duplicate keys in the source dataset), the merge
  fails at runtime with an error about multiple source rows matching a single target row — MERGE does not silently
  pick one and discard the rest.
</div>

<h1>8. SQL Analytics Queries</h1>

<h2>8.1 Joins</h2>
<p>Consider two tables — <code>orders</code> and <code>customers</code> — where not every order necessarily has a
matching customer record (maybe the customer was deleted) and not every customer necessarily has an order (maybe
they signed up but never bought anything). Which rows survive when the two tables are combined depends entirely on
which <strong>join</strong> type is used, and picking the wrong one silently drops or duplicates rows without
throwing any error — making joins one of the most consequential choices in a query.</p>
<pre><code>-- INNER JOIN: only orders that have a matching customer
SELECT o.order_id, c.customer_name
FROM orders o
INNER JOIN customers c ON o.customer_id = c.customer_id;

-- LEFT JOIN: all orders, customer columns NULL if no match
SELECT o.order_id, c.customer_name
FROM orders o
LEFT JOIN customers c ON o.customer_id = c.customer_id;

-- LEFT SEMI JOIN: only orders' columns, for orders that DO have a matching customer (no customer columns, no duplication)
SELECT o.order_id, o.order_total
FROM orders o
LEFT SEMI JOIN customers c ON o.customer_id = c.customer_id;

-- LEFT ANTI JOIN: only orders that have NO matching customer at all
SELECT o.order_id, o.order_total
FROM orders o
LEFT ANTI JOIN customers c ON o.customer_id = c.customer_id;</code></pre>
<table>
  <tr><th>Join type</th><th>Rows returned</th></tr>
  <tr><td><strong>INNER</strong></td><td>Only rows with a match on both sides</td></tr>
  <tr><td><strong>LEFT (OUTER)</strong></td><td>All left rows; unmatched right columns become NULL</td></tr>
  <tr><td><strong>RIGHT (OUTER)</strong></td><td>All right rows; unmatched left columns become NULL</td></tr>
  <tr><td><strong>FULL (OUTER)</strong></td><td>All rows from both sides; unmatched columns become NULL on
  whichever side has no match</td></tr>
  <tr><td><strong>LEFT SEMI</strong></td><td>Left rows that have at least one match — like a filter, only left
  columns returned, no duplication even with multiple right-side matches</td></tr>
  <tr><td><strong>LEFT ANTI</strong></td><td>Left rows that have no match at all on the right — the inverse of semi join</td></tr>
  <tr><td><strong>CROSS</strong></td><td>Every left row paired with every right row (Cartesian product) — no join
  condition; row count is left-count times right-count, which grows dangerously fast on non-trivial tables</td></tr>
</table>
<p>Semi and anti joins are frequently underused by analysts coming from standard SQL because they can be
approximated with <code>EXISTS</code>/<code>NOT EXISTS</code> subqueries, but Databricks SQL supports them
directly and they're commonly tested because they avoid a subtle bug: an ordinary INNER JOIN used purely as an
existence filter will silently duplicate left rows if the right table has more than one match per key, while LEFT
SEMI JOIN never does.</p>
<pre><code>-- The duplication trap: if a customer has 3 addresses, this INNER JOIN
-- returns each order THREE times, once per matching address row
SELECT o.order_id, o.order_total
FROM orders o
INNER JOIN customer_addresses a ON o.customer_id = a.customer_id;

-- LEFT SEMI JOIN used purely as an existence filter never duplicates,
-- because it isn't actually joining in any columns from the right side
SELECT o.order_id, o.order_total
FROM orders o
LEFT SEMI JOIN customer_addresses a ON o.customer_id = a.customer_id;</code></pre>

<h2>8.2 Aggregations: GROUP BY, HAVING, ROLLUP, CUBE</h2>
<p><code>GROUP BY</code> collapses rows sharing a key into one summary row per group, and <code>HAVING</code>
filters those summary rows after aggregation — the critical distinction from <code>WHERE</code>, which filters raw
rows before any grouping happens and therefore cannot reference an aggregate like <code>SUM(...)</code> directly.</p>
<pre><code>-- WHERE filters rows before grouping; HAVING filters groups after aggregating
SELECT region, SUM(order_total) AS total_sales
FROM orders
WHERE order_status = 'COMPLETED'
GROUP BY region
HAVING SUM(order_total) > 100000
ORDER BY total_sales DESC;</code></pre>
<p><code>ROLLUP</code> and <code>CUBE</code> extend <code>GROUP BY</code> to produce subtotal and grand-total rows
in a single query instead of running several separate aggregate queries and unioning them by hand.</p>
<pre><code>-- ROLLUP: hierarchical subtotals (region, then region+category, then grand total)
SELECT region, category, SUM(order_total) AS total_sales
FROM orders
GROUP BY ROLLUP(region, category);

-- CUBE: every combination of subtotals, not just the hierarchical path
SELECT region, category, SUM(order_total) AS total_sales
FROM orders
GROUP BY CUBE(region, category);

-- GROUPING SETS: hand-pick exactly which subtotal combinations to compute,
-- when neither the full hierarchy of ROLLUP nor the full cross of CUBE is wanted
SELECT region, category, SUM(order_total) AS total_sales
FROM orders
GROUP BY GROUPING SETS ((region, category), (region), ());</code></pre>
<ul>
  <li><strong>ROLLUP.</strong> Produces subtotals along a hierarchy in the order columns are listed — region
  subtotals, then region+category detail, then one grand total row (NULLs in the subtotal rows mark which
  dimension was rolled up). Column order matters: <code>ROLLUP(region, category)</code> and
  <code>ROLLUP(category, region)</code> produce different subtotal levels, not the same result reordered.</li>
  <li><strong>CUBE.</strong> Produces subtotals for every possible combination of the grouping columns, not just
  the nested hierarchy — more rows than ROLLUP, useful for pivot-style cross-tab analysis. With N grouping columns,
  CUBE produces 2^N subtotal groupings versus ROLLUP's N+1, which matters for how expensive the query gets as more
  columns are added.</li>
  <li><strong>GROUPING SETS.</strong> The general-purpose primitive underneath both — ROLLUP and CUBE are
  shorthand for particular, common GROUPING SETS patterns. Reaching for GROUPING SETS directly makes sense when
  the needed subtotal combinations don't match either shorthand exactly, e.g. wanting region-level and
  grand-total rows but skipping the region+category detail level entirely.</li>
  <li><strong>Identifying subtotal rows with GROUPING().</strong> Because subtotal rows show NULL in a rolled-up
  column, a genuine NULL value in the source data (e.g. an order with no category) becomes indistinguishable from
  a subtotal row's placeholder NULL by inspection alone. <code>GROUPING(column)</code> returns 1 for a row where
  that column was aggregated away by ROLLUP/CUBE/GROUPING SETS and 0 otherwise, letting a query tell "this is a
  subtotal" apart from "this category is genuinely unknown."</li>
</ul>
<pre><code>-- Distinguishing a real NULL category from a ROLLUP subtotal row
SELECT
  region,
  category,
  GROUPING(category) AS is_category_subtotal,
  SUM(order_total) AS total_sales
FROM orders
GROUP BY ROLLUP(region, category);</code></pre>

<h2>8.3 Window functions</h2>
<p>A regular aggregate like <code>SUM()</code> with <code>GROUP BY</code> collapses many rows into one — but
sometimes the goal is the opposite: keep every original row, while still attaching a calculation computed across a
related set of rows, like "this order's rank among all orders from the same customer" or "the running total up to
this row." Doing this in standard SQL usually requires a self-join or correlated subquery. A <strong>window
function</strong> does it directly: it computes a value across a window of rows related to the current row —
defined by <code>PARTITION BY</code> (which rows belong together) and <code>ORDER BY</code> (what order they're
considered in) inside an <code>OVER()</code> clause — without collapsing the result set.</p>

<div class="diagram">
  <svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
    <text x="10" y="18" font-size="11" font-weight="600">GROUP BY — collapses rows per group</text>
    <rect x="10" y="28" width="60" height="22"></rect><text x="40" y="43" text-anchor="middle" font-size="9">A,10</text>
    <rect x="75" y="28" width="60" height="22"></rect><text x="105" y="43" text-anchor="middle" font-size="9">A,20</text>
    <rect x="140" y="28" width="60" height="22"></rect><text x="170" y="43" text-anchor="middle" font-size="9">B,5</text>
    <line x1="10" y1="58" x2="200" y2="58" marker-end="url(#arrowD3)"></line>
    <rect x="10" y="66" width="60" height="22"></rect><text x="40" y="81" text-anchor="middle" font-size="9">A,30</text>
    <rect x="140" y="66" width="60" height="22"></rect><text x="170" y="81" text-anchor="middle" font-size="9">B,5</text>
    <text x="220" y="81" font-size="9" class="dim">2 rows out of 3 in — rows are gone</text>

    <text x="10" y="130" font-size="11" font-weight="600">Window OVER(PARTITION BY ... ORDER BY ...) — every row kept</text>
    <rect x="10" y="142" width="60" height="22"></rect><text x="40" y="157" text-anchor="middle" font-size="9">A,10</text>
    <rect x="75" y="142" width="60" height="22"></rect><text x="105" y="157" text-anchor="middle" font-size="9">A,20</text>
    <rect x="140" y="142" width="60" height="22"></rect><text x="170" y="157" text-anchor="middle" font-size="9">B,5</text>
    <line x1="10" y1="172" x2="200" y2="172" marker-end="url(#arrowD3)"></line>
    <rect x="10" y="180" width="60" height="22"></rect><text x="40" y="195" text-anchor="middle" font-size="9">10, run=10</text>
    <rect x="75" y="180" width="60" height="22"></rect><text x="105" y="195" text-anchor="middle" font-size="9">20, run=30</text>
    <rect x="140" y="180" width="60" height="22"></rect><text x="170" y="195" text-anchor="middle" font-size="9">5, run=5</text>
    <text x="220" y="195" font-size="9" class="dim">3 rows out of 3 in — same row count, running total attached</text>

    <defs>
      <marker id="arrowD3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>

    </defs>
  </svg>

<pre><code>-- Running total of sales per customer, ordered by date, row-by-row, nothing collapsed
SELECT
  customer_id,
  order_date,
  order_total,
  SUM(order_total) OVER (
    PARTITION BY customer_id
    ORDER BY order_date
    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
  ) AS running_total
FROM orders;</code></pre>
<p>Ranking functions are a window-function family purpose-built for "Nth highest/lowest per group" problems —
extremely common in analyst work (top customer per region, most recent order per account) and heavily tested.</p>
<pre><code>-- ROW_NUMBER vs RANK vs DENSE_RANK on tied values
SELECT
  customer_id,
  order_total,
  ROW_NUMBER() OVER (ORDER BY order_total DESC) AS row_num,
  RANK()       OVER (ORDER BY order_total DESC) AS rnk,
  DENSE_RANK() OVER (ORDER BY order_total DESC) AS dense_rnk
FROM orders;</code></pre>
<table>
  <tr><th>Function</th><th>Behavior on ties</th></tr>
  <tr><td><strong>ROW_NUMBER()</strong></td><td>Always unique, strictly sequential (1,2,3,4...) — ties broken
  arbitrarily by row order</td></tr>
  <tr><td><strong>RANK()</strong></td><td>Ties share the same rank; the next rank skips ahead by the number of
  tied rows (1,2,2,4...)</td></tr>
  <tr><td><strong>DENSE_RANK()</strong></td><td>Ties share the same rank; the next rank does NOT skip (1,2,2,3...)</td></tr>
  <tr><td><strong>NTILE(n)</strong></td><td>Splits the partition into n roughly equal-sized buckets and returns
  the bucket number — used for quartiles/deciles, e.g. <code>NTILE(4)</code> for quartile analysis</td></tr>
</table>
<pre><code>-- Top order per customer using ROW_NUMBER, a very common analyst pattern
SELECT * FROM (
  SELECT
    customer_id,
    order_id,
    order_total,
    ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_total DESC) AS rn
  FROM orders
)
WHERE rn = 1;

-- The same pattern with RANK instead of ROW_NUMBER returns TIES too --
-- if two orders share the exact same max total for a customer, both come back
SELECT * FROM (
  SELECT
    customer_id,
    order_id,
    order_total,
    RANK() OVER (PARTITION BY customer_id ORDER BY order_total DESC) AS rnk
  FROM orders
)
WHERE rnk = 1;</code></pre>
<p><code>LAG</code> and <code>LEAD</code> look at a *different* row relative to the current one within the same
partition — the prior or next row by the given order — enabling period-over-period comparisons without a self-join.
<code>FIRST_VALUE</code> and <code>LAST_VALUE</code> instead pin to a fixed position (the start or end of the
window/partition) rather than a relative offset from the current row.</p>
<pre><code>-- Month-over-month change per customer using LAG
SELECT
  customer_id,
  order_month,
  monthly_total,
  monthly_total - LAG(monthly_total) OVER (
    PARTITION BY customer_id ORDER BY order_month
  ) AS change_from_prior_month
FROM monthly_customer_sales;

-- FIRST_VALUE: each row also shows that customer's very first month's total for comparison
SELECT
  customer_id,
  order_month,
  monthly_total,
  FIRST_VALUE(monthly_total) OVER (
    PARTITION BY customer_id ORDER BY order_month
  ) AS first_month_total
FROM monthly_customer_sales;</code></pre>

<h2>8.4 Higher-order functions on arrays</h2>
<p>Once a column holds an array (frequently the result of parsing nested JSON, per section 7.5), row-by-row SQL
functions don't help — the need is to operate on every *element inside* the array without exploding it into
separate rows. Databricks/Spark SQL provides <strong>higher-order functions</strong> — functions that take a
lambda expression as an argument — to filter, transform, or reduce array contents in place, keeping the array
shape intact within a single row. These are Spark-SQL-specific (not standard ANSI SQL) and are consistently tested
because they're unfamiliar to analysts coming from traditional warehouses.</p>
<pre><code>-- Sample column: items = ARRAY<STRUCT<sku STRING, qty INT, price DECIMAL(10,2)>>

-- FILTER: keep only array elements matching a condition
SELECT order_id,
  FILTER(items, i -> i.qty > 1) AS multi_unit_items
FROM orders_with_items;

-- TRANSFORM: apply an expression to every element, same array length out
SELECT order_id,
  TRANSFORM(items, i -> i.qty * i.price) AS line_totals
FROM orders_with_items;

-- REDUCE: fold the array down to a single value (like a running accumulator)
SELECT order_id,
  REDUCE(
    items,
    CAST(0 AS DECIMAL(10,2)),
    (acc, i) -> acc + (i.qty * i.price)
  ) AS order_total_from_items
FROM orders_with_items;</code></pre>
<ul>
  <li><strong>FILTER(array, lambda).</strong> Returns a shorter (or equal-length) array containing only elements
  where the lambda evaluates true — array-in, array-out, no row explosion.</li>
  <li><strong>TRANSFORM(array, lambda).</strong> Applies an expression to every element and returns a new array of
  the same length — the array equivalent of mapping a function over a list.</li>
  <li><strong>REDUCE(array, start, merge_lambda, [finish_lambda]).</strong> Folds an array down to a single scalar
  by repeatedly combining an accumulator with each element, starting from an initial value — used for sums,
  concatenations, or any running computation across array elements without exploding to rows first.</li>
  <li><strong>EXISTS(array, lambda).</strong> Returns a boolean — true if any element satisfies the lambda —
  useful directly inside a <code>WHERE</code> clause to filter rows based on array contents, e.g.
  <code>WHERE EXISTS(items, i -> i.sku = 'A1')</code>.</li>
  <li><strong>Higher-order functions vs. explode, contrasted.</strong> Reaching for <code>explode</code> is correct
  when the end goal genuinely is one output row per array element (a line-items fact table). Reaching for a
  higher-order function is correct when the array should stay an array in the result — filtering, transforming, or
  summarizing its contents while the row itself still represents one order, one customer, one whatever-the-array-
  belongs-to. Exploding when a higher-order function would do multiplies row count unnecessarily and often breaks
  a later aggregation that expected one row per order.</li>
</ul>

<h2>8.5 Date and time handling</h2>
<p>Dates arrive from source systems in inconsistent shapes — sometimes a proper DATE/TIMESTAMP type, often a plain
STRING that merely looks like a date. Spark SQL provides explicit casting and a family of date-arithmetic
functions to normalize and manipulate these values, and getting the function names and argument order right (they
differ subtly from other SQL dialects) is a frequent source of exam questions.</p>
<pre><code>-- Casting a string to a proper date/timestamp
SELECT CAST('2026-03-15' AS DATE) AS order_date;
SELECT TO_DATE('03/15/2026', 'MM/dd/yyyy') AS order_date;
SELECT TO_TIMESTAMP('2026-03-15 14:30:00') AS order_ts;

-- date_trunc: snap a timestamp down to a coarser unit (start of month, week, etc.)
SELECT date_trunc('MONTH', order_ts) AS order_month FROM orders;

-- date_add / date_sub: shift a date by a number of days
SELECT date_add(order_date, 30) AS due_date FROM orders;
SELECT date_sub(order_date, 7)  AS week_before FROM orders;

-- datediff: number of days between two dates (end, start)
SELECT datediff(ship_date, order_date) AS days_to_ship FROM orders;

-- add_months: shift by whole calendar months, not a fixed day count
SELECT add_months(order_date, 1) AS one_month_later FROM orders;</code></pre>
<ul>
  <li><strong>date_trunc(unit, ts).</strong> Rounds a timestamp down to the start of the given unit (YEAR, MONTH,
  WEEK, DAY, HOUR...) — the standard way to bucket timestamps into calendar periods for grouping/aggregation.</li>
  <li><strong>date_add / date_sub.</strong> Shift a date forward or backward by a number of days; there is no
  built-in "add months" without <code>add_months()</code>, a separate function — using
  <code>date_add(order_date, 30)</code> to mean "one month later" is a common approximation error, since months
  aren't a fixed 30 days.</li>
  <li><strong>datediff(end, start).</strong> Returns whole days between two dates — argument order matters
  (end date first), and reversing it silently flips the sign rather than erroring.</li>
  <li><strong>Timezone handling.</strong> A plain <code>TIMESTAMP</code> is interpreted and displayed relative to
  the session's <code>spark.sql.session.timeZone</code> setting; the same stored value can display differently to
  users in different timezone settings, which is a common source of "why don't our numbers match" confusion between
  an analyst and a scheduled job running with a different session timezone. Casting to <code>DATE</code> drops
  time-of-day and timezone entirely, which can shift which calendar day a timestamp near midnight appears to fall on.</li>
  <li><strong>TIMESTAMP_NTZ, the timezone-naive alternative.</strong> A timestamp type that stores wall-clock time
  with no timezone attached at all, displaying identically regardless of session timezone — the right choice when
  a value genuinely represents a timezone-independent instant (e.g. "this event happened at local store-opening
  time, 9am, wherever the store is"), avoiding the display-shifts-per-viewer problem of a plain TIMESTAMP entirely.</li>
</ul>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  The most common window-function mistake is confusing <code>RANK()</code> and <code>DENSE_RANK()</code> gap
  behavior on ties — the exam frequently gives a small result set with duplicate values and asks what rank a
  specific row receives; RANK skips (1,2,2,4), DENSE_RANK doesn't (1,2,2,3). A second common trap: forgetting that
  <code>PARTITION BY</code> resets the window per group while omitting it treats the entire result set as one
  window — a query missing <code>PARTITION BY customer_id</code> when the intent was "rank within each customer"
  silently ranks across all customers globally instead, with no error to flag the mistake. A third trap specific to
  the "top N per group" pattern: filtering with <code>rn = 1</code> after <code>ROW_NUMBER()</code> always returns
  exactly one row per partition even when there's a genuine tie for first place, silently picking one arbitrarily —
  if ties should all be kept, the query needs <code>RANK()</code> instead.
</div>

<h1>9. Visualization & Dashboards</h1>

<h2>9.1 Visualization types</h2>
<p>A query result is just rows and columns — useful for verifying numbers, but hard for a human to spot a trend or
an outlier in. Attaching a <strong>visualization</strong> to a saved query renders that same result as a chart,
and picking the right chart type for the shape of the data (a single number vs. a trend over time vs. a
part-to-whole breakdown) is what makes the result actually communicate something at a glance instead of just
displaying it.</p>
<table>
  <tr><th>Visualization</th><th>Best for</th></tr>
  <tr><td><strong>Table</strong></td><td>Exact values, many columns, or when the raw rows themselves are the
  deliverable (e.g. an export-ready result)</td></tr>
  <tr><td><strong>Bar / Line / Area</strong></td><td>Comparing categories (bar) or showing a trend across an
  ordered axis like time (line/area); area emphasizes cumulative magnitude under the trend</td></tr>
  <tr><td><strong>Pie</strong></td><td>Part-to-whole composition of a single total across a small number of
  categories; degrades quickly past 5-6 slices</td></tr>
  <tr><td><strong>Counter / big number</strong></td><td>A single KPI value meant to be read instantly (e.g.
  "Total Revenue Today"), often with a comparison to a target or prior period</td></tr>
  <tr><td><strong>Pivot table</strong></td><td>Cross-tabulating two or more dimensions with aggregated measures,
  letting a viewer reorganize rows/columns interactively</td></tr>
  <tr><td><strong>Map</strong></td><td>Geographic data (region, country, lat/long) where spatial position itself
  carries meaning that a bar chart would flatten away</td></tr>
  <tr><td><strong>Scatter / Combo</strong></td><td>Scatter shows the relationship between two numeric measures
  (correlation, clustering, outliers); combo overlays two chart types (e.g. bars for volume, a line for a rate) on
  shared or dual axes when one chart type alone can't show both series meaningfully</td></tr>
</table>
<pre><code>-- A query naturally suited to a line chart (trend over time)
SELECT date_trunc('DAY', order_ts) AS day, SUM(order_total) AS daily_sales
FROM main.sales.orders
GROUP BY date_trunc('DAY', order_ts)
ORDER BY day;

-- A query naturally suited to a pivot table (two dimensions, one measure)
SELECT region, product_category, SUM(order_total) AS total_sales
FROM main.sales.orders
GROUP BY region, product_category;</code></pre>
<p>Choosing badly is a real failure mode, not just an aesthetic one: a pie chart with fourteen slices communicates
nothing because the eye can't compare that many wedge angles at once, and a bar chart used for a trend over 90 days
of daily data becomes an unreadable wall of bars where a line would show the trend instantly. The right default
when unsure is usually the simplest chart that preserves the comparison the viewer actually needs to make —
category-to-category favors bar, trend-over-time favors line, single-value-right-now favors counter.</p>

<h2>9.2 Building a dashboard from saved queries</h2>
<p>A dashboard is not written from scratch as one unit — it's assembled from pieces that already exist
independently. Each saved query in the SQL editor (section 6.2) can have one or more visualizations attached to
it, and those visualizations are added as tiles onto a dashboard canvas, which can be freely arranged and resized.
Because a dashboard tile is a reference to a query's visualization rather than a copy of its data, editing the
underlying query updates every dashboard that tile appears on.</p>

<div class="diagram">

    <text x="75" y="108" text-anchor="middle" font-size="11" font-weight="600">Saved query</text>

<ul>
  <li><strong>Query reuse.</strong> The same saved query (and even the same visualization) can be added to
  multiple dashboards, so a canonical "daily revenue" query only needs to be written and maintained once.</li>
  <li><strong>Layout.</strong> Tiles can be resized and repositioned on a grid; text/markdown tiles can be added
  alongside chart tiles to add narrative context, section headers, or instructions for viewers.</li>
  <li><strong>Legacy vs. new dashboards.</strong> Newer Databricks workspaces present an updated dashboard
  authoring experience (sometimes called Lakeview dashboards) alongside the classic SQL dashboard; both are built
  from the same underlying queries and warehouses, but exam material generally treats the query-to-visualization-to-
  dashboard flow as the core concept regardless of which authoring UI is shown.</li>
  <li><strong>One query, many visualizations.</strong> A single saved query's result set can back several
  different visualizations simultaneously — the same daily-sales-by-region query might drive a line chart on one
  dashboard and a pivot table on another, since the visualization is a rendering choice layered on top of a shared
  result, not a property of the query itself.</li>
  <li><strong>Sharing and permissions.</strong> A dashboard has its own permission set (view/edit/manage) that can
  differ from the permissions on the underlying saved queries — a viewer can be granted access to see a dashboard's
  rendered tiles without being granted access to edit, or even see the SQL of, the queries behind them.</li>
</ul>

<h2>9.3 Refresh schedules</h2>
<p>A dashboard built from queries is only as current as the last time those queries ran. Rather than manually
re-running every query before every viewing, a dashboard (or its individual queries) can be put on a
<strong>refresh schedule</strong> — an interval at which Databricks automatically re-executes the underlying
queries and updates the tiles, so viewers always see data no older than the configured interval without doing
anything themselves.</p>
<ul>
  <li><strong>Dashboard-level schedule.</strong> Sets one refresh cadence (e.g. every hour, every day at a
  specific time) applied to all queries feeding the dashboard.</li>
  <li><strong>Query-level schedule.</strong> An individual saved query can carry its own refresh schedule
  independent of any dashboard, which matters when the same query feeds both a dashboard and a downstream alert
  that needs to evaluate on its own cadence.</li>
  <li><strong>Warehouse cost interaction.</strong> Every scheduled refresh consumes SQL warehouse compute, so an
  aggressively short refresh interval on an expensive query directly drives up warehouse spend — schedule interval
  should match how often the underlying data actually changes, not just how often someone might look.</li>
  <li><strong>On-demand refresh.</strong> A viewer with appropriate permissions can trigger a manual refresh
  outside the schedule when they need the absolute latest data immediately (e.g. right before a meeting), without
  changing the underlying schedule itself for every other viewer.</li>
  <li><strong>Stale-data indicators.</strong> Dashboards typically surface when a tile's data was last refreshed,
  so a viewer can tell whether they're looking at data from the last scheduled run or something older due to a
  failed refresh — silently trusting a dashboard timestamp without checking it is how stale numbers get reported
  as current in a meeting.</li>
</ul>

<h2>9.4 Parameterized queries and dashboard filters</h2>
<p>A dashboard built for one region or one date range is far less useful than one a viewer can adjust themselves.
A query can declare a <strong>parameter</strong> — a named placeholder substituted into the SQL at run time —
and when that query is added to a dashboard, the parameter can be exposed as a <strong>filter widget</strong>
(a dropdown, date picker, or text box) that viewers interact with directly on the dashboard, re-running the
underlying queries with the chosen value without anyone editing SQL.</p>
<pre><code>-- A query with a parameter (written as {{ param_name }} in the SQL editor)
SELECT region, SUM(order_total) AS total_sales
FROM main.sales.orders
WHERE region = {{ region_filter }}
  AND order_date BETWEEN {{ start_date }} AND {{ end_date }}
GROUP BY region;

-- A parameter can also carry a query-based dropdown, populated from a SELECT
-- rather than a static list, so new regions appear automatically as they show up in the data
-- (configured via the parameter's "Query Based Dropdown List" source, not inline SQL)</code></pre>
<ul>
  <li><strong>Query parameter.</strong> Defined once in the SQL editor with a default value and a type (text,
  number, date, dropdown of distinct values); referenced in the SQL text with double-curly-brace syntax.</li>
  <li><strong>Dashboard filter widget.</strong> When a parameterized query is placed on a dashboard, its parameter
  can be mapped to a shared dashboard-level filter, letting one filter control multiple tiles/queries at once
  instead of each tile having its own independent control.</li>
  <li><strong>Linked parameters.</strong> Multiple queries on the same dashboard can share a single filter widget
  if their parameter names are linked, so changing one date-range control updates every chart on the page
  simultaneously rather than requiring the viewer to set the same filter repeatedly.</li>
  <li><strong>Parameter data type mismatches.</strong> A parameter typed as TEXT that's substituted into a numeric
  or date comparison can produce a type-mismatch query error or, worse, a query that silently runs but returns an
  empty or wrong result if the comparison coerces unexpectedly — matching the parameter's declared type to how it's
  actually used in the WHERE clause avoids this class of bug.</li>
</ul>

<h2>9.5 Alerts on dashboards</h2>
<p>Alerts (introduced in section 6.6 as attached to a single saved query) extend naturally into the dashboard
context: since dashboard tiles are backed by the same saved queries an alert can watch, a KPI tile on a dashboard
and the alert monitoring it are two views of the same underlying scheduled query. Refreshing a dashboard does not,
by itself, trigger an alert evaluation — the alert follows its own query's schedule, so a dashboard set to refresh
every 15 minutes and an alert on one of its queries set to check hourly can show updated numbers on-screen well
before the alert re-evaluates and potentially fires.</p>
<ul>
  <li><strong>Independent schedules.</strong> A dashboard's visual refresh and an alert's evaluation schedule are
  configured separately even when they draw on the same query, which can create a lag between what a viewer sees
  on the dashboard and when a threshold breach actually gets flagged.</li>
  <li><strong>Subscriptions.</strong> Users can subscribe to a dashboard to receive its rendered state (e.g. as a
  periodic email snapshot) on a schedule, which is a notification mechanism distinct from an alert — a subscription
  just delivers the dashboard's current look, it does not evaluate any condition.</li>
</ul>

<h2>9.6 Choosing between Databricks SQL dashboards and external BI tools</h2>
<p>Databricks SQL dashboards aren't the only way to visualize lakehouse data — SQL warehouses expose a standard
JDBC/ODBC endpoint that tools like Tableau, Power BI, and Looker connect to directly, querying the same Unity
Catalog tables without any data export or replication step. Deciding between a native dashboard and an external BI
tool is a real, frequently tested trade-off rather than a purely stylistic preference.</p>
<table>
  <tr><th></th><th>Databricks SQL dashboard</th><th>External BI tool (Tableau/Power BI/etc.)</th></tr>
  <tr><td>Setup</td><td>Built directly from saved queries already in the workspace, no separate connection config</td>
  <td>Requires a JDBC/ODBC connection to a SQL warehouse, configured once per tool/user</td></tr>
  <tr><td>Governance</td><td>Inherits Unity Catalog permissions natively, no extra layer</td>
  <td>Also inherits Unity Catalog permissions through the same warehouse connection, but the external tool may
  cache or export data outside Databricks' governance boundary if not configured carefully</td></tr>
  <tr><td>Feature depth</td><td>Sufficient for straightforward BI: charts, filters, schedules, alerts</td>
  <td>Typically deeper visual/formatting customization, broader chart libraries, self-service features built for
  large non-technical business audiences</td></tr>
  <tr><td>Cost</td><td>Only SQL warehouse compute; no separate BI tool license</td>
  <td>SQL warehouse compute plus a separate BI tool license/subscription</td></tr>
</table>
<p>A common exam framing is a scenario where an organization already has an enterprise BI tool with existing
dashboards, reports, and business-user familiarity — the correct move is usually to point that tool's connection at
a Databricks SQL warehouse rather than migrate everyone to native dashboards, since the lakehouse's role is to be
the governed data source both paths query against, not to force a single visualization front end.</p>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  A frequently tested distinction: a dashboard <strong>subscription</strong> (delivers a snapshot of the dashboard
  on a schedule, unconditionally) is not the same mechanism as an <strong>alert</strong> (evaluates a threshold
  condition on a query and only notifies when it triggers). A scenario asking "how do I get notified only when
  revenue drops below a target" needs an alert on the underlying query, not a dashboard subscription, which would
  just email the dashboard's current state regardless of whether anything is actually wrong. A second common trap:
  assuming a dashboard's on-screen refresh timestamp guarantees an attached alert has also just re-evaluated — the
  two run on independent schedules even when built from the same query.
</div>

<h1>10. Analytics Applications & Data Literacy</h1>

<h2>10.1 Databricks Assistant</h2>
<p>Picture an analyst staring at an unfamiliar table with forty columns and no documentation, trying to write a
query that joins it correctly and handles nulls the way the business expects — normally this means reading
schemas, guessing column meanings, and iterating on syntax errors by hand. Databricks embeds an AI pair-programmer
directly into the notebook and SQL editor surfaces to shortcut this: the <strong>Databricks Assistant</strong> can
generate SQL or code from a natural-language description, explain what a selected block of existing code does,
suggest fixes for an error message, and answer questions about the schema of tables in scope — all without leaving
the editor pane.</p>
<ul>
  <li><strong>Code generation.</strong> Given a plain-language request (e.g. "show me monthly revenue by region
  for 2026"), the Assistant drafts SQL against tables it has schema visibility into, which the analyst then reviews
  and runs rather than executing blindly.</li>
  <li><strong>Explain / debug.</strong> Given an existing query or an error message, the Assistant can explain
  what the code does in plain language or suggest a likely fix, useful when inheriting someone else's unfamiliar query.</li>
  <li><strong>Context awareness.</strong> Suggestions are grounded in the schema of tables the current user has
  access to (via Unity Catalog), so generated column references are more likely to be real columns rather than
  hallucinated guesses — though results should still be verified, not trusted blindly.</li>
  <li><strong>Comment-to-code and inline completion.</strong> Beyond a chat-style request, the Assistant also
  offers inline autocomplete as SQL or Python is typed, and can generate a query body directly from a SQL comment
  describing the intent above an empty statement — useful for boilerplate (a standard join skeleton, a common
  date-bucketing pattern) that doesn't need a full conversational exchange to produce.</li>
  <li><strong>What it does not do.</strong> The Assistant does not bypass Unity Catalog permissions — it only sees
  and reasons about schema for objects the requesting user already has access to, and it does not silently execute
  generated code; a human still reviews and runs it. Treating Assistant output as automatically correct, especially
  on aggregation logic or join cardinality, is a real failure mode distinct from the tool itself being unreliable.</li>
</ul>
<pre><code>-- A query an analyst might have drafted with Assistant help from a
-- natural-language prompt like "top 5 regions by total order value in 2026"
SELECT region, SUM(order_total) AS total_value
FROM main.sales.orders
WHERE order_date >= DATE'2026-01-01'
GROUP BY region
ORDER BY total_value DESC
LIMIT 5;</code></pre>

<h2>10.2 Genie</h2>
<p>The Assistant still expects the user to work in SQL. A business stakeholder who doesn't write SQL at all —
someone in finance or marketing who just wants an answer — needs something further removed from code entirely.
<strong>Genie</strong> is a natural-language question-and-answer interface built on top of a specific, governed set
of tables: a data or analytics team curates a "Genie space" pointing at particular tables (with sample questions
and business context to guide interpretation), and end users then type plain questions like "what were our top 3
products last quarter" and receive an answer, generated by translating the question into a query behind the
scenes and running it through Unity Catalog with the asking user's own permissions applied.</p>
<ul>
  <li><strong>Curated scope.</strong> A Genie space is deliberately scoped to specific tables chosen by a data
  team, not the entire metastore, keeping answers grounded in vetted, well-understood data rather than an
  unbounded and potentially misleading surface.</li>
  <li><strong>Governance-respecting.</strong> Because Genie executes through the querying user's own identity and
  permissions, row/column-level security and table grants (section 10.4) still apply — a user with restricted
  access sees the same restricted results through Genie as they would writing SQL directly.</li>
  <li><strong>Business-user audience.</strong> Genie's target user is explicitly someone who does not write SQL;
  it is a complement to, not a replacement for, the SQL editor and Assistant, which remain the tools for analysts
  building and validating the underlying logic.</li>
  <li><strong>Curation inputs that improve accuracy.</strong> A Genie space owner can attach sample questions and
  their correct corresponding SQL, plus plain-language notes about ambiguous business terms (e.g. defining exactly
  what "active customer" means for this dataset) — this curation is what keeps Genie's generated queries aligned
  with how the business actually defines its metrics, rather than guessing from column names alone.</li>
  <li><strong>Assistant vs. Genie, contrasted directly.</strong> Both translate intent into SQL using an LLM, but
  Assistant is a coding aid living inside the SQL editor/notebook for people who already write and review SQL,
  while Genie is a standalone conversational surface for people who never see or touch the generated SQL at all —
  the audience and the amount of curation/governance wrapped around the tables in scope is the real distinction,
  not the underlying translation capability.</li>
</ul>

<h2>10.3 Descriptive statistics and data types</h2>
<p>Two data teams can report wildly different "typical" values for the same dataset depending purely on which
summary statistic they picked — one says the typical order is $500, another says $80 — without either being wrong.
This happens because <strong>mean</strong> (the arithmetic average) and <strong>median</strong> (the middle value
when sorted) respond very differently to extreme values: a handful of enormous enterprise orders pulls the mean up
sharply while barely moving the median, since the median only cares about position, not magnitude. A dataset with
such extreme values is called <strong>skewed</strong>, and in a right-skewed distribution (a long tail of large
values, like household income or order size) the mean sits above the median; in a left-skewed distribution it sits below.</p>
<pre><code>-- Comparing mean and median side by side often reveals skew immediately
SELECT
  AVG(order_total) AS mean_order,
  percentile_approx(order_total, 0.5) AS median_order,
  percentile_approx(order_total, 0.25) AS p25,
  percentile_approx(order_total, 0.75) AS p75,
  STDDEV(order_total) AS stddev_order
FROM main.sales.orders;</code></pre>
<ul>
  <li><strong>Mean vs. median under skew.</strong> When mean and median diverge substantially, that gap itself is
  diagnostic of skew and outliers — an analyst reporting only the mean on a skewed metric (like income or deal
  size) can mislead an audience into thinking the "typical" case is much higher than it actually is.</li>
  <li><strong>Standard deviation and spread.</strong> Mean and median describe a single "center," but two datasets
  can share the same mean while looking completely different in practice — one tightly clustered, one wildly
  variable. <strong>Standard deviation</strong> quantifies that spread: a low value means most orders sit close to
  the mean, a high value means order size varies widely even if the average looks stable, which matters for
  anything downstream that assumes consistency (like inventory planning against an "average" order).</li>
  <li><strong>Percentiles and quartiles.</strong> <code>percentile_approx</code> generalizes the median to any
  cut point — the 90th percentile order value answers "what's the threshold that only the top 10% of orders
  exceed," a more robust way to describe the "large end" of a distribution than the raw maximum, which can be a
  single extreme outlier.</li>
  <li><strong>Discrete vs. continuous data.</strong> Discrete data takes distinct, countable values (number of
  orders, number of items in a cart — no meaningful value between 2 and 3); continuous data can take any value
  within a range (order total, temperature, elapsed time). The distinction matters for which aggregations and
  chart types are appropriate — a bar chart suits discrete categories, a histogram or line better suits continuous
  measures.</li>
  <li><strong>Nominal vs. ordinal categorical data.</strong> Not all non-numeric data is equivalent: nominal
  categories have no inherent order (region names, product SKUs — "East" isn't greater or less than "West"), while
  ordinal categories do (a satisfaction rating of Low/Medium/High, a tier of Bronze/Silver/Gold). Sorting or
  averaging nominal data numerically is meaningless; ordinal data can sometimes be reasonably encoded as numbers
  for aggregation, but only because the order itself carries real information.</li>
</ul>

<div class="diagram">
  <svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
    <rect x="270" y="10" width="100" height="30" rx="5"></rect>
    <text x="320" y="30" text-anchor="middle" font-size="10" font-weight="600">Year</text>

    <line x1="320" y1="40" x2="150" y2="65" marker-end="url(#arrowDR)"></line>

    <text x="480" y="140" font-size="10" class="dim">roll-up direction: Day to Year, coarser each step up</text>

    <defs>
      <marker id="arrowDR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
