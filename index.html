<h1>1. Spark Foundations</h1>
<p>Databricks is a company and a product; underneath almost everything it does is <strong>Apache Spark</strong>, the
distributed processing engine. Every notebook, SQL warehouse, job, and Delta Live Table pipeline in later sections
ultimately compiles down to Spark work. Understanding Spark first — why it exists, how it schedules work, how it
splits data across a cluster, and why its APIs look the way they do — makes every later Databricks-specific concept
(clusters, Photon, DataFrames, Structured Streaming) a straightforward instance of an idea already understood,
rather than a new thing to memorize.</p>

<h2>1.1 Why Spark exists: the MapReduce problem</h2>
<p>Picture a data scientist in 2009 trying to run the same machine-learning training loop 50 times over a 500GB
dataset spread across a cluster of machines, using Hadoop MapReduce — the dominant big-data engine at the time.
MapReduce processes data in a rigid two-stage pipeline (map, then reduce), and after each job finishes, it writes
its entire result back to disk (HDFS) before the next job can start. Fifty iterations means fifty full round-trips
to disk, even though the underlying dataset never changes — the cluster spends more time serializing data to disk
and reading it back than doing actual computation. MapReduce was built for large, one-pass batch jobs (like "count
every word in a web crawl") and is genuinely inefficient for anything that touches the same data repeatedly:
iterative algorithms (most machine learning, graph algorithms like PageRank) and interactive, exploratory queries
(a human running query after query against data that should just stay loaded in memory).</p>
<p>In 2009, Matei Zaharia and researchers at UC Berkeley's AMPLab built <strong>Apache Spark</strong> to fix exactly
this: keep data cached in distributed memory across a cluster between operations instead of forcing a disk round-trip
after every step. Spark was open-sourced in 2010, donated to the Apache Software Foundation in 2013, and became a
top-level Apache project in 2014 — the same year it set a world record sorting 100TB of data roughly three times
faster than the best MapReduce result on similar hardware, using a fraction of the machines. That performance gap
— often cited as "10-100x faster" for iterative workloads — is what drove its rapid adoption across the industry and
is why nearly every modern lakehouse and big-data platform, Databricks included, is built on it rather than on
MapReduce directly. Databricks itself was founded in 2013 by the original creators of Spark, specifically to offer
Spark as a managed cloud platform instead of something every company had to hand-configure and operate itself.</p>

<h2>1.2 Cluster architecture: driver, executors, cluster manager</h2>
<p>Running code on a single laptop is simple: one process, one memory space, done. Running the same logical
computation across 50 machines requires something to divide the work, hand pieces to each machine, and collect the
results back — Spark's <strong>cluster architecture</strong> is that coordination layer, and it's the same three-role
structure whether the cluster is 2 nodes or 2,000.</p>
<table>
  <tr><th>Role</th><th>Responsibility</th></tr>
  <tr><td><strong>Driver</strong></td><td>The process running the user's main program. It builds the logical plan
  of what needs to happen (from the code written), splits that plan into tasks, and schedules those tasks onto
  executors. It also collects final results back (e.g., for a <code>.collect()</code> or <code>.show()</code>).
  There is exactly one driver per Spark application, and on Databricks it runs on the cluster's driver node.</td></tr>
  <tr><td><strong>Executors</strong></td><td>Worker processes, one or more per worker node, that actually run the
  tasks the driver assigns them, hold cached data in memory, and report status/results back to the driver. Each
  executor runs many tasks in parallel using multiple threads/cores.</td></tr>
  <tr><td><strong>Cluster manager</strong></td><td>The system that allocates physical machines/containers to a
  Spark application in the first place and negotiates resources — examples include Spark's own Standalone manager,
  YARN, Kubernetes, or (on Databricks) the Databricks-managed cluster manager tied into the cloud provider.</td></tr>
</table>

<h2>1.3 Partitions: how data is actually split across the cluster</h2>
<p>Executors running "in parallel" only helps if there's something to split up — if all 500GB of a dataset sat in
one indivisible chunk, only one executor could ever touch it at a time no matter how many machines are in the
cluster. Spark solves this by physically dividing a dataset into <strong>partitions</strong>: smaller chunks of
data, each of which can be processed by a different executor core independently and in parallel. A DataFrame with
200 partitions spread across a cluster with 20 available cores can have 20 partitions being worked on
simultaneously; how many partitions exist, and how evenly sized they are, directly controls how much real
parallelism a job gets.</p>
<pre><code># Check how many partitions a DataFrame currently has
df.rdd.getNumPartitions()

# Explicitly repartition for more/less parallelism (triggers a shuffle)
df_repartitioned = df.repartition(200)

# Shrink partition count cheaply without a full shuffle (only reduces)
df_coalesced = df.coalesce(10)</code></pre>
<ul>
  <li><strong>Skew is the practical enemy of partitioning.</strong> If one partition holds far more rows than the
  others (e.g., partitioning by <code>country</code> when 90% of rows are "USA"), the executor handling that
  oversized partition becomes a bottleneck the whole job waits on — every other executor finishes and sits idle
  while one straggler catches up. This is one of the most common real-world causes of a Spark job being slow.</li>
  <li><strong>The shuffle.</strong> Some operations — <code>groupBy</code>, <code>join</code>, <code>repartition</code>,
  <code>orderBy</code> — require rows with the same key to end up on the same partition/executor, which means
  physically moving data across the network between executors. This <strong>shuffle</strong> is one of the most
  expensive things Spark does (network I/O plus disk spill), and a large share of Spark performance tuning is
  really about minimizing unnecessary shuffles.</li>
  <li><strong><code>repartition()</code> vs. <code>coalesce()</code>.</strong> <code>repartition(n)</code> can
  increase or decrease partition count and always triggers a full shuffle to rebalance data evenly.
  <code>coalesce(n)</code> can only decrease partition count, and does so by merging existing partitions on the
  same executors where possible, avoiding a full shuffle — cheaper, but can leave partitions unevenly sized.</li>
</ul>

<h2>1.4 RDDs, DataFrames, and the API evolution</h2>
<p>Spark's original API, the <strong>RDD</strong> (Resilient Distributed Dataset), is a low-level, immutable,
distributed collection of arbitrary Java/Python/Scala objects, processed with functional operations like
<code>map</code> and <code>filter</code>. RDDs are flexible — they can hold anything, including unstructured data —
but that flexibility is also the problem: Spark's engine has no idea what's inside an RDD's objects, so it can't
reason about the data's structure or apply any query optimization; every operation runs exactly as literally
written, whether or not that's the fastest way to do it. Starting in Spark 1.3 (2015), Spark introduced the
<strong>DataFrame</strong> API — a distributed collection of data organized into named, typed columns, conceptually
similar to a pandas DataFrame or a SQL table — specifically so the engine could understand the data's schema and
optimize accordingly. Nearly all modern Spark code (and 100% of Databricks SQL) works through DataFrames, not raw
RDDs; RDDs still exist underneath as the low-level execution primitive, but are rarely written by hand today.</p>
<pre><code># The same operation, RDD-style vs DataFrame-style
# RDD: engine has no idea what "fields" mean, no optimization possible
rdd = sc.textFile("orders.csv")
result = (rdd.map(lambda line: line.split(","))
             .filter(lambda fields: float(fields[2]) > 100)
             .map(lambda fields: (fields[0], float(fields[2]))))

# DataFrame: engine knows the schema and can optimize the whole plan
df = spark.read.option("header", True).csv("orders.csv")
result = df.filter(df.amount > 100).select("customer_id", "amount")</code></pre>
<ul>
  <li><strong>Catalyst optimizer.</strong> Because a DataFrame operation is declarative (it describes *what* result
  is wanted, not the literal steps to get it), Spark's Catalyst optimizer can rewrite the query plan before running
  it — reordering filters to run as early as possible, eliminating unused columns, choosing an efficient join
  strategy — the same category of optimization a relational database's query planner does, applied uniformly to
  SQL, DataFrame, and Dataset code.</li>
  <li><strong>Tungsten execution engine.</strong> Below Catalyst's logical optimization, Tungsten handles the
  physical execution details — packing data into a compact binary in-memory format instead of full Java objects,
  and generating specialized bytecode for a given query instead of using generic interpreted operators — both aimed
  at reducing memory overhead and CPU cycles spent on bookkeeping rather than actual computation.</li>
</ul>

<h2>1.5 The PySpark DataFrame API in practice</h2>
<p>PySpark is Spark's Python API, and its DataFrame methods are what almost all Databricks notebook code is
actually written in day to day — the same operations SQL expresses with clauses, PySpark expresses as chained
method calls on a DataFrame object. Fluency in this exact syntax matters because it's tested directly and because
every later section's Python code examples assume it.</p>
<pre><code>from pyspark.sql.functions import col, sum as _sum, avg, count, when, upper

df = spark.table("prod.sales.orders")

# SELECT columns, optionally renaming
df.select("customer_id", "amount").show()
df.select(col("amount").alias("order_amount")).show()

# WHERE-equivalent filtering — .filter() and .where() are identical, pick one style
df.filter(col("amount") > 100).show()
df.where((col("amount") > 100) & (col("status") == "completed")).show()

# Adding/replacing a column
df = df.withColumn("amount_usd", col("amount") * 1.0)
df = df.withColumn("tier", when(col("amount") > 1000, "gold").otherwise("standard"))

# Renaming and dropping columns
df = df.withColumnRenamed("amount", "order_amount")
df = df.drop("legacy_flag")

# GROUP BY + aggregate
(df.groupBy("customer_id")
   .agg(_sum("order_amount").alias("total_spent"),
        count("*").alias("num_orders"))
   .show())

# ORDER BY
df.orderBy(col("order_amount").desc()).show()

# JOIN — same four join types as SQL, passed as a string
orders = spark.table("prod.sales.orders")
customers = spark.table("prod.sales.customers")
(orders.join(customers, orders.customer_id == customers.id, "inner")
       .select(orders.order_id, customers.name))

# Deduplicating and sampling
df.dropDuplicates(["customer_id"])
df.sample(fraction=0.1, seed=42)</code></pre>
<table>
  <tr><th>SQL clause</th><th>PySpark DataFrame method</th></tr>
  <tr><td><code>SELECT col1, col2</code></td><td><code>df.select("col1", "col2")</code></td></tr>
  <tr><td><code>WHERE cond</code></td><td><code>df.filter(cond)</code> / <code>df.where(cond)</code></td></tr>
  <tr><td><code>GROUP BY ... aggregate</code></td><td><code>df.groupBy(...).agg(...)</code></td></tr>
  <tr><td><code>ORDER BY</code></td><td><code>df.orderBy(...)</code> / <code>df.sort(...)</code></td></tr>
  <tr><td><code>JOIN ... ON</code></td><td><code>df1.join(df2, condition, "how")</code></td></tr>
  <tr><td><code>DISTINCT</code></td><td><code>df.distinct()</code></td></tr>
  <tr><td>Computed column</td><td><code>df.withColumn("name", expr)</code></td></tr>
</table>
<ul>
  <li><strong>Column references, three equivalent ways.</strong> <code>df.price</code>, <code>df["price"]</code>,
  and <code>col("price")</code> all refer to the same column. <code>col("price")</code> is the safest inside
  chained expressions or functions because it doesn't require a specific DataFrame variable to be in scope at that
  point in the code.</li>
  <li><strong>Mixing SQL and DataFrames freely.</strong> <code>spark.sql("SELECT * FROM products")</code> returns a
  DataFrame, and any DataFrame can be registered as a temporary view with
  <code>df.createOrReplaceTempView("my_view")</code> to query it with SQL afterward — both APIs compile down to the
  same Catalyst logical plan, so there's no performance difference between writing a transformation in SQL versus
  the equivalent DataFrame chain.</li>
</ul>

<h2>1.6 Transformations, actions, and lazy evaluation</h2>
<p>When code calls <code>df.filter(...)</code> or <code>df.select(...)</code>, Spark does not actually filter or
select anything yet — it just records that step as an addition to a logical plan and returns immediately. Spark
operations split into two categories, and knowing which is which explains a lot of otherwise-confusing Spark
behavior (like why a typo in a filter condition doesn't error out until several lines later).</p>
<table>
  <tr><th>Type</th><th>Behavior</th><th>Examples</th></tr>
  <tr><td><strong>Transformation</strong></td><td>Lazily builds up the logical plan; returns a new DataFrame
  immediately without touching data</td><td><code>select</code>, <code>filter</code>, <code>groupBy</code>,
  <code>join</code>, <code>withColumn</code></td></tr>
  <tr><td><strong>Action</strong></td><td>Triggers the accumulated plan to actually execute across the cluster and
  produces a concrete result</td><td><code>count()</code>, <code>collect()</code>, <code>show()</code>,
  <code>write.saveAsTable()</code></td></tr>
</table>
<pre><code># Nothing runs yet — just builds a plan
filtered = df.filter(df.amount > 100)
selected = filtered.select("customer_id", "amount")
grouped = selected.groupBy("customer_id").sum("amount")

# THIS is what actually triggers execution across the cluster
grouped.show()</code></pre>
<p>This <strong>lazy evaluation</strong> exists so Catalyst can see the *entire* chain of transformations before
running anything and optimize the whole plan at once — e.g., pushing the <code>filter</code> down to run before the
<code>select</code> even if written in the other order, or skipping columns never referenced downstream — rather
than optimizing each line in isolation. It also means an error inside a transformation (like referencing a
nonexistent column) often only surfaces once an action finally runs, which surprises newcomers debugging code that
"ran fine" up to that point.</p>

<h2>1.7 From code to cluster: jobs, stages, and tasks</h2>
<p>When an action finally runs, Spark doesn't execute the code exactly as written — it converts the accumulated
logical plan into a physical execution plan made of three nested units, and understanding this breakdown is what
makes the Spark UI (used constantly for debugging slow jobs) legible instead of a wall of unfamiliar numbers.</p>
<div class="diagram">
  <svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="55" width="130" height="40" rx="6"></rect>
    <text x="75" y="79" text-anchor="middle" font-size="12" font-weight="600">Job</text>

    <path class="connector" d="M140 75 L228 75" marker-end="url(#arrowJ1)"></path>

    <rect x="230" y="30" width="130" height="34" rx="6"></rect>
    <text x="295" y="51" text-anchor="middle" font-size="11" font-weight="600">Stage 1</text>
    <rect x="230" y="90" width="130" height="34" rx="6"></rect>
    <text x="295" y="111" text-anchor="middle" font-size="11" font-weight="600">Stage 2</text>
    <text x="295" y="20" text-anchor="middle" font-size="9" class="dim">split at shuffle boundaries</text>

    <path class="connector" d="M360 47 L448 47" marker-end="url(#arrowJ1)"></path>
    <path class="connector" d="M360 107 L448 107" marker-end="url(#arrowJ1)"></path>

    <rect x="450" y="10" width="130" height="24" rx="4"></rect>
    <text x="515" y="26" text-anchor="middle" font-size="9">Task (1 per partition)</text>
    <rect x="450" y="38" width="130" height="24" rx="4"></rect>
    <text x="515" y="54" text-anchor="middle" font-size="9">Task (1 per partition)</text>
    <rect x="450" y="90" width="130" height="24" rx="4"></rect>
    <text x="515" y="106" text-anchor="middle" font-size="9">Task (1 per partition)</text>

    <defs>
      <marker id="arrowJ1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">One action triggers one job; a job splits into stages at shuffle boundaries; each stage splits into one task per partition.</div>
</div>
<ul>
  <li><strong>Job.</strong> Triggered by exactly one action — calling <code>.count()</code> once creates one job.
  Calling two actions on the same DataFrame chain creates two separate jobs (and, without caching, re-executes the
  upstream transformations twice).</li>
  <li><strong>Stage.</strong> A job is split into stages at every point a shuffle is required — everything that can
  run without moving data between executors stays in one stage; a <code>groupBy</code> or <code>join</code>
  introduces a new stage boundary because it needs data physically repartitioned first.</li>
  <li><strong>Task.</strong> The smallest unit of work — one stage runs as many tasks as there are partitions, and
  each task is what an individual executor core actually executes, on its own partition's data, in parallel with
  every other task in that stage.</li>
</ul>

<h2>1.8 Caching and persistence</h2>
<p>Because DataFrames are recomputed from scratch every time a new action triggers their upstream chain, an
expensive transformation (a large join, a costly aggregation) referenced by multiple later actions gets redone in
full each time — wasteful when the underlying data hasn't changed. <code>.cache()</code> tells Spark to keep a
DataFrame's computed partitions in executor memory (or spilled to disk if memory runs out) after the first action
that materializes it, so every subsequent action reuses that stored result instead of recomputing it.</p>
<pre><code>expensive_df = (spark.table("orders")
                .join(spark.table("customers"), "customer_id")
                .groupBy("region")
                .agg(_sum("amount").alias("total")))

expensive_df.cache()      # marks it for caching — nothing happens yet, still lazy
expensive_df.count()      # FIRST action: computes AND populates the cache
expensive_df.show()       # SECOND action: reuses the cached result, no recompute

expensive_df.unpersist()  # release the cached memory when done with it</code></pre>
<p><code>.cache()</code> itself is a transformation-like call — it doesn't force computation on its own; the
DataFrame is only actually cached once the next action runs. Caching is worth it specifically when a DataFrame is
reused by multiple actions or repeatedly queried in later cells — caching something only ever used once adds
overhead for no benefit, and caching too many large DataFrames at once can exhaust cluster memory and force spills
to disk, which slows things down instead of helping.</p>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam and real-world confusion both come from the same place: assuming a transformation like <code>filter</code>
  did work immediately. Calling ten transformations in a row costs nothing and executes nothing — the cluster stays
  idle until an action appears. This also explains why calling <code>.count()</code> twice on the same
  unmodified/uncached DataFrame re-runs the entire upstream computation twice (Spark doesn't remember the result
  unless the DataFrame was explicitly <code>.cache()</code>'d), and why the RDD API is now considered a low-level
  fallback rather than the default: DataFrames aren't just a nicer syntax over RDDs, they unlock optimizations
  (Catalyst, Tungsten) that hand-written RDD code doesn't get. Separately, don't confuse a <strong>stage</strong>
  boundary with a <strong>job</strong> boundary on the exam: a single job routinely contains multiple stages (one
  per shuffle), and a single action always maps to exactly one job, never more.
</div>

<h1>2. Lakehouse Concept & Architecture</h1>

<h2>2.1 Why the lakehouse exists</h2>
<p>Picture a company with two separate systems: a <strong>data warehouse</strong> holding clean, structured sales
tables that finance queries every morning, and a <strong>data lake</strong> holding raw clickstream logs, images,
and JSON events that data scientists dump in for later. The warehouse is fast and reliable for SQL but expensive
and rigid — every new data type needs a schema designed up front. The lake is cheap and flexible — store anything,
in any format — but it has no transaction guarantees, no schema enforcement, and querying it with SQL is slow and
often unreliable because files can be partially written or inconsistent. Teams end up running both, paying twice,
and syncing data between them with fragile ETL jobs. This is the problem the <strong>lakehouse</strong> architecture
solves: one system, built directly on cheap cloud object storage (like S3, ADLS, or GCS), that adds a transactional
metadata layer on top so it behaves like a warehouse (ACID transactions, schema enforcement, fast SQL) while
keeping the lake's openness (any file format, direct access from Spark, ML libraries, or BI tools).</p>
<ul>
  <li><strong>Data warehouse.</strong> Structured, schema-on-write, optimized for SQL/BI, historically poor at
  unstructured data (images, audio, free-form JSON) and expensive to scale storage independently of compute.</li>
  <li><strong>Data lake.</strong> Cheap object storage holding any file type, schema-on-read, great for data
  science and ML, but historically lacked ACID transactions, so concurrent readers/writers could see corrupt or
  half-written data (the "data swamp" problem).</li>
  <li><strong>Lakehouse.</strong> A data lake (cheap object storage, open file formats) with a transactional layer
  — Delta Lake — added on top, giving ACID transactions, schema enforcement, time travel, and fast SQL performance
  directly on the lake, so one copy of data serves BI, data engineering, and ML/AI without duplicating it into a
  separate warehouse.</li>
</ul>

<h2>2.2 The medallion architecture: more than three tables</h2>
<p>Raw data arriving from source systems is rarely clean or query-ready. Instead of transforming it in one giant
step, Databricks recommends staging it through progressively refined layers within the lakehouse, each stored as
its own set of Delta tables. Think of it like a kitchen: raw ingredients arrive in the loading dock (bronze), get
washed and trimmed in prep (silver), and are plated as finished dishes ready to serve (gold). This staged approach
is called the <strong>medallion architecture</strong> — but "bronze, silver, gold" names three tiers of data
quality, not a rigid three-table pipeline. What actually defines the pattern is a set of contracts about what each
layer guarantees to the layer below it, and those contracts carry real characteristics well beyond the layer names.</p>
<table>
  <tr><th>Layer</th><th>Purpose</th><th>Typical operations</th></tr>
  <tr><td><strong>Bronze</strong></td><td>Raw, unprocessed ingestion — an exact or near-exact copy of the source
  data, often with ingestion metadata added.</td><td>Append-only loads via Auto Loader / <code>COPY INTO</code>;
  minimal or no transformation; schema is whatever the source sends.</td></tr>
  <tr><td><strong>Silver</strong></td><td>Cleaned, filtered, conformed data — deduplicated, type-cast, joined with
  reference data, bad records removed or quarantined.</td><td><code>MERGE</code>, filtering, joins, data quality
  constraints.</td></tr>
  <tr><td><strong>Gold</strong></td><td>Business-level aggregates and marts — ready for BI dashboards, reporting,
  and ML feature tables.</td><td>Aggregations, rollups, star-schema-style modeling.</td></tr>
</table>

<div class="diagram">
  <svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="40" width="140" height="60" rx="6"></rect>
    <text x="80" y="65" text-anchor="middle" font-size="13" font-weight="600">Bronze</text>
    <text x="80" y="82" text-anchor="middle" font-size="10" class="dim">raw, as-is</text>

    <path class="connector" d="M150 70 L228 70" marker-end="url(#arrow)"></path>

    <rect x="230" y="40" width="140" height="60" rx="6"></rect>
    <text x="300" y="65" text-anchor="middle" font-size="13" font-weight="600">Silver</text>
    <text x="300" y="82" text-anchor="middle" font-size="10" class="dim">cleaned, conformed</text>

    <path class="connector" d="M370 70 L448 70" marker-end="url(#arrow)"></path>

    <rect x="450" y="40" width="140" height="60" rx="6"></rect>
    <text x="520" y="65" text-anchor="middle" font-size="13" font-weight="600">Gold</text>
    <text x="520" y="82" text-anchor="middle" font-size="10" class="dim">aggregated, BI-ready</text>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">Medallion architecture: each hop is a separate, independently queryable Delta table.</div>
</div>

<p>Data flows bronze → silver → gold, and each hop is its own Delta table, queryable independently — this is why
it's also called a <strong>multi-hop architecture</strong>. Analysts typically query gold; engineers build and
maintain all three layers.</p>

<h2>2.3 Characteristics that actually define each layer</h2>
<p>Two pipelines that both claim to implement "bronze, silver, gold" can look very different underneath — what
makes the pattern coherent isn't the layer names, it's a set of properties each layer is expected to uphold for the
layer that depends on it.</p>
<ul>
  <li><strong>Bronze is append-only and schema-permissive on purpose.</strong> Bronze is meant to be the single
  source of truth for "what did the source actually send," which means it should never overwrite or mutate history
  — new data is appended, not merged in place — and its column types are often left loose (string, binary, or the
  <code>variant</code> type covered in section 7) rather than strictly typed, specifically so an unexpected upstream
  schema change doesn't break ingestion. Getting bronze's typing "wrong" is a feature, not a bug: strict typing is
  silver's job, not bronze's.</li>
  <li><strong>Bronze ingestion must be idempotent.</strong> Ingestion jobs fail and get re-run — a cluster dies
  mid-load, a job times out, someone manually re-triggers a backfill. If re-running the same bronze load twice
  produces duplicate rows, every downstream layer inherits that corruption silently. Auto Loader and
  <code>COPY INTO</code> (section 10) are both built idempotent by design — they track which source files have
  already been loaded and skip them on a re-run — precisely so replay is always safe.</li>
  <li><strong>Silver enforces an explicit schema contract, not just "cleaning."</strong> The schema silver expects
  from bronze, and the schema gold expects from silver, should be an explicit, validated contract — not an implicit
  assumption baked into transformation code that breaks mysteriously when upstream changes. Table constraints
  (<code>NOT NULL</code>, <code>CHECK</code> — section 11) are one mechanism for making that contract enforced by
  the engine rather than just documented.</li>
  <li><strong>Silver is not always one table per source.</strong> In practice silver frequently splits into
  sub-stages: a "cleaned" pass that only fixes types and removes obvious garbage, followed by a separate "conformed"
  or "enriched" pass that joins in reference/dimension data and applies business vocabulary — two silver tables
  feeding each other, not one. Some architectures explicitly document this as bronze → silver (cleaned) →
  silver (enriched) → gold.</li>
  <li><strong>Gold is intentionally query-shaped, not just "aggregated."</strong> Gold tables are optimized for how
  they'll be read, not how they were computed — this often means denormalized, wide tables or star-schema fact/dimension
  models rather than a normalized structure, because the audience is a BI tool or dashboard doing repeated filtered
  aggregations, and reshaping data for read performance is exactly gold's job. Gold tables are also the most
  performance-sensitive to tune (<code>OPTIMIZE</code>/<code>ZORDER</code>, section 3) since they're queried far
  more often than they're written.</li>
</ul>

<h2>2.4 Variants: more than three layers, and not always linear</h2>
<p>"Bronze, silver, gold" is the standard vocabulary, but production architectures regularly deviate from a strict
three-table chain, and the exam's scenario questions test whether the reader can recognize the *pattern* (raw →
validated → business-ready) even when the layer count or naming differs.</p>
<ul>
  <li><strong>Landing zone before bronze.</strong> Some pipelines add a raw "landing" area (sometimes itself called
  a fourth, unnamed layer) that holds files exactly as delivered, untouched even by the ingestion-metadata columns
  bronze adds — bronze is then the first *table*, while landing is just a storage location, not a table at all.</li>
  <li><strong>Platinum / additional layers.</strong> Some organizations add a layer beyond gold (occasionally called
  "platinum") for highly specialized, heavily pre-joined marts serving a single application or ML feature store,
  when a single gold layer would otherwise need to serve too many divergent consumers efficiently.</li>
  <li><strong>Fan-out, not a straight line.</strong> A single silver table commonly feeds multiple gold tables (one
  gold table per dashboard or business domain), and a single gold table can be built by joining multiple silver
  tables — the dependency graph is a DAG, not a straight pipe, even though data quality still only ever increases
  moving from bronze toward gold.</li>
  <li><strong>Streaming vs. batch changes the shape, not the contract.</strong> When a hop is implemented as a
  continuous Structured Streaming or Delta Live Tables streaming table rather than a scheduled batch job, the
  bronze→silver→gold quality contract still holds, but each hop now needs to handle late-arriving data and
  watermarking rather than assuming a clean, complete batch is available at run time — the architectural pattern is
  the same, the execution model underneath it is not.</li>
</ul>

<h2>2.5 Where Delta Lake fits</h2>
<p><strong>Delta Lake</strong> is the open-source storage layer that makes the lakehouse possible — it's the
technology, not the architecture pattern itself (that's the "lakehouse" or "medallion" pattern). Every table in
Databricks is a Delta table by default. The full mechanics (transaction log, ACID, time travel) are covered in
section 3; for now, know that Delta Lake is *what* provides warehouse-like reliability on top of lake storage,
while the lakehouse/medallion architecture is *how* you organize data using that reliability.</p>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam questions often describe a scenario (e.g., "raw JSON files landing from IoT devices need to be queryable
  reliably by analysts within minutes") and ask which layer or which technology solves it. Map the *scenario's
  keywords* to the layer: "raw," "as-is," "landing" → bronze. "cleaned," "deduplicated," "validated" → silver.
  "aggregated," "dashboard-ready," "KPI" → gold. A second common trap: a question describes more than three tables
  (e.g., a "cleaned" and a separate "enriched" silver table) and asks how many medallion layers exist — the answer
  is still conceptually three (bronze/silver/gold), because sub-stages within a layer don't create a new layer,
  they're an implementation detail of that layer's contract. Don't confuse "lakehouse" (the overall architecture)
  with "Delta Lake" (the specific storage format/transaction layer that implements it) — both terms appear as
  distractors for each other in answer choices.
</div>

<h1>3. Databricks Platform Structure</h1>

<h2>3.1 Workspaces and compute</h2>
<p>Imagine handing a team a shared office building: individual desks for working alone, meeting rooms for
collaborating, a filing system everyone can browse, and a reception desk that controls who gets in. A Databricks
<strong>workspace</strong> is that building — it's the deployment unit that groups together notebooks, cluster
definitions, jobs, and access to data, all tied to one region and one cloud account. Nothing runs by itself inside
a workspace, though; every notebook, SQL query, or job needs actual compute (CPU/memory) behind it, and that
compute comes from a <strong>cluster</strong> — a set of cloud VMs (one driver node plus zero or more worker nodes)
running Apache Spark that Databricks provisions, configures, and tears down on request.</p>
<ul>
  <li><strong>Workspace.</strong> The top-level environment a user logs into; contains the workspace file browser
  (notebooks, folders, Repos), a data explorer view into Unity Catalog, cluster and job definitions, and
  workspace-level admin settings. Most exam scenarios about "where do I find/configure X" are really asking which
  part of the workspace UI or object model X lives in.</li>
  <li><strong>Cluster.</strong> A named group of VMs running Spark, defined by a Databricks Runtime version, a node
  type/size, and a sizing policy (fixed or autoscaling). Clusters are billed per second while running and
  auto-terminate after a configurable idle period to avoid paying for idle compute.</li>
  <li><strong>Databricks Runtime (DBR).</strong> The pre-built image a cluster boots from — Apache Spark plus
  optimizations, common libraries, and drivers pre-installed. Variants exist for ML (adds ML libraries) and Photon
  (adds the vectorized native engine described below).</li>
</ul>

<h2>3.2 Cluster types, policies, and autoscaling</h2>
<p>Not every workload needs the same cluster for the same reason. A data analyst poking around in a notebook
during business hours needs a cluster that stays warm and responsive; a nightly ETL pipeline needs a cluster that
spins up at 2am, runs one job, and disappears — nobody should be paying for that ETL cluster to sit idle all day.
Databricks separates these into two cluster types so cost and lifecycle match the use case.</p>
<table>
  <tr><th>Cluster type</th><th>Created by</th><th>Lifecycle</th><th>Typical use</th></tr>
  <tr><td><strong>All-purpose cluster</strong></td><td>A user, manually, from the Compute UI</td><td>Stays up until
  manually terminated or idle-timeout is hit; can be shared by multiple users/notebooks at once</td><td>Interactive
  development, ad hoc SQL/exploration, notebook collaboration</td></tr>
  <tr><td><strong>Job cluster</strong></td><td>Automatically, by the Jobs scheduler, from a job's own config</td>
  <td>Created when the job run starts, terminated the moment the job finishes</td><td>Scheduled/automated
  production pipelines (ETL, ML training runs)</td></tr>
</table>
<p>Job clusters are cheaper per DBU than all-purpose clusters precisely because they aren't meant to be shared or
kept warm — the exam frequently tests this cost trade-off directly. Two more controls shape how any cluster
behaves:</p>
<ul>
  <li><strong>Cluster policies.</strong> Admin-defined templates that restrict which cluster configurations a user
  is allowed to create — capping max nodes, forcing a specific instance type, restricting which DBR versions are
  selectable, or hiding options entirely. Policies exist to control cost and enforce compliance without needing
  every user to be a cluster-configuration expert; a user assigned a restrictive policy simply sees fewer choices
  in the cluster creation UI.</li>
  <li><strong>Autoscaling.</strong> Instead of fixing the worker count, a cluster is given a min and max range, and
  Databricks adds or removes worker nodes automatically based on current load (e.g., a Spark stage queuing many
  pending tasks triggers scale-up; idle workers get removed after a cool-down). This avoids both over-provisioning
  (paying for peak capacity all the time) and under-provisioning (jobs queuing because there aren't enough
  workers).</li>
  <li><strong>Photon.</strong> A native, vectorized query engine (written in C++, not JVM-based like standard
  Spark execution) that can be enabled on a cluster to accelerate SQL and DataFrame operations — same Spark API,
  faster execution underneath, particularly for scan/filter/aggregate/join-heavy SQL workloads. It's a checkbox on
  cluster configuration, not a different product.</li>
</ul>

<h2>3.3 Notebooks and magic commands</h2>
<p>A Databricks <strong>notebook</strong> is the primary interface for writing and running code interactively — a
sequence of cells that execute against a cluster, mixing code, output (tables, plots), and documentation in one
document, similar in spirit to a Jupyter notebook but attached to a live Spark cluster rather than a local kernel.
Each notebook has a default language, but any cell can override that default for a single cell using a
<strong>magic command</strong> — a line starting with <code>%</code> as the first character of the cell.</p>
<table>
  <tr><th>Magic command</th><th>Effect</th></tr>
  <tr><td><code>%sql</code></td><td>Run the cell's contents as Spark SQL, regardless of the notebook's default
  language</td></tr>
  <tr><td><code>%python</code></td><td>Run the cell as PySpark/Python</td></tr>
  <tr><td><code>%scala</code> / <code>%r</code></td><td>Run the cell as Scala or R respectively</td></tr>
  <tr><td><code>%md</code></td><td>Render the cell as Markdown (headers, bullets, formatted text) instead of
  executing it as code — used for documentation cells inside a notebook</td></tr>
  <tr><td><code>%run</code></td><td>Execute another notebook in the context of the current one, making that
  notebook's defined variables and functions available afterward — used to share setup/utility code across
  notebooks</td></tr>
  <tr><td><code>%fs</code></td><td>Run a DBFS filesystem command (shorthand for <code>dbutils.fs</code>), e.g.
  <code>%fs ls /mnt/data</code></td></tr>
  <tr><td><code>%sh</code></td><td>Run a shell command on the driver node</td></tr>
</table>
<pre><code>-- A cell in a Python-default notebook, switched to SQL for this one cell
%sql
SELECT customer_id, SUM(amount) AS total_spend
FROM sales.transactions
GROUP BY customer_id
ORDER BY total_spend DESC
LIMIT 10;</code></pre>
<p><code>%run</code> is the basis of simple <strong>notebook workflows</strong> — chaining notebooks together by
having one notebook call another with <code>%run "./setup_notebook"</code>. This differs from the Jobs-based
multi-task orchestration covered later: <code>%run</code> is a synchronous, in-notebook include mechanism (the
called notebook's variables leak into the caller), whereas <code>dbutils.notebook.run(...)</code> runs the target
notebook as a separate job with its own isolated context and an explicit return value, which is the pattern used
when one notebook needs to trigger another as a distinct, parameterized step.</p>

<h2>3.4 Databricks Repos</h2>
<p>Notebooks edited only inside the workspace UI have no version history beyond Databricks' own revision snapshots
and no way to branch, review, or merge changes the way a software team normally works. <strong>Databricks
Repos</strong> solves this by linking a folder in the workspace directly to a Git remote (GitHub, GitLab,
Bitbucket, Azure DevOps) — notebooks and files inside a Repos folder can be pulled, committed, pushed, and branched
using a Git panel inside the workspace UI, without leaving Databricks. This is what enables production CI/CD
patterns: developing on a feature branch in a Repo, opening a pull request reviewed outside Databricks, and having
a job reference a specific branch, tag, or commit of that Repo when it runs.</p>
<ul>
  <li><strong>Repo-level Git operations.</strong> Clone, pull, push, create/switch branch, and resolve merge
  conflicts are all available from the Repos UI; the underlying files are plain <code>.py</code>/<code>.sql</code>
  source files (or notebook-formatted source) that a Git remote sees as ordinary text, not a Databricks-proprietary
  binary format.</li>
  <li><strong>Jobs referencing a Repo.</strong> A Job task can point at a notebook path inside a Repos folder and
  pin it to a specific branch, which is the standard way to promote code from dev to staging to production without
  manually copying notebooks between workspaces.</li>
</ul>

<h2>3.5 Jobs (introduction)</h2>
<p>A <strong>Job</strong> is Databricks' mechanism for running code on a schedule or trigger without a person
manually opening a notebook and clicking "run" — one or more tasks (a notebook, a SQL query, a JAR, a Python
script) wired together with dependencies, run on a job cluster, with configurable retries, alerting, and a run
history. Deeper orchestration concepts — multi-task DAGs, triggers, parameter passing between tasks — belong to a
later, dedicated section; for this foundations layer, it's enough to know that a Job is the automation/scheduling
layer that sits on top of the notebooks and clusters already described, and that it defaults to spinning up its
own job cluster per run rather than reusing an all-purpose cluster.</p>

<h2>3.6 The Unity Catalog object model</h2>
<p>Before Unity Catalog, each workspace kept its own separate Hive metastore, so the same table name in two
different workspaces could refer to two entirely different (and inconsistently permissioned) datasets — there was
no single place to look up what data existed or who could see it across an organization. <strong>Unity
Catalog</strong> fixes this by introducing one governance layer above the workspace: a single hierarchy of objects
that every workspace attached to it shares, so a table's identity, permissions, and lineage are consistent no
matter which workspace someone queries it from.</p>
<table>
  <tr><th>Level</th><th>What it represents</th><th>Example</th></tr>
  <tr><td><strong>Metastore</strong></td><td>The top-level container for Unity Catalog metadata, created once per
  region and attached to one or more workspaces</td><td>One per cloud region, typically one per organization
  within that region</td></tr>
  <tr><td><strong>Catalog</strong></td><td>The first level of the three-level namespace; groups related schemas,
  often used to separate environments or business units</td><td><code>prod</code>, <code>dev</code>,
  <code>marketing</code></td></tr>
  <tr><td><strong>Schema (database)</strong></td><td>A logical grouping of tables/views/functions/volumes within a
  catalog — the terms "schema" and "database" are used interchangeably in Databricks SQL</td><td><code>sales</code>,
  <code>finance</code></td></tr>
  <tr><td><strong>Table / View</strong></td><td>The actual queryable data (managed or external Delta tables) or a
  saved query over other tables (view)</td><td><code>orders</code>, <code>customer_summary_vw</code></td></tr>
  <tr><td><strong>Volume</strong></td><td>Governed access to non-tabular files (images, PDFs, arbitrary files) — a
  storage location managed like a table but for raw files rather than structured rows</td><td>A folder of raw
  image files used for ML training</td></tr>
  <tr><td><strong>Function</strong></td><td>A registered SQL or Python user-defined function, governed and shared
  the same way tables are</td><td>A custom <code>mask_email()</code> function</td></tr>
</table>

<div class="diagram">
  <svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
    <rect x="240" y="8" width="160" height="34" rx="5"></rect>
    <text x="320" y="30" text-anchor="middle" font-size="12" font-weight="600">Metastore</text>

    <path class="connector" d="M320 42 L160 78"></path>
    <path class="connector" d="M320 42 L320 78"></path>
    <path class="connector" d="M320 42 L480 78"></path>

    <rect x="90" y="78" width="140" height="34" rx="5"></rect>
    <text x="160" y="100" text-anchor="middle" font-size="11" font-weight="600">Catalog: dev</text>
    <rect x="250" y="78" width="140" height="34" rx="5"></rect>
    <text x="320" y="100" text-anchor="middle" font-size="11" font-weight="600">Catalog: prod</text>
    <rect x="410" y="78" width="140" height="34" rx="5"></rect>
    <text x="480" y="100" text-anchor="middle" font-size="11" font-weight="600">Catalog: marketing</text>

    <path class="connector" d="M320 112 L320 148"></path>
    <rect x="250" y="148" width="140" height="34" rx="5"></rect>
    <text x="320" y="167" text-anchor="middle" font-size="11" font-weight="600">Schema: sales</text>
    <text x="320" y="179" text-anchor="middle" font-size="9" class="dim">tables · views · volumes · functions</text>
  </svg>
  <div class="diagram-caption">Unity Catalog three-level namespace: catalog.schema.table (e.g. prod.sales.orders).</div>
</div>

<p>Every securable object is addressed with a <strong>three-level namespace</strong>: <code>catalog.schema.table</code>.
This is what lets the same short table name exist safely in multiple catalogs (e.g., a <code>sales.orders</code>
schema present in both <code>dev</code> and <code>prod</code> catalogs) without collision.</p>
<pre><code>-- Fully qualified three-level reference
SELECT *
FROM prod.sales.orders
WHERE order_date >= '2026-01-01';

-- Setting context so unqualified names resolve within it
USE CATALOG prod;
USE SCHEMA sales;
SELECT * FROM orders;   -- resolves to prod.sales.orders

-- Creating objects following the same hierarchy
CREATE CATALOG IF NOT EXISTS prod;
CREATE SCHEMA IF NOT EXISTS prod.sales;
CREATE TABLE prod.sales.orders (
  order_id BIGINT,
  customer_id BIGINT,
  amount DECIMAL(10,2)
);</code></pre>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Exam questions like to swap "cluster" and "job" or "all-purpose" and "job cluster" in distractor answers — remember
  the deciding factor is who/what created it and whether it's meant to be shared: a user clicking "create cluster"
  is always all-purpose, and anything the Jobs scheduler spins up automatically for a scheduled run is a job
  cluster, even if its hardware config looks identical. Separately, don't confuse a Unity Catalog <strong>schema</strong>
  with a <strong>metastore</strong> — a schema is a namespace level *inside* a catalog, while a metastore is the
  account-level container that catalogs themselves live in; only one metastore is typically attached per region,
  but there can be many catalogs and far more schemas underneath it.
</div>

<h1>4. Delta Lake Fundamentals</h1>

<h2>4.1 What ACID means on a data lake</h2>
<p>Imagine two pipelines writing to the same folder of Parquet files at once: one is appending today's orders,
the other is running a cleanup job that rewrites the same files to remove duplicates. On a plain data lake there is
no coordination between them — a reader querying at just the wrong moment might see half of the new files and none
of the old ones, or a crashed write might leave a partially-written file that breaks every query touching it until
someone manually cleans it up. There's no concept of a query "seeing" the table as it looked at one consistent
instant. Delta Lake solves this by wrapping every write in a transaction with the same guarantees relational
databases have offered for decades — <strong>ACID</strong> — implemented not by a database engine but by a
transaction log sitting alongside the data files.</p>
<table>
  <tr><th>Guarantee</th><th>Meaning on Delta Lake</th></tr>
  <tr><td><strong>Atomicity</strong></td><td>A write either fully commits (all its file adds/removes are recorded)
  or fully fails and is invisible — no reader ever sees a half-finished write.</td></tr>
  <tr><td><strong>Consistency</strong></td><td>A write that would violate the table's schema or constraints is
  rejected before it's committed, so the table never moves from one valid state to an invalid one.</td></tr>
  <tr><td><strong>Isolation</strong></td><td>Concurrent readers and writers don't interfere with each other's view
  of the table — Delta Lake uses optimistic concurrency control, detecting conflicting concurrent writes at commit
  time and failing/retrying one of them rather than corrupting data.</td></tr>
  <tr><td><strong>Durability</strong></td><td>Once a commit succeeds, it's permanently recorded in the transaction
  log stored on the same durable cloud object storage as the data itself (S3/ADLS/GCS), surviving cluster restarts
  or crashes.</td></tr>
</table>

<h2>4.2 The transaction log (<code>_delta_log</code>)</h2>
<p>A Delta table is, physically, just a folder of Parquet data files plus one special subfolder:
<code>_delta_log</code>. Every single change to the table — adding files, removing files, changing the schema,
setting table properties — is recorded as an ordered, numbered JSON entry in that folder rather than by mutating
the data files in place. This log is the actual source of truth for what the table "contains" at any moment; the
Parquet files on their own are meaningless without it, because two different commits can reference overlapping
files and only the log says which ones are currently "live."</p>
<ul>
  <li><strong>JSON commit files.</strong> Each transaction produces one file named by a zero-padded, monotonically
  increasing version number, e.g. <code>000000000000000042.json</code>. It lists the exact set of actions taken —
  which Parquet files were added, which were logically removed (tombstoned, not necessarily deleted from storage
  yet), any schema change, and commit metadata like the operation type and timestamp. Reading a table at version 42
  means replaying every commit from 0 through 42 to know the current live file set.</li>
  <li><strong>Checkpoint files.</strong> Replaying thousands of individual JSON commits on every query would be
  slow, so after every 10 commits (by default) Delta Lake writes a <strong>checkpoint</strong> — a Parquet file
  summarizing the entire cumulative table state (the full live file list) as of that version. A reader can jump
  straight to the latest checkpoint at or before the version it wants and only replay the handful of JSON commits
  after it, instead of replaying from version 0 every time.</li>
  <li><strong>How readers get a consistent snapshot.</strong> When a query starts, the engine reads the log (via
  the latest checkpoint plus any newer JSON commits) once to resolve the exact set of Parquet files that make up
  "the table right now," and reads only those files for the rest of the query — even if another write commits
  and changes the file set while the query is still running. This is what delivers snapshot isolation without
  locking the table.</li>
</ul>
<pre><code>-- Inspecting the physical layout (illustrative — via %fs or a cloud CLI)
%fs ls /mnt/datalake/sales/orders/_delta_log
-- 00000000000000000000.json
-- 00000000000000000001.json
-- ...
-- 00000000000000000010.checkpoint.parquet
-- 00000000000000000010.json
-- _last_checkpoint</code></pre>

<div class="diagram">
  <svg viewBox="0 0 640 130" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="20" width="70" height="34" rx="5"></rect>
    <text x="45" y="41" text-anchor="middle" font-size="10">v0.json</text>
    <rect x="95" y="20" width="70" height="34" rx="5"></rect>
    <text x="130" y="41" text-anchor="middle" font-size="10">v1.json</text>
    <text x="200" y="41" text-anchor="middle" font-size="14" class="dim">...</text>
    <rect x="235" y="20" width="90" height="34" rx="5"></rect>
    <text x="280" y="36" text-anchor="middle" font-size="10">v10</text>
    <text x="280" y="48" text-anchor="middle" font-size="9" class="dim">checkpoint</text>
    <rect x="340" y="20" width="70" height="34" rx="5"></rect>
    <text x="375" y="41" text-anchor="middle" font-size="10">v11.json</text>
    <rect x="425" y="20" width="70" height="34" rx="5"></rect>
    <text x="460" y="41" text-anchor="middle" font-size="10">v12.json</text>

    <path class="connector" d="M240 70 Q325 95 460 70" marker-end="url(#arrow2)"></path>
    <text x="325" y="100" text-anchor="middle" font-size="10" class="dim">reader jumps to checkpoint, replays only newer commits</text>

    <defs>
      <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color: var(--text-dim);"></path>
      </marker>
    </defs>
  </svg>
  <div class="diagram-caption">Reading version 12 = latest checkpoint (v10) + replay of v11, v12 — not replay from v0.</div>
</div>

<h2>4.3 Schema enforcement vs. schema evolution</h2>
<p>By default, Delta Lake behaves strictly: if an incoming write has columns that don't match the target table's
declared schema — extra columns, missing columns, or a mismatched type — the write is rejected outright rather than
silently coercing or dropping data. This is <strong>schema enforcement</strong>, and it exists to stop a malformed
or unexpected upstream change from silently corrupting a downstream table. But schemas do legitimately change over
time (a source system adds a new field), and rejecting every such write would break pipelines that should
gracefully absorb the new column. <strong>Schema evolution</strong> is the opt-in escape hatch that lets a write
widen the target table's schema instead of failing.</p>
<table>
  <tr><th>Option</th><th>Effect</th></tr>
  <tr><td><code>mergeSchema</code></td><td>When set to true on a write, new columns present in the incoming data
  but absent from the table are added to the table schema automatically instead of causing a failure. Existing
  columns must still be type-compatible.</td></tr>
  <tr><td><code>overwriteSchema</code></td><td>When set to true on an <code>overwrite</code> write, replaces the
  table's schema entirely with the incoming DataFrame's schema — used when a table needs to intentionally drop or
  fundamentally restructure columns, not just add new ones.</td></tr>
</table>
<pre><code>-- Python: allow new columns to be added automatically
df.write.format("delta") \\
  .mode("append") \\
  .option("mergeSchema", "true") \\
  .saveAsTable("prod.sales.orders")

-- Python: fully replace the table's schema on overwrite
df.write.format("delta") \\
  .mode("overwrite") \\
  .option("overwriteSchema", "true") \\
  .saveAsTable("prod.sales.orders")</code></pre>
<p>Both are opt-in per write, not a table-level toggle left permanently on — leaving <code>mergeSchema</code>
enabled on every routine write defeats the point of enforcement, since it means any accidental extra column from a
buggy upstream job gets silently absorbed into the table forever instead of failing loudly.</p>

<h2>4.4 Time travel</h2>
<p>Because the transaction log keeps every historical commit rather than overwriting data files in place, a Delta
table isn't just "the current state" — it's every state the table has ever been in, each addressable by version
number or timestamp. <strong>Time travel</strong> is querying the table as it existed at a prior point, which is
useful for auditing what changed, reproducing a report exactly as it looked on a past date, or recovering from a
bad write without restoring from a separate backup system.</p>
<pre><code>-- View the full commit history: version, timestamp, operation, user
DESCRIBE HISTORY prod.sales.orders;

-- Query as of a specific version number
SELECT * FROM prod.sales.orders VERSION AS OF 42;

-- Query as of a specific timestamp
SELECT * FROM prod.sales.orders TIMESTAMP AS OF '2026-08-01T00:00:00Z';

-- Equivalent syntax using @ notation on the table name
SELECT * FROM prod.sales.orders@v42;

-- Roll the table itself back to a prior version (this IS a new write/commit)
RESTORE TABLE prod.sales.orders TO VERSION AS OF 42;</code></pre>
<p><code>RESTORE TABLE</code> doesn't erase history — it creates a *new* commit that makes the table's live file set
match version 42 again, so the restore itself shows up as a new entry in <code>DESCRIBE HISTORY</code>, and it's
possible to time-travel to before the restore too. Time travel depends on the old data files still physically
existing in storage — which is exactly what table maintenance below can delete.</p>

<h2>4.5 Table maintenance: <code>OPTIMIZE</code>, <code>ZORDER BY</code>, and <code>VACUUM</code></h2>
<p>Streaming or frequent small writes leave a Delta table's storage layer fragmented — hundreds of tiny Parquet
files instead of a few well-sized ones — and every query has to open and read each of those small files
separately, which is slow. Over time, old versions' now-unreferenced files also pile up in storage, since Delta
Lake never deletes a data file just because a newer commit stopped using it (that's what makes time travel work).
Three commands manage this lifecycle.</p>
<table>
  <tr><th>Command</th><th>Purpose</th><th>Effect on time travel</th></tr>
  <tr><td><code>OPTIMIZE</code></td><td>Compacts many small files into fewer, larger files (bin-packing), improving
  read performance</td><td>Old small files remain on disk (referenced by old versions) until vacuumed</td></tr>
  <tr><td><code>ZORDER BY</code></td><td>Co-locates related data within those compacted files by clustering rows
  on the specified column(s), so a filter on that column can skip reading files that don't contain matching
  ranges (data skipping via file-level min/max statistics)</td><td>Same as OPTIMIZE — it's a modifier on it</td></tr>
  <tr><td><code>VACUUM</code></td><td>Physically deletes data files that are no longer referenced by the current
  table version and are older than the retention threshold</td><td>Permanently breaks time travel to any version
  that depended on the deleted files</td></tr>
</table>
<pre><code>-- Compact small files into larger ones
OPTIMIZE prod.sales.orders;

-- Compact AND cluster on frequently-filtered columns for data skipping
OPTIMIZE prod.sales.orders
ZORDER BY (customer_id, order_date);

-- Remove files older than the default 7-day (168 hour) retention window
VACUUM prod.sales.orders;

-- Preview what WOULD be deleted, without deleting anything
VACUUM prod.sales.orders DRY RUN;

-- Force a shorter retention window (dangerous — see gotcha)
VACUUM prod.sales.orders RETAIN 24 HOURS;</code></pre>
<p><code>ZORDER BY</code> only makes sense on columns actually used in query filters — Z-ordering on a column
nobody filters on burns compute during <code>OPTIMIZE</code> for zero query-time benefit, and Z-ordering on too
many columns dilutes the clustering effectiveness of each one. <code>VACUUM</code>'s default retention is 7 days
specifically because that's the same default window Delta Lake assumes is safe for concurrent long-running
queries and time-travel use — going below it requires explicitly disabling a safety check.</p>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  Running <code>VACUUM</code> with a retention period shorter than 7 days (Databricks requires explicitly setting
  <code>spark.databricks.delta.retentionDurationCheck.enabled = false</code> to even allow it) is the single most
  cited real-world Delta Lake incident: any query still reading an older snapshot — a long-running report, a
  concurrent time-travel query, or a streaming reader that hasn't caught up — can have its underlying files deleted
  out from under it mid-query, causing hard failures with no way to recover that specific version's data, since
  <code>VACUUM</code> is an irreversible physical delete, not a soft delete. On the exam, treat "someone ran VACUUM
  with a 1-hour retention and now time travel is broken / a report failed" as the textbook cautionary scenario, and
  remember <code>OPTIMIZE</code>/<code>ZORDER BY</code> never delete anything themselves — only <code>VACUUM</code>
  does.
</div>
`},"governance-security":{html:`
<h1>5. Security & Governance Basics</h1>

<h2>5.1 Unity Catalog as the centralized governance layer</h2>
<p>Picture an organization where every workspace kept its own guest list: a data engineer granted access to a
table in the "dev" workspace, but nobody could tell whether that same permission carried over to "staging," and
auditing "who can see customer PII" meant checking every workspace's list separately, by hand. That was the reality
before Unity Catalog, when access control lived in each workspace's own <strong>Hive metastore</strong> using
<strong>table ACLs</strong> — permissions granted per-workspace, with no shared identity for a table across
workspaces and no unified audit trail. <strong>Unity Catalog</strong> replaces that model with one governance
layer above all workspaces attached to it: permissions, auditing, and lineage are defined once, at the catalog
object level, and apply consistently no matter which workspace a user queries from.</p>
<ul>
  <li><strong>Legacy Hive metastore / table ACLs.</strong> Per-workspace permission model, no cross-workspace
  identity for data objects, permissions managed with a narrower, workspace-scoped <code>GRANT</code> syntax, and
  no built-in lineage. Still encountered on older workspaces or in exam questions testing whether the difference is
  understood, but Databricks positions all new deployments on Unity Catalog.</li>
  <li><strong>Unity Catalog.</strong> Account-level metastore (see section 3) shared across workspaces, a single
  place to grant/audit permissions on catalogs, schemas, tables, views, volumes, and functions, plus automatic
  lineage tracking and centralized audit logging of every query and grant.</li>
</ul>

<h2>5.2 Granting and revoking privileges</h2>
<p>Unity Catalog permissions follow the same object hierarchy as the data itself (metastore → catalog → schema →
table/view/volume/function), and privileges granted at a higher level are inherited by everything beneath it — so
granting <code>USE CATALOG</code> plus <code>SELECT</code> at the catalog level implicitly covers every schema and
table inside it, without granting each table individually. Access is controlled with standard SQL
<code>GRANT</code>/<code>REVOKE</code> statements naming a privilege, an object, and a principal.</p>
<pre><code>-- Allow a group to see and query everything in a schema
GRANT USE CATALOG ON CATALOG prod TO \`analysts\`;
GRANT USE SCHEMA ON SCHEMA prod.sales TO \`analysts\`;
GRANT SELECT ON SCHEMA prod.sales TO \`analysts\`;

-- Grant privileges on one specific table only
GRANT SELECT, MODIFY ON TABLE prod.sales.orders TO \`data-engineers\`;

-- Grant to an individual user or a service principal
GRANT SELECT ON TABLE prod.sales.orders TO \`maria@example.com\`;
GRANT SELECT ON TABLE prod.sales.orders TO \`svc-etl-pipeline\`;

-- Revoke a previously granted privilege
REVOKE MODIFY ON TABLE prod.sales.orders FROM \`data-engineers\`;

-- Inspect what's currently granted
SHOW GRANTS ON TABLE prod.sales.orders;</code></pre>
<table>
  <tr><th>Privilege</th><th>Grants the ability to</th></tr>
  <tr><td><code>USE CATALOG</code> / <code>USE SCHEMA</code></td><td>Reference/traverse into the catalog or schema
  (a prerequisite for any object-level privilege underneath to take effect)</td></tr>
  <tr><td><code>SELECT</code></td><td>Read rows from a table or view</td></tr>
  <tr><td><code>MODIFY</code></td><td>Insert, update, delete, or merge rows</td></tr>
  <tr><td><code>CREATE TABLE</code> / <code>CREATE SCHEMA</code></td><td>Create new objects inside a catalog or
  schema</td></tr>
  <tr><td><code>ALL PRIVILEGES</code></td><td>Every applicable privilege on the object at once</td></tr>
</table>

<div class="diagram">
  <svg viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" y="10" width="180" height="34" rx="5"></rect>
    <text x="110" y="32" text-anchor="middle" font-size="11" font-weight="600">GRANT SELECT ON CATALOG prod</text>

    <path class="connector" d="M110 44 L110 78"></path>
    <rect x="20" y="78" width="180" height="34" rx="5"></rect>
    <text x="110" y="100" text-anchor="middle" font-size="11">Schema: prod.sales</text>
    <text x="360" y="100" text-anchor="middle" font-size="10" class="dim">inherits SELECT — no separate grant needed</text>

    <path class="connector" d="M110 112 L110 146"></path>
    <rect x="20" y="146" width="180" height="34" rx="5"></rect>
    <text x="110" y="168" text-anchor="middle" font-size="11">Table: prod.sales.orders</text>
    <text x="360" y="168" text-anchor="middle" font-size="10" class="dim">inherits SELECT — no separate grant needed</text>
  </svg>
  <div class="diagram-caption">A privilege granted at catalog level flows down to every schema and table beneath it.</div>
</div>

<h2>5.3 Principal types</h2>
<p>A <code>GRANT</code> statement always names a <strong>principal</strong> — the identity being granted access —
and Unity Catalog recognizes three kinds, chosen based on whether a human, a group of humans, or a piece of
automation is the one actually running the query.</p>
<ul>
  <li><strong>Users.</strong> Individual human identities, typically synced from the cloud identity provider (e.g.
  Azure AD, Okta via SCIM) into the Databricks account, identified by email/username.</li>
  <li><strong>Groups.</strong> Named collections of users (and optionally other groups), used so permissions are
  granted once to a role like <code>analysts</code> or <code>data-engineers</code> rather than repeated per user —
  adding someone to a group immediately gives them every privilege already granted to that group, which is the
  standard scalable pattern versus granting directly to individuals.</li>
  <li><strong>Service principals.</strong> Non-human identities representing an application, job, or automated
  pipeline (e.g. a scheduled Job running unattended, a CI/CD deployment script) — used so automation authenticates
  and is granted privileges independently of any one human's account, meaning access doesn't break or need
  re-granting if the engineer who originally set up the job leaves.</li>
</ul>

<h2>5.4 Row- and column-level security via dynamic views</h2>
<p>A straight <code>GRANT SELECT</code> is all-or-nothing for a table — everyone with access sees every row and
every column. But real requirements are often finer-grained: a regional sales manager should only see their own
region's rows, or every analyst can see a customer table except the raw <code>ssn</code> column. Unity Catalog
doesn't do row/column security as a separate access-control primitive on the base table; instead, the standard
pattern is a <strong>dynamic view</strong> — a view whose query logic itself filters rows or masks columns based on
who's running it, using functions like <code>CURRENT_USER()</code> or a dedicated column-masking function, and then
granting access to the view instead of the underlying table.</p>
<pre><code>-- Row-level security: each region manager only sees their own region's rows
CREATE VIEW prod.sales.orders_secured AS
SELECT *
FROM prod.sales.orders
WHERE region = (
  SELECT region FROM prod.sales.region_managers
  WHERE manager_email = CURRENT_USER()
);

-- Column-level security: mask a sensitive column unless caller is in a privileged group
CREATE VIEW prod.sales.customers_secured AS
SELECT
  customer_id,
  name,
  CASE
    WHEN is_account_group_member('pii-viewers') THEN ssn
    ELSE 'REDACTED'
  END AS ssn
FROM prod.sales.customers;

-- Users/groups are granted on the VIEW, never on the underlying base table
GRANT SELECT ON VIEW prod.sales.orders_secured TO \`analysts\`;</code></pre>
<p>Because the security logic lives inside the view's query, it's enforced no matter what tool queries it (SQL
editor, BI dashboard, notebook) — the base table itself typically has no direct grants to end users at all, only
to the pipeline that maintains it, so the view is the only door in.</p>

<h2>5.5 Data lineage</h2>
<p>When a gold-layer dashboard number looks wrong, the natural question is "which upstream table or column fed
this, and who last changed it?" — answering that by manually reading pipeline code across bronze, silver, and gold
tables is slow and error-prone, especially once dozens of notebooks and jobs are involved. Unity Catalog
automatically captures <strong>data lineage</strong>: as queries run, it observes which tables and columns were
read and written and builds a lineage graph connecting them, down to the column level, with no manual tagging or
separate metadata pipeline required — it's a byproduct of Unity Catalog simply observing real query execution.</p>
<ul>
  <li><strong>Impact analysis.</strong> Before changing or dropping a table/column, lineage shows every downstream
  table, view, dashboard, and job that depends on it, so a breaking change can be identified before it ships rather
  than discovered from a broken report afterward.</li>
  <li><strong>Debugging.</strong> Tracing a suspicious value in a gold table back through each transformation to
  its bronze source narrows down which step introduced the problem, without reading every notebook in the
  pipeline.</li>
  <li><strong>Compliance.</strong> Regulations that require knowing exactly where a given piece of sensitive data
  (e.g., customer PII) flows to are answered directly by the lineage graph — which tables, views, and even ML
  features were derived from a regulated column — supporting audits without a manually maintained data map.</li>
</ul>
<p>Lineage is viewed in the Catalog Explorer UI as a graph, and is available at both table and column granularity —
column-level lineage is what makes "which downstream columns are derived from this one" answerable rather than just
"which downstream tables touch this table at all."</p>

<div class="gotcha">
  <span class="gotcha-label">Gotcha</span>
  A dynamic view only enforces its row/column security if users are granted access to the *view* and have no
  direct <code>SELECT</code> grant on the *underlying base table* — if a user can query the base table directly,
  they bypass the view's <code>CURRENT_USER()</code> filtering entirely, since the security logic lives in the
  view's SQL, not as a property of the table itself. Exam scenarios that describe row-level security "not working"
  almost always hinge on this: someone has (or a group they belong to has) a lingering direct grant on the base
  table. Separately, lineage is generated only from queries Unity Catalog actually observes running through it —
  data modified by a process outside Unity Catalog's visibility won't appear in the lineage graph.
</div>
